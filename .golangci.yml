# Go backend lint rules.
#
# The section that matters is `depguard`: it turns ADRs 0002 and 0003 into
# import rules a machine can check. Everything else here is style.
#
# Split of responsibilities in CI:
#   architecture.yml  -> `--enable-only=depguard`   (the boundary)
#   lint-go.yml       -> everything else            (the style)
# Deliberately separate: a red check has to say which of the two broke.
#
# No longer inert. `go.mod` exists, so `architecture.yml` runs and these rules
# block: the boundary is watched from the first commit of code, which is what
# ADR 0012 asked for.
#
# Written in English because it is infrastructure, and because these `desc`
# strings are printed into the CI log when a rule fires. The domain nouns
# (`dominio`, `aplicacion`, `infraestructura`, `reparto`, `recaudo`,
# `repertorio`, `identificacion`, `PuertoReloj`) stay in Spanish: they are the
# ubiquitous language of the regulations, and CLAUDE.md forbids translating
# them anywhere, including here.
#
# The module path (`github.com/rosvend/intela`) is confirmed against the `module`
# line of `go.mod`. If the module is ever renamed, every `deny` here has to be
# renamed too: depguard compares strings, it does not resolve packages.

version: "2"

linters:
  default: standard
  enable:
    - depguard

  settings:
    depguard:
      # EVERY rule lists its package directory TWICE, and both lines are load
      # bearing:
      #
      #   **/internal/dominio/*.go      files sitting directly in the package
      #   **/internal/dominio/**/*.go   files in a subpackage below it
      #
      # `**/X/**/*.go` alone does NOT match `X/servicio.go` - the `/**/` has to
      # consume at least one directory - and a Go package keeps its files
      # directly in its own directory. With only that pattern, every rule below
      # silently matched nothing on the layout this codebase actually uses:
      # verified by planting violations in `internal/aplicacion/servicio.go` and
      # `internal/dominio/identificacion/probe.go` and watching depguard pass
      # them. A boundary check that cannot fire is worse than none, because the
      # green check is read as proof.
      rules:
        # ADR 0002: "nada del nucleo nombra nada de afuera". The dominio is the
        # innermost ring: entities, invariants and the calculation functions,
        # with no I/O.
        dominio-no-sale:
          files:
            - "**/internal/dominio/*.go"
            - "**/internal/dominio/**/*.go"
          deny:
            - pkg: github.com/rosvend/intela/internal/aplicacion
              desc: "ADR 0002: dominio is the innermost ring. aplicacion depends on it, never the reverse."
            - pkg: github.com/rosvend/intela/internal/infraestructura
              desc: "ADR 0002: dominio does not name infraestructura. Declare a puerto and let the adapter satisfy it."
            - pkg: net/http
              desc: "ADR 0002: HTTP is an inbound adapter. There is no transport in dominio."
            - pkg: database/sql
              desc: "ADR 0002: persistence enters through a repository puerto."
            - pkg: github.com/jackc/pgx
              desc: "ADR 0002: pgx is the PostgreSQL adapter. It lives in infraestructura."
            - pkg: github.com/go-chi/chi
              desc: "ADR 0002: the router is an inbound adapter."
            - pkg: github.com/riverqueue/river
              desc: "ADR 0002: the queue is infrastructure. dominio does not enqueue."
            - pkg: os
              desc: "ADR 0005: the engine is a pure function. No environment, no files."

        # ADR 0002 requires that "el tiempo entra inyectado", and ADR 0005 says
        # where the port lives: "entra por `PuertoReloj` en la capa de
        # aplicacion". It is declared in `internal/aplicacion/puertos.go` -
        # still core, never infrastructure - because this very rule denies the
        # `time` package inside `internal/dominio`, and `Ahora() time.Time`
        # cannot be declared without importing it. The dominio RECEIVES the
        # instant; it never asks for it.
        #
        # The 3- and 10-year prescriptions and
        # the 15-day windows have to be testable without waiting a decade, and
        # ADR 0005 requires a reparto run to be reproducible bit for bit years
        # later. A loose `time.Now()` or `rand` in the core breaks both
        # silently: it does not fail, it returns a different number.
        #
        # `time` is denied as a PACKAGE; the TYPES (time.Time, time.Duration)
        # arrive as parameters from the puerto, they are not obtained here.
        dominio-sin-reloj-ni-azar:
          files:
            - "**/internal/dominio/*.go"
            - "**/internal/dominio/**/*.go"
          deny:
            - pkg: math/rand
              desc: "ADR 0005: reparto is deterministic. No randomness in the core."
            - pkg: math/rand/v2
              desc: "ADR 0005: reparto is deterministic. No randomness in the core."
            - pkg: time
              desc: "ADR 0002: time enters through PuertoReloj. Take the instant as a parameter."

        # ADR 0002: the aplicacion layer orchestrates and sets transaction
        # boundaries, but it is still core. An HTTP client imported into a use
        # case in a hurry is exactly the risk the ADR accepts by name.
        aplicacion-no-sale:
          files:
            - "**/internal/aplicacion/*.go"
            - "**/internal/aplicacion/**/*.go"
          deny:
            - pkg: github.com/rosvend/intela/internal/infraestructura
              desc: "ADR 0002: puertos are declared here; adapters satisfy them without being imported."
            - pkg: github.com/jackc/pgx
              desc: "ADR 0002: a use case talks to a repository puerto, not to the driver."
            - pkg: github.com/go-chi/chi
              desc: "ADR 0002: the router is an inbound adapter."
            # These five were sitting INSIDE internal/aplicacion and the rule did
            # not catch them: it denied infraestructura, pgx and chi only. All
            # five are adapter concerns, not use-case concerns.
            - pkg: golang.org/x/crypto/bcrypt
              desc: "ADR 0002: the hashing algorithm is an adapter detail. It enters through the Hasher puerto."
            - pkg: encoding/csv
              desc: "ADR 0002: parsing a file format is the job of an ingesta adapter."
            - pkg: github.com/xuri/excelize
              desc: "ADR 0002: reading or writing an .xlsx is the job of an adapter (ingesta or exportacion)."
            - pkg: github.com/johnfercher/maroto
              desc: "ADR 0002: generating a PDF is the job of an export adapter. aplicacion talks to Exportador."
            - pkg: net/http
              desc: "ADR 0002: HTTP is an inbound adapter."
            - pkg: database/sql
              desc: "ADR 0002: persistence enters through a repository puerto."

        # ADR 0003: "Reparto lee de Repertorio y de Recaudo. Ninguno de los dos
        # conoce a Reparto." Go already rejects cycles at compile time; this
        # additionally forbids the one-way edge, which compiles perfectly.
        modulos-repertorio:
          files:
            - "**/internal/dominio/repertorio/*.go"
            - "**/internal/dominio/repertorio/**/*.go"
          deny:
            - pkg: github.com/rosvend/intela/internal/dominio/reparto
              desc: "ADR 0003: reparto reads from repertorio. repertorio does not know reparto."

        modulos-recaudo:
          files:
            - "**/internal/dominio/recaudo/*.go"
            - "**/internal/dominio/recaudo/**/*.go"
          deny:
            - pkg: github.com/rosvend/intela/internal/dominio/reparto
              desc: "ADR 0003: reparto reads from recaudo. recaudo does not know reparto."

        # ADR 0003: "Identificacion escribe alias y emite ONI, y no toca dinero."
        modulos-identificacion:
          files:
            - "**/internal/dominio/identificacion/*.go"
            - "**/internal/dominio/identificacion/**/*.go"
          deny:
            - pkg: github.com/rosvend/intela/internal/dominio/reparto
              desc: "ADR 0003: identificacion does not touch money."
            - pkg: github.com/rosvend/intela/internal/dominio/recaudo
              desc: "ADR 0003: identificacion does not touch money."
            - pkg: github.com/rosvend/intela/internal/dominio/liquidacion
              desc: "ADR 0003: identificacion does not touch money."

        # ONI is the manual queue of what identificacion could not recognise. A
        # uso sitting in ONI is money with no known owner yet, but the queue does
        # not compute how much: it only says the thing is unresolved.
        modulos-oni:
          files:
            - "**/internal/dominio/oni/*.go"
            - "**/internal/dominio/oni/**/*.go"
          deny:
            - pkg: github.com/rosvend/intela/internal/dominio/reparto
              desc: "ADR 0003: the manual queue does not touch money."
            - pkg: github.com/rosvend/intela/internal/dominio/recaudo
              desc: "ADR 0003: the manual queue does not touch money."
            - pkg: github.com/rosvend/intela/internal/dominio/liquidacion
              desc: "ADR 0003: the manual queue does not touch money."

        # Afiliacion keeps the padron: who is a Socio and who a Titular
        # Administrado. Existing in the padron is independent of anything
        # collected or paid.
        modulos-afiliacion:
          files:
            - "**/internal/dominio/afiliacion/*.go"
            - "**/internal/dominio/afiliacion/**/*.go"
          deny:
            - pkg: github.com/rosvend/intela/internal/dominio/reparto
              desc: "ADR 0003: the padron does not depend on a corrida."
            - pkg: github.com/rosvend/intela/internal/dominio/liquidacion
              desc: "ADR 0003: the padron does not depend on what was liquidated."
            - pkg: github.com/rosvend/intela/internal/dominio/anticipos
              desc: "ADR 0003: the padron does not depend on anticipos; it is the other way round."

        # Liquidacion CONSUMES the result of a corrida; it does not recompute it.
        # If it could import the engine, the temptation to recalculate "just to
        # check" would let two different numbers come out of the same proceso.
        modulos-liquidacion:
          files:
            - "**/internal/dominio/liquidacion/*.go"
            - "**/internal/dominio/liquidacion/**/*.go"
          deny:
            - pkg: github.com/rosvend/intela/internal/dominio/recaudo
              desc: "ADR 0003: the bolsa was already resolved upstream, in reparto."
            - pkg: github.com/rosvend/intela/internal/dominio/identificacion
              desc: "ADR 0003: by this point the obras are already identified."

        # A reclamacion does not rewrite a closed corrida: it is settled with a
        # traceable adjustment in a later one, or out of the RD 14 reserve.
        # Reopening a corrida breaks the reproducibility ADR 0005 requires.
        modulos-reclamaciones:
          files:
            - "**/internal/dominio/reclamaciones/*.go"
            - "**/internal/dominio/reclamaciones/**/*.go"
          deny:
            - pkg: github.com/rosvend/intela/internal/dominio/reparto
              desc: "ADR 0005: a reclamacion does not recompute a closed corrida."

        modulos-anticipos:
          files:
            - "**/internal/dominio/anticipos/*.go"
            - "**/internal/dominio/anticipos/**/*.go"
          deny:
            - pkg: github.com/rosvend/intela/internal/dominio/reparto
              desc: "ADR 0003: an anticipo is deducted from a liquidacion, not from a corrida."
            - pkg: github.com/rosvend/intela/internal/dominio/recaudo
              desc: "ADR 0003: an anticipo knows nothing of tarifas or convenios."

        # Prescripcion decides when an amount stops being claimable (RD 15). All
        # it needs are dates and amounts, and both are handed to it.
        modulos-prescripcion:
          files:
            - "**/internal/dominio/prescripcion/*.go"
            - "**/internal/dominio/prescripcion/**/*.go"
          deny:
            - pkg: github.com/rosvend/intela/internal/dominio/reparto
              desc: "ADR 0003: prescribing is not recomputing."
            - pkg: github.com/rosvend/intela/internal/dominio/recaudo
              desc: "ADR 0003: prescripcion knows nothing of tarifas or convenios."

  exclusions:
    rules:
      # Adapters exist precisely in order to import infrastructure.
      - path: internal/infraestructura/
        linters:
          - depguard
      # cmd/ is where everything is wired: knowing both shores is its job.
      - path: cmd/
        linters:
          - depguard

formatters:
  enable:
    - gofmt
    - goimports
