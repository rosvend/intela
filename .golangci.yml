# Reglas de lint del backend Go.
#
# La seccion que importa es `depguard`: traduce los ADR 0002 y 0003 a reglas de
# importacion verificables. Todo lo demas es estilo.
#
# Reparto de responsabilidades en CI:
#   arquitectura.yml  -> `--default=none --enable=depguard`  (la frontera)
#   quality-go.yml    -> el resto                            (el estilo)
# Separados a proposito: un check en rojo debe decir cual de las dos cosas se
# rompio.
#
# Ya no es inerte: `go.mod` existe y el path del modulo
# (`github.com/rosvend/intela`) esta confirmado contra su linea `module`.

version: "2"

linters:
  default: standard
  enable:
    - depguard

  settings:
    depguard:
      rules:
        # ADR 0002: "nada del nucleo nombra nada de afuera". El dominio es el
        # anillo interior: entidades, invariantes y las funciones de calculo,
        # sin E/S.
        dominio-no-sale:
          files:
            - "**/internal/dominio/**/*.go"
          deny:
            - pkg: github.com/rosvend/intela/internal/aplicacion
              desc: "ADR 0002: el dominio es el anillo interior. La aplicacion lo usa a el, no al reves."
            - pkg: github.com/rosvend/intela/internal/infraestructura
              desc: "ADR 0002: el dominio no nombra infraestructura. Declara un puerto y que el adaptador lo satisfaga."
            - pkg: net/http
              desc: "ADR 0002: HTTP es un adaptador de entrada. En el dominio no hay transporte."
            - pkg: database/sql
              desc: "ADR 0002: la persistencia entra por un puerto de repositorio."
            - pkg: github.com/jackc/pgx
              desc: "ADR 0002: pgx es el adaptador de PostgreSQL. Vive en infraestructura."
            - pkg: github.com/go-chi/chi
              desc: "ADR 0002: el router es un adaptador de entrada."
            - pkg: github.com/riverqueue/river
              desc: "ADR 0002: la cola es infraestructura. El dominio no encola."
            - pkg: os
              desc: "ADR 0005: el motor es una funcion pura. Sin entorno, sin ficheros."

        # ADR 0002 declara PuertoReloj como puerto de dominio, no de
        # infraestructura: "el tiempo entra inyectado". Las prescripciones de 3
        # y 10 anos y las ventanas de 15 dias tienen que probarse sin esperar
        # una decada, y ADR 0005 exige que una corrida sea reproducible bit a
        # bit anos despues. Un `time.Now()` o un `rand` sueltos en el nucleo
        # rompen las dos cosas en silencio: no fallan, devuelven otro numero.
        #
        # `time` se deniega como paquete; los TIPOS (time.Time, time.Duration)
        # se reciben como parametro desde el puerto, no se obtienen aqui.
        dominio-sin-reloj-ni-azar:
          files:
            - "**/internal/dominio/**/*.go"
          deny:
            - pkg: math/rand
              desc: "ADR 0005: el reparto es determinista. Sin aleatoriedad en el nucleo."
            - pkg: math/rand/v2
              desc: "ADR 0005: el reparto es determinista. Sin aleatoriedad en el nucleo."
            - pkg: time
              desc: "ADR 0002: el tiempo entra por PuertoReloj. Recibe el instante como parametro."

        # ADR 0002: la capa de aplicacion orquesta y fija limites de
        # transaccion, pero sigue siendo nucleo. Un `import` del cliente HTTP
        # dentro de un caso de uso, hecho con prisa, es exactamente el riesgo
        # que el ADR da por asumido.
        aplicacion-no-sale:
          files:
            - "**/internal/aplicacion/**/*.go"
          deny:
            - pkg: github.com/rosvend/intela/internal/infraestructura
              desc: "ADR 0002: los puertos se declaran aqui; los adaptadores los satisfacen sin ser importados."
            - pkg: github.com/jackc/pgx
              desc: "ADR 0002: el caso de uso habla con un puerto de repositorio, no con el driver."
            - pkg: github.com/go-chi/chi
              desc: "ADR 0002: el router es un adaptador de entrada."
            # Estos tres estaban DENTRO de internal/aplicacion y la regla no
            # los atrapaba: solo denegaba infraestructura, pgx y chi. Los tres
            # son concerns de adaptador, no de caso de uso.
            - pkg: golang.org/x/crypto/bcrypt
              desc: "ADR 0002: el algoritmo de hash es un detalle de adaptador. Entra por el puerto Hasher."
            - pkg: encoding/csv
              desc: "ADR 0002: parsear un formato de fichero es trabajo de adaptador de ingesta."
            - pkg: github.com/xuri/excelize
              desc: "ADR 0002: leer un .xlsx es trabajo de adaptador de ingesta."
            - pkg: net/http
              desc: "ADR 0002: HTTP es un adaptador de entrada."
            - pkg: database/sql
              desc: "ADR 0002: la persistencia entra por un puerto de repositorio."

        # ADR 0003: "Reparto lee de Repertorio y de Recaudo. Ninguno de los dos
        # conoce a Reparto." Go ya rechaza los ciclos al compilar; esto impide
        # ademas la arista en un solo sentido, que compila perfectamente.
        modulos-repertorio:
          files:
            - "**/internal/dominio/repertorio/**/*.go"
          deny:
            - pkg: github.com/rosvend/intela/internal/dominio/reparto
              desc: "ADR 0003: Reparto lee de Repertorio. Repertorio no conoce a Reparto."

        modulos-recaudo:
          files:
            - "**/internal/dominio/recaudo/**/*.go"
          deny:
            - pkg: github.com/rosvend/intela/internal/dominio/reparto
              desc: "ADR 0003: Reparto lee de Recaudo. Recaudo no conoce a Reparto."

        # ADR 0003: "Identificacion escribe alias y emite ONI, y no toca dinero."
        modulos-identificacion:
          files:
            - "**/internal/dominio/identificacion/**/*.go"
          deny:
            - pkg: github.com/rosvend/intela/internal/dominio/reparto
              desc: "ADR 0003: Identificacion no toca dinero."
            - pkg: github.com/rosvend/intela/internal/dominio/recaudo
              desc: "ADR 0003: Identificacion no toca dinero."
            - pkg: github.com/rosvend/intela/internal/dominio/liquidacion
              desc: "ADR 0003: Identificacion no toca dinero."

        # ONI es la cola manual de lo que identificacion no reconocio. Un uso
        # en ONI es dinero sin dueno conocido todavia, pero la cola no calcula
        # cuanto: solo dice que falta resolverlo.
        modulos-oni:
          files:
            - "**/internal/dominio/oni/**/*.go"
          deny:
            - pkg: github.com/rosvend/intela/internal/dominio/reparto
              desc: "ADR 0003: la cola manual no toca dinero."
            - pkg: github.com/rosvend/intela/internal/dominio/recaudo
              desc: "ADR 0003: la cola manual no toca dinero."
            - pkg: github.com/rosvend/intela/internal/dominio/liquidacion
              desc: "ADR 0003: la cola manual no toca dinero."

        # Afiliacion mantiene el padron: quien es Socio y quien Titular
        # Administrado. Que alguien exista en el padron es independiente de lo
        # que haya cobrado.
        modulos-afiliacion:
          files:
            - "**/internal/dominio/afiliacion/**/*.go"
          deny:
            - pkg: github.com/rosvend/intela/internal/dominio/reparto
              desc: "ADR 0003: el padron no depende de una corrida."
            - pkg: github.com/rosvend/intela/internal/dominio/liquidacion
              desc: "ADR 0003: el padron no depende de lo liquidado."
            - pkg: github.com/rosvend/intela/internal/dominio/anticipos
              desc: "ADR 0003: el padron no depende de los anticipos; es al reves."

        # Liquidacion CONSUME el resultado de una corrida; no lo recalcula. Si
        # importara el motor, la tentacion de recalcular "para verificar" haria
        # que dos numeros distintos pudieran salir del mismo proceso.
        modulos-liquidacion:
          files:
            - "**/internal/dominio/liquidacion/**/*.go"
          deny:
            - pkg: github.com/rosvend/intela/internal/dominio/recaudo
              desc: "ADR 0003: la bolsa ya venia resuelta desde Reparto."
            - pkg: github.com/rosvend/intela/internal/dominio/identificacion
              desc: "ADR 0003: a estas alturas las obras ya estan identificadas."

        # Una reclamacion no reescribe una corrida cerrada: se resuelve con un
        # ajuste trazable en una posterior, o por la reserva de RD 14. Reabrir
        # una corrida rompe la reproducibilidad del ADR 0005.
        modulos-reclamaciones:
          files:
            - "**/internal/dominio/reclamaciones/**/*.go"
          deny:
            - pkg: github.com/rosvend/intela/internal/dominio/reparto
              desc: "ADR 0005: una reclamacion no recalcula una corrida cerrada."

        modulos-anticipos:
          files:
            - "**/internal/dominio/anticipos/**/*.go"
          deny:
            - pkg: github.com/rosvend/intela/internal/dominio/reparto
              desc: "ADR 0003: un anticipo se descuenta de una liquidacion, no de una corrida."
            - pkg: github.com/rosvend/intela/internal/dominio/recaudo
              desc: "ADR 0003: un anticipo no conoce tarifas ni convenios."

        # Prescripcion decide cuando un importe deja de ser exigible (RD 15).
        # Solo necesita fechas e importes, que le llegan.
        modulos-prescripcion:
          files:
            - "**/internal/dominio/prescripcion/**/*.go"
          deny:
            - pkg: github.com/rosvend/intela/internal/dominio/reparto
              desc: "ADR 0003: prescribir no es recalcular."
            - pkg: github.com/rosvend/intela/internal/dominio/recaudo
              desc: "ADR 0003: prescripcion no conoce tarifas ni convenios."

  exclusions:
    rules:
      # Los adaptadores existen precisamente para importar infraestructura.
      - path: internal/infraestructura/
        linters:
          - depguard
      # cmd/ es donde se cablea todo: es su trabajo conocer las dos orillas.
      - path: cmd/
        linters:
          - depguard

formatters:
  enable:
    - gofmt
    - goimports
