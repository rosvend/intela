# Entorno de desarrollo. `docker compose up --build` levanta el sistema entero,
# y `docker compose --profile demo up --build` lo levanta ADEMAS sembrado: un
# solo comando desde un clon limpio hasta un tablero con datos.
#
# Los puertos del anfitrion se pueden mover sin editar este fichero. El 80 no lo
# puede abrir un Docker rootless (`net.ipv4.ip_unprivileged_port_start`) y el
# 8080 lo suele tener ocupado otra cosa; sin esto la unica salida era editar el
# compose, que es exactamente lo que no debe hacer quien solo quiere ver la demo.
#
# Son TRES, y se mueven juntos. Mover solo el de nginx es el error facil: el 80
# es el que se nota, pero el que vuelve a chocar es el 8080 de la API, y ahi el
# sintoma ya no dice de que se trata -los contenedores se quedan en `Created` y
# nunca pasan a `Up`-:
#
#   INTELA_PUERTO_HTTP=8088 INTELA_PUERTO_API=18080 INTELA_PUERTO_PG=55432 \
#     docker compose --profile demo up --build
#
# Mueven el lado del ANFITRION y nada mas: dentro de esta red la API sigue en el
# 8080 y Postgres en el 5432, que es como se nombran entre servicios y como los
# escribe deploy/nginx.conf.
#
# Y se publican en 127.0.0.1, no en 0.0.0.0. Un `ports: ["5432:5432"]` pelado
# ofrece Postgres con la clave de demo -intela/intela, escrita aqui mismo- a
# toda la red del anfitrion: el wifi de la universidad, el del cafe. Para el
# arranque local no cambia nada, `localhost` sigue siendo `localhost`. Ensenar
# la demo desde otra maquina si es un caso real, y para eso esta la variable:
#
#   INTELA_BIND=0.0.0.0 INTELA_PUERTO_HTTP=8088 docker compose --profile demo up
#
# MinIO no esta aqui. Estaba, pero sin cablear: la aplicacion escribe en disco
# local y ningun adaptador habla S3, asi que el servicio solo servia para
# aparentar que el almacen de objetos ya existia. Vuelve con el adaptador S3,
# y entonces con tag fijado y volumen -el de antes usaba `latest` y no tenia
# volumen, asi que los objetos se perdian en cada `down`.

name: intela

x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
    # La etapa del servicio, que NO contiene el binario del seed. Es la etapa
    # final del Dockerfile y por tanto la de por defecto; se nombra igual para
    # que se lea al lado del `target: seed` de mas abajo.
    target: runtime
  environment: &backend-env
    DATABASE_URL: postgres://intela:intela@postgres:5432/intela?sslmode=disable
    OBJECT_DIR: /objetos
    LOG_FORMATO: texto
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: intela
      POSTGRES_PASSWORD: intela
      POSTGRES_DB: intela
    ports: ["${INTELA_BIND:-127.0.0.1}:${INTELA_PUERTO_PG:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    # El `-h 127.0.0.1` no es adorno: es lo que hace que esta sonda y `migrate`
    # comprueben LA MISMA VIA.
    #
    # `pg_isready` sin `-h` sondea el socket unix. Y durante el arranque desde
    # un pgdata vacio hay una fase entera en la que ese socket esta vivo y el
    # TCP no existe todavia: el entrypoint oficial de la imagen levanta un
    # servidor temporal para correr `initdb`, crear la base y pasar los scripts
    # de `/docker-entrypoint-initdb.d`, y lo levanta con
    #
    #   -c listen_addresses=''      docker-entrypoint.sh, docker_temp_server_start
    #
    # que es exactamente "no escuches en TCP". Su propio comentario lo dice:
    # "start socket-only postgresql server". Al terminar hace un fast shutdown y
    # solo entonces arranca el servidor de verdad, que es el primero que abre el
    # 5432.
    #
    # Con la sonda por socket, compose marca `healthy` en cuanto responde ese
    # servidor temporal. `migrate` -que conecta por TCP y hace UN `PingContext`
    # sin reintento, internal/infraestructura/migraciones/migraciones.go- arranca
    # dentro de esa ventana, se lleva un `connection refused`, sale con 1 y
    # tumba el `up` entero. Medido en esta imagen con `--cpus 0.25`: el socket
    # dice "listo" 434 ms antes que el TCP. Contra un `interval: 5s`, eso es del
    # orden del 6% de los arranques en frio - poco para verlo a mano, demasiado
    # para una compuerta de CI que corre en cada PR.
    #
    # `127.0.0.1` y no un nombre: libpq trata como socket unix cualquier host
    # que empiece por `/`, y como TCP todo lo demas. Es el puerto de dentro del
    # contenedor, siempre 5432; `INTELA_PUERTO_PG` solo mueve el del anfitrion.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U intela -d intela"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Paso propio, antes de que arranque nada. Corre una vez y termina; los
  # demas servicios esperan a que salga con exito.
  #
  # Antes esto lo hacia la API al arrancar, lo que significaba que cada
  # replica intentaba migrar en paralelo y que un fallo de migracion se
  # confundia con un fallo de arranque.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    entrypoint: ["/app/migrate", "up"]
    environment:
      DATABASE_URL: postgres://intela:intela@postgres:5432/intela?sslmode=disable
      LOG_FORMATO: texto
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Paso opcional. NO entra en un `up` pelado; entra si -y solo si- se pide su
  # perfil:
  #
  #   docker compose --profile demo up --build   la demo de un comando
  #   docker compose run --rm seed               a mano, contra un stack ya arriba
  #
  # Dos nombres para el mismo servicio a proposito. `demo` es lo que se escribe
  # al lado de `up` y describe lo que se quiere -"levantalo con datos"-; `seed`
  # es lo que se escribe al lado de `run` y nombra el servicio. Un perfil que no
  # se enciende solo es lo que mantiene la promesa de que `up` no siembra: un
  # arranque normal sigue sin tocar los datos.
  #
  # Sembrar es idempotente cuando el dataset ya esta completo, asi que repetir el
  # `--profile demo up` no duplica nada. SEED_RESET=true recarga. Cada rol tiene
  # su clave (ARRANQUE.md).
  #
  # `target: seed` es una IMAGEN DISTINTA de la de la API, no un entrypoint
  # distinto de la misma. El binario borra 21 tablas con SEED_RESET=true y
  # reescribe `usuarios` con una clave publicada: no viaja en la imagen que
  # atiende produccion. Aqui es un servicio mas porque este compose es el
  # entorno de desarrollo.
  #
  # No hay `depends_on: seed` en ningun sitio, y no es un olvido: la API no
  # necesita datos para arrancar, y encadenarla al seed convertiria un fallo de
  # siembra en un stack que no levanta. Quien si tiene que esperar al seed es
  # quien mira los datos, y para eso esta `deploy/smoke.sh`, que sondea hasta
  # que las obras aparecen.
  seed:
    profiles: ["seed", "demo"]
    build:
      context: .
      dockerfile: Dockerfile
      target: seed
    entrypoint: ["/app/seed"]
    environment:
      DATABASE_URL: postgres://intela:intela@postgres:5432/intela?sslmode=disable
      OBJECT_DIR: /objetos
      LOG_FORMATO: texto
      SEED_RESET: "false"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes: [objetos:/objetos]
    restart: "no"

  api:
    <<: *backend
    entrypoint: ["/app/api"]
    environment:
      <<: *backend-env
      # El nombre lo lee config.Cadena("ADDR", ...). Antes esto se llamaba
      # HTTP_ADDR y el binario leia ADDR: la variable no hacia nada.
      ADDR: ":8080"
      # Lista blanca, nunca "*". En desarrollo, el origen de Vite y el de nginx.
      CORS_ORIGENES: "http://localhost,http://localhost:5173"
    volumes: [objetos:/objetos]
    ports: ["${INTELA_BIND:-127.0.0.1}:${INTELA_PUERTO_API:-8080}:8080"]
    # Sin healthcheck: la imagen es distroless y no tiene shell ni curl con
    # que sondear. La sonda vive en nginx, que si los tiene, contra /ready.

  worker:
    <<: *backend
    entrypoint: ["/app/worker"]
    volumes: [objetos:/objetos]

  scheduler:
    <<: *backend
    entrypoint: ["/app/scheduler"]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    depends_on: [api]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      # La `z` no es decoracion: es el unico montaje de fichero del anfitrion
      # que hay aqui, y sin ella no arranca en una maquina con SELinux en
      # Enforcing -Fedora, RHEL, CentOS- con Podman rootless. Un fichero recien
      # clonado tiene el contexto `user_home_t`, que un contenedor no puede
      # leer: nginx recibe `Permission denied` sobre default.conf y entra en
      # bucle de reinicio. La `z` le pide al motor que lo reetiquete a
      # `container_file_t` al montarlo.
      #
      # `z` minuscula, compartida, no `Z`. La mayuscula asigna una categoria MCS
      # privada del contenedor que la pidio, y este fichero esta versionado y
      # vive en el arbol de trabajo: dejarlo con una etiqueta privada rompe a
      # cualquier otro contenedor que lo monte despues -y al propio editor- por
      # un motivo que no se parece en nada a su causa.
      #
      # Fuera de SELinux, la bandera se ignora: en el runner de Ubuntu de CI no
      # hace nada. Por eso este fallo no lo ve la etapa de humo, solo quien
      # levanta la demo en Fedora desde un clon limpio.
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
    ports: ["${INTELA_BIND:-127.0.0.1}:${INTELA_PUERTO_HTTP:-80}:80"]
    depends_on: [api, web]
    restart: unless-stopped

volumes:
  pgdata:
  objetos:
