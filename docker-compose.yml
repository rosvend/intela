# Entorno de desarrollo. `docker compose up --build` levanta el sistema entero,
# migrado y vacio; `docker compose --profile demo up --build` lo levanta ademas
# sembrado, que es el arranque de una sola orden que documenta docs/QUICKSTART.md
# y el que verifica deploy/smoke.sh.
#
# MinIO no esta aqui. Estaba, pero sin cablear: la aplicacion escribe en disco
# local y ningun adaptador habla S3, asi que el servicio solo servia para
# aparentar que el almacen de objetos ya existia. Vuelve con el adaptador S3,
# y entonces con tag fijado y volumen -el de antes usaba `latest` y no tenia
# volumen, asi que los objetos se perdian en cada `down`.

name: intela

x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
    # La etapa del servicio, que NO contiene el binario del seed. Es la etapa
    # final del Dockerfile y por tanto la de por defecto; se nombra igual para
    # que se lea al lado del `target: seed` de mas abajo.
    target: runtime
  environment: &backend-env
    DATABASE_URL: postgres://intela:intela@postgres:5432/intela?sslmode=disable
    OBJECT_DIR: /objetos
    LOG_FORMATO: texto
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
    # Opcional: solo cuenta si el perfil `seed` o `demo` esta activo. Sin
    # esto, `migrate` y `seed` corrian en paralelo con la API, y con
    # SEED_RESET=true el seed podia borrar 21 tablas con la API ya conectada
    # (ver docs/QUICKSTART.md). `required: false` es lo que permite un `up`
    # pelado -sin `seed` en el proyecto-: Compose omite la arista del grafo
    # de dependencias cuando el servicio esta deshabilitado por perfil, en
    # vez de fallar porque no existe.
    seed:
      condition: service_completed_successfully
      required: false
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: intela
      POSTGRES_PASSWORD: intela
      POSTGRES_DB: intela
    # Solo loopback: la contrasena es fija y de desarrollo, y publicar en
    # 0.0.0.0 la expone a toda la red del host, no solo a esta maquina.
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intela -d intela"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Paso propio, antes de que arranque nada. Corre una vez y termina; los
  # demas servicios esperan a que salga con exito.
  #
  # Antes esto lo hacia la API al arrancar, lo que significaba que cada
  # replica intentaba migrar en paralelo y que un fallo de migracion se
  # confundia con un fallo de arranque.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    entrypoint: ["/app/migrate", "up"]
    environment:
      DATABASE_URL: postgres://intela:intela@postgres:5432/intela?sslmode=disable
      LOG_FORMATO: texto
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Paso opcional. Nunca entra en un `up` pelado; entra por perfil.
  #
  #   docker compose run --rm seed            a mano, contra un stack ya arriba
  #   docker compose --profile demo up        arranque de una orden, ya sembrado
  #
  # Los dos perfiles nombran la misma pieza desde dos sitios: `seed` es "quiero
  # el sembrador" y `demo` es "quiero un sistema que se pueda ensenar". Que
  # `demo` exista es lo que hace que el arranque documentado sea UNA orden: sin
  # el, `up` deja la base migrada y vacia, el tablero pinta cero obras y la
  # siguiente instruccion del quickstart es un segundo comando que todo el mundo
  # olvida. Ver docs/QUICKSTART.md.
  #
  # Es seguro dejarlo dentro de `up`: con la base ya sembrada el binario detecta
  # el dataset completo y sale con exito sin tocar nada (semilla.Cargar), asi que
  # repetir el `up` no duplica datos ni rompe el arranque.
  #
  # `target: seed` es una IMAGEN DISTINTA de la de la API, no un entrypoint
  # distinto de la misma. El binario borra 21 tablas con SEED_RESET=true y
  # reescribe `usuarios` con una clave publicada: no viaja en la imagen que
  # atiende produccion. Aqui es un servicio mas porque este compose es el
  # entorno de desarrollo.
  seed:
    profiles: ["seed", "demo"]
    build:
      context: .
      dockerfile: Dockerfile
      target: seed
    entrypoint: ["/app/seed"]
    environment:
      DATABASE_URL: postgres://intela:intela@postgres:5432/intela?sslmode=disable
      OBJECT_DIR: /objetos
      LOG_FORMATO: texto
      # Interpolado, no fijo. Con `"false"` a secas la unica forma de recargar
      # era repetir el valor en la linea de comandos (`run --rm -e SEED_RESET=true`),
      # y eso no existe para `up`: `SEED_RESET=true docker compose --profile demo up`
      # levantaba el stack y NO recargaba, en silencio.
      SEED_RESET: "${SEED_RESET:-false}"
      # Interpolado igual que SEED_RESET, y por la misma razon: sin esto el
      # binario siempre cae al default "admin-local" (cmd/seed/main.go),
      # aunque quien levante el stack exporte SEED_CLAVE_ADMIN -y entonces
      # deploy/smoke.sh, que si lee esa variable del host, intenta iniciar
      # sesion con una clave que el seed nunca uso.
      SEED_CLAVE_ADMIN: "${SEED_CLAVE_ADMIN:-}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes: [objetos:/objetos]
    restart: "no"

  api:
    <<: *backend
    entrypoint: ["/app/api"]
    environment:
      <<: *backend-env
      # El nombre lo lee config.Cadena("ADDR", ...). Antes esto se llamaba
      # HTTP_ADDR y el binario leia ADDR: la variable no hacia nada.
      ADDR: ":8080"
      # Lista blanca, nunca "*". En desarrollo, el origen de Vite y el de nginx.
      CORS_ORIGENES: "http://localhost,http://localhost:5173"
    volumes: [objetos:/objetos]
    ports: ["8080:8080"]
    # Sin healthcheck: la imagen es distroless y no tiene shell ni curl con
    # que sondear. La sonda vive en nginx, que si los tiene, contra /ready.

  worker:
    <<: *backend
    entrypoint: ["/app/worker"]
    volumes: [objetos:/objetos]

  scheduler:
    <<: *backend
    entrypoint: ["/app/scheduler"]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    depends_on: [api]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    # El `:z` no es decoracion. En un host con SELinux -Fedora, RHEL, y por
    # tanto tambien podman de serie- un fichero del arbol de trabajo entra al
    # contenedor con la etiqueta que tenga en disco, que no es una que los
    # contenedores puedan leer: nginx arrancaba y moria en bucle con
    #   [emerg] open() "/etc/nginx/conf.d/default.conf" failed (13: Permission denied)
    # y el resto del stack quedaba en pie, asi que parecia un fallo de nginx y
    # no del montaje. `z` reetiqueta el fichero como contenido compartido de
    # contenedor; donde no hay SELinux, Docker y podman lo ignoran.
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
    ports: ["80:80"]
    depends_on: [api, web]
    restart: unless-stopped

volumes:
  pgdata:
  objetos:
