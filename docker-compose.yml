services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: intela
      POSTGRES_PASSWORD: intela
      POSTGRES_DB: intela
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intela"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: intela
      MINIO_ROOT_PASSWORD: intela-intela
    ports: ["9000:9000", "9001:9001"]

  api:
    build: { context: ., dockerfile: Dockerfile }
    entrypoint: ["/app/api"]
    environment:
      DATABASE_URL: postgres://intela:intela@postgres:5432/intela?sslmode=disable
      MIGRATIONS: /app/migrations/00001_init.sql
      OBJECT_DIR: /objetos
      HTTP_ADDR: ":8080"
    volumes: [objetos:/objetos]
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8080:8080"]

  worker:
    build: { context: ., dockerfile: Dockerfile }
    entrypoint: ["/app/worker"]
    environment:
      DATABASE_URL: postgres://intela:intela@postgres:5432/intela?sslmode=disable
      OBJECT_DIR: /objetos
    volumes: [objetos:/objetos]
    depends_on:
      postgres: { condition: service_healthy }

  scheduler:
    build: { context: ., dockerfile: Dockerfile }
    entrypoint: ["/app/scheduler"]
    environment:
      DATABASE_URL: postgres://intela:intela@postgres:5432/intela?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build: { context: ./web, dockerfile: Dockerfile }
    depends_on: [api]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["80:80"]
    depends_on: [api, web]

volumes:
  pgdata:
  objetos:
