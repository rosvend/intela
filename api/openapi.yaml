# Contrato HTTP de Intela.
#
# La version anterior cubria 8 de ~18 endpoints, no tenia ni un schema de
# respuesta, y era INVALIDA: /api/asientos/{id}/explicar declaraba {id} en la
# ruta sin declararlo en `parameters`, que el estandar exige.
#
# Este contrato describe lo que el andamiaje expone DE VERDAD: sondas de
# salud. Los endpoints de negocio vuelven con los PRs que los implementan, y
# cada uno trae su schema. Un contrato que promete rutas que devuelven 404 es
# peor que uno corto: se usa para generar clientes.

openapi: 3.0.3

info:
  title: Intela API
  version: "0.1.0"
  description: |
    Reconocimiento de obras y distribucion de ingresos por propiedad
    intelectual para REDES SGC.

    Toda cifra que el sistema produzca debe ser explicable hasta su origen
    (fuente, reporte, regla aplicada). El reglamento lo exige y la auditoria
    lo revisa.
  license:
    name: Propietario
    url: https://redescritores.com

servers:
  # El host va como variable y no como literal a proposito: Amplify lo genera
  # al crear la rama, asi que no se conoce hasta el primer `terraform apply`.
  # Lo imprime `terraform output -raw url` (ADR 0014). Fijarlo aqui obligaria a
  # tocar el contrato cada vez que el entorno se recrea.
  - url: https://{host}/api
    description: Produccion, detras de Amplify Hosting
    variables:
      host:
        default: main.intela.amplifyapp.com
        description: Dominio de la rama en Amplify, o el dominio propio si se configura uno.
  - url: http://localhost/api
    description: Desarrollo, detras de nginx
  - url: http://localhost:8080
    description: Desarrollo, API directa

tags:
  - name: salud
    description: Sondas para el orquestador.
  - name: sesion
    description: |
      Autenticacion. La sesion es un token opaco con caducidad, no un JWT: se
      revoca del lado del servidor borrando su fila (ADR 0013).
  - name: admin
    description: |
      Superficie del pipeline. Solo `administrador` (Consejo Directivo).
      Requiere Bearer y el rol; sin sesion es 401, con otro rol es 403.
  - name: auditoria
    description: |
      Superficie de lectura de la bitacora. `auditor` (Revisor Fiscal) o
      `administrador`. Requiere Bearer y el rol; sin sesion es 401, con
      otro rol es 403.
  - name: repertorio
    description: |
      Catalogo maestro de obras: el cubo contra el que resuelve todo el
      matching. Solo `administrador`, lectura incluida.

      El catalogo guarda IDENTIDAD y METADATA. No guarda dinero ni
      porcentajes: el uso vive en los reportes y los porcentajes salen solo
      de la Declaracion de Obra (`R-02`, `R-03`, `RD 7.3.1`). Por eso un
      coautor de este catalogo no tiene campo de participacion.
  - name: padron
    description: |
      El padron de titulares: quien figura ante la sociedad y quien puede
      cobrar. Solo `administrador`, lectura incluida, igual que el catalogo de
      obras -es la otra mitad de la misma superficie: quien edita una
      declaracion ve el repertorio entero y el padron entero-.

      **Estar en el padron no es poder cobrar.** `R-01` (`RD 4.5`) solo admite
      orden de pago a un escritor persona natural, asi que una productora esta
      en el padron y NO puede recibir reparto. El padron se sirve entero, con
      `persona_natural` a la vista, para que esa regla se pueda explicar en vez
      de dejar invisible al titular que no se ofrece como parte.
  - name: recaudo
    description: |
      El lado del ingreso: los usuarios que pagan y lo que pagaron.

      Intela **recibe** el importe ya cobrado, por usuario y periodo. No
      calcula lo que cada usuario debe y no factura: la tabla de tarifas del
      `RT` (`T-01` a `T-11`) es documentacion de referencia, no logica de este
      servicio. Por eso `convenio`, `tarifa` y `factura` son PROCEDENCIA -de
      donde salio este dinero- y no insumos de calculo.

      El dinero no llega por fila. Ningun reporte de uso trae importes: REDES
      SGC cobra una bolsa a cada usuario y los reportes solo **ponderan** como
      se reparte esa bolsa entre las obras.

      Escribe `contabilidad`, que es quien factura (`RD 13.5`), o
      `administrador`. Las bolsas las lee ademas `distribucion` -necesita la
      bolsa para correr el reparto- y `auditor`.
  - name: bolsas
    description: |
      Lectura de las bolsas: lo unico que el modulo de recaudo pasa aguas
      abajo. Una bolsa por usuario, periodo y circuito.

      Nacional e internacional no se mezclan (`RD 10.3`, `R-35`): son dos
      circuitos que se gestionan por separado, con reservas y fechas de corte
      distintas.

  - name: anomalias
    description: |
      La bandeja de anomalias de un periodo: lo que impide, o falsea, el
      reparto de ese periodo (OE-5 / KR-4). Seis detectores corren sobre el
      periodo ya armado y cada alerta nombra su tipo y el registro exacto que
      la disparo.

      **No es la cola de revision.** `/admin/cola-revision` lista filas que no
      se pudieron NORMALIZAR y no tiene estado de resolucion; esto lista
      anomalias del periodo, se resuelve con firma y lo miran tres roles
      distintos. Son dos colas y dos recursos (ADR 0020).

      Lee `administrador`, `distribucion` y `auditor`. Resuelve solo
      `administrador` y `distribucion`: el Revisor Fiscal lee todo y no opera
      el pipeline ni firma, y cerrar una alerta es una decision sobre a quien
      se le paga.

      **Critica no quiere decir grave.** Una obra retenida por declaracion
      incompleta (`R-04`, `RD 13.1.3`) es un estado VALIDO del modelo: se
      retiene el total de esa obra y el periodo se reparte igual. Lo que
      bloquea es lo que hace salir mal las cifras de las demas obras.

  - name: ingesta
    description: |
      Recepcion de reportes de uso: la subida manual y el listado de cargas
      hechas. Solo `administrador`.

      Ningun reporte de uso trae importes. Estos archivos PONDERAN la bolsa
      que se cobro en Recaudo, no la aportan: por eso ni la entrega ni sus
      filas tienen campo de dinero.

      Una fila que no se puede normalizar no se descarta: queda con su motivo
      en el log de rechazos (ADR 0016). Es criterio de aceptacion de OE-1.

paths:
  /health:
    get:
      tags: [salud]
      summary: El proceso esta vivo
      description: |
        No consulta la base de datos. Si lo hiciera, una caida de PostgreSQL
        reiniciaria los contenedores en bucle en vez de dejarlos esperando.
      operationId: salud
      security: []
      responses:
        "200":
          description: El proceso responde.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estado"
              example:
                estado: ok

  /ready:
    get:
      tags: [salud]
      summary: El proceso puede atender trafico
      description: Comprueba tambien que las dependencias respondan.
      operationId: listo
      security: []
      responses:
        "200":
          description: Listo para recibir trafico.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estado"
              example:
                estado: listo
        "503":
          description: Alguna dependencia no responde.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: base de datos no disponible

  /auth/session:
    post:
      tags: [sesion]
      summary: Iniciar sesion
      description: |
        Cambia unas credenciales por un token de sesion.

        Es la unica operacion que se llama sin token, de ahi el `security: []`.

        Devuelve el mismo 401 tanto si el correo no esta en el padron como si
        la clave no cuadra, y con el mismo mensaje: distinguirlos convertiria
        el login en una forma de averiguar que correos estan dados de alta.
      operationId: iniciarSesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credenciales"
            example:
              email: ana@redes.co
              clave: la-clave-de-ana
      responses:
        "200":
          description: Sesion abierta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sesion"
              example:
                token: 9qYQ2vJmXk3pR7wLfNbTzA5cHdEgSuVxYnMoPiKjRlQ
                expira: "2026-08-31T00:00:00Z"
                usuario:
                  id: usr-ana
                  email: ana@redes.co
                  nombre: Ana Escritora
                  rol: titular
                  titular_id: tit-ana
        "400":
          description: Falta el correo o la clave, o el cuerpo no es JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: email y clave son obligatorios
        "401":
          description: Credenciales invalidas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: credenciales invalidas

    get:
      tags: [sesion]
      summary: Quien soy
      description: |
        Devuelve el usuario dueno del token presentado.

        Sirve para que un cliente pinte la sesion sin guardar el usuario en el
        navegador, donde no se puede confiar en el.
      operationId: sesionActual
      responses:
        "200":
          description: El usuario de la sesion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
              example:
                id: usr-ana
                email: ana@redes.co
                nombre: Ana Escritora
                rol: titular
                titular_id: tit-ana
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada

    delete:
      tags: [sesion]
      summary: Cerrar sesion
      description: |
        Revoca el token presentado.

        Es idempotente: cerrar una sesion que ya estaba cerrada responde igual.
        Decir "ese token no existia" contaria algo sobre tokens ajenos.
      operationId: cerrarSesion
      responses:
        "204":
          description: Sesion cerrada. Sin cuerpo.
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada

  /admin/pipeline:
    get:
      tags: [admin]
      summary: Superficie del pipeline
      description: |
        Reserva el prefijo `/admin/*` al rol `administrador` (Consejo
        Directivo). Los casos de uso del pipeline aterrizan en PRs
        posteriores; hoy el grupo existe para que el rol se haga cumplir
        en un solo sitio.

        Sin sesion responde 401 (el middleware de autenticacion). Con
        sesion de otro rol responde 403.
      operationId: adminPipeline
      security:
        - bearerAuth: []
      x-required-roles: [administrador]
      responses:
        "204":
          description: Autorizado. Sin cuerpo; la superficie aun no tiene payload.
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: Autenticado, pero el rol no basta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado

  /admin/cola-revision:
    get:
      tags: [admin]
      summary: Cola de revision
      description: |
        Lista las filas que esperan ojo humano antes de ponderar: las que no
        se pudieron normalizar (fecha inparseable, moneda no reconocida,
        parametro normativo ausente) y los rechazos del adaptador de formato.

        **Las anomalias de un periodo NO salen por aqui.** Esta descripcion
        prometia que el #37 aterrizaria en esta ruta y no fue asi: una anomalia
        necesita estado de resolucion y este schema no lo tiene, y este prefijo
        es solo de `administrador` mientras el tablero de anomalias lo miran
        ademas `distribucion` y `auditor`. Viven en `/alertas` (ADR 0020).

        Un solo listado y un solo schema. `tipo` discrimina el origen
        (`normalizacion` | `anomalia` | `adaptador`); `codigo` es el motivo
        tipado persistido, no re-derivado del texto; `motivo` nombra el
        campo. La fila no se descarto: esta aqui, con su razon.

        Sin sesion responde 401. Con sesion de otro rol responde 403.
      operationId: listarColaRevision
      security:
        - bearerAuth: []
      x-required-roles: [administrador]
      responses:
        "200":
          description: Cola actual. Lista vacia si no hay nada que revisar.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemRevision"
              example:
                - id: tv-fecha
                  tipo: normalizacion
                  codigo: fecha_inparseable
                  motivo: "fecha_inparseable: fecha \"ayer\": no es YYYYMMDD, ISO ni serial de Excel"
                  fuente: caracol
                  titulo: Fecha rota
                  reporte_id: rep-1
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: Autenticado, pero el rol no basta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado

  /auditoria/asientos:
    get:
      tags: [auditoria]
      summary: Superficie de la bitacora
      description: |
        Reserva el prefijo `/auditoria/*` a `auditor` (Revisor Fiscal) o
        `administrador`. Los asientos aterrizan con el PR de bitacora;
        hoy el grupo existe para que el rol se haga cumplir en un solo
        sitio.

        Sin sesion responde 401. Con sesion de otro rol responde 403.
      operationId: auditoriaAsientos
      security:
        - bearerAuth: []
      x-required-roles: [auditor, administrador]
      responses:
        "204":
          description: Autorizado. Sin cuerpo; la superficie aun no tiene payload.
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: Autenticado, pero el rol no basta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado

  /obras:
    get:
      tags: [repertorio]
      summary: Buscar en el catalogo maestro
      description: |
        Devuelve las obras del catalogo. Sin filtros de busqueda devuelve la
        primera pagina: "sin recorte" de titulo/genero/IPI/anio sigue siendo
        un listado, y la paginacion es el tope que evita servir el catalogo
        real de REDES SGC de un golpe.

        Los filtros se combinan con Y. `titulo` casa por SUBCADENA o por
        PARECIDO -ignora mayusculas, tildes y el orden de las palabras- y
        ordena el resultado de mas a menos parecido. Es el unico campo por el
        que se busca sin saber el dato exacto: en la muestra, el titulo
        localizado y el original difieren en 16 de 59 filas. `genero`, `anio`
        e `ipi` son exactos.

        `ipi` cruza contra los COAUTORES de la obra: el IPI identifica
        personas, no obras (`RD 3`).

        `limite` y `desplazamiento` son la misma forma que usa `ListarObras`
        en el repositorio de reparto (issue #90). Sin `limite` el servidor
        aplica 100; por encima de 500 responde 400.

        Cada obra llega con el estado de su Declaracion de Obra vigente
        (`estado_declaracion`, `suma_porcentajes` y `version_vigente`), que es
        lo que el catalogo tiene que poder mostrar sin que el cliente tenga que
        adivinar nada ni pedir la declaracion aparte. `version_vigente: null`
        distingue una obra sin declaracion de una declarada que no suma 100:
        las dos son `incompleta`, y solo la segunda tiene version.
      operationId: buscarObras
      security:
        - bearerAuth: []
      x-required-roles: [administrador]
      parameters:
        - name: titulo
          in: query
          required: false
          description: |
            Trozo del titulo o titulo parecido. Ignora mayusculas, tildes y el
            orden de las palabras, y ordena por parecido.
          schema:
            type: string
          example: dos palmas
        - name: genero
          in: query
          required: false
          description: Genero exacto, tal como se declaro.
          schema:
            type: string
          example: Drama
        - name: ipi
          in: query
          required: false
          description: IPI exacto de uno de los coautores de la obra.
          schema:
            type: string
          example: IPI-00000001
        - name: anio
          in: query
          required: false
          description: |
            Anio de produccion exacto. Un valor que no sea un entero positivo
            se rechaza con 400 en vez de ignorarse: ignorado devolveria el
            catalogo entero y quien pregunta lo leeria como "no hay ninguna
            de ese anio".
          schema:
            type: integer
            minimum: 1
          example: 1991
        - name: limite
          in: query
          required: false
          description: |
            Tamano de la pagina. Si se omite, el servidor aplica 100. Tiene
            que ser un entero positivo y no mayor que 500.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
          example: 50
        - name: desplazamiento
          in: query
          required: false
          description: |
            Cuantas obras saltarse desde el inicio del resultado. Cero o
            ausente es la primera pagina.
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
      responses:
        "200":
          description: |
            Las obras que cuadran, recortadas a la pagina pedida. Con `titulo`
            van ordenadas de mas a menos parecido (y por identificador entre
            las que empatan); sin `titulo`, por identificador. Sin
            coincidencias devuelve una lista vacia, no un 404.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Obra"
              example:
                - id: obra-1
                  titulo: La Casa de las Dos Palmas
                  genero: Drama
                  anio: 1991
                  tipo: serie
                  ida: IDA-1
                  eidr: ""
                  imdb: ""
                  coautores:
                    - nombre: Ana Escritora
                      ipi: IPI-00000001
                      rol: guionista
                  estado_declaracion: completa
                  suma_porcentajes: 100
                  version_vigente: 3
        "400":
          description: Un parametro de busqueda o de paginacion esta mal formado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: anio tiene que ser un entero positivo
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: Autenticado, pero el rol no basta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado

    post:
      tags: [repertorio]
      summary: Registrar una obra en el catalogo
      description: |
        Da de alta una obra. El identificador lo trae el cuerpo y NO lo genera
        el servidor: es el numero de obra de REDES-SYS, que se asigna fuera de
        este sistema. Por eso un segundo alta con el mismo identificador es un
        409 y no un id nuevo inventado en silencio.

        Una vez creada, el identificador es inmutable: no hay operacion que lo
        cambie. Es lo que referencian las declaraciones, los alias y los usos.

        La respuesta trae ademas el estado de la Declaracion de Obra, porque es
        el mismo schema `Obra` y sus tres campos derivados son obligatorios en
        las cuatro respuestas que devuelven una obra. En un alta recien hecha
        ese estado es el cero -`incompleta`, `suma_porcentajes: 0` y
        `version_vigente: null`-, y no por darlo por supuesto: una declaracion
        necesita la fila de la obra, que es justo lo que este alta crea, asi
        que no puede existir ninguna todavia.
      operationId: registrarObra
      security:
        - bearerAuth: []
      x-required-roles: [administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuevaObra"
            example:
              id: obra-1
              titulo: La Casa de las Dos Palmas
              genero: Drama
              anio: 1991
              tipo: serie
              ida: IDA-1
              eidr: ""
              imdb: ""
              coautores:
                - nombre: Ana Escritora
                  ipi: IPI-00000001
                  rol: guionista
                - nombre: Beto Libretista
                  ipi: IPI-00000002
                  rol: libretista
      responses:
        "201":
          description: Obra registrada.
          headers:
            Location:
              description: Ruta de la obra recien creada.
              schema:
                type: string
              example: /obras/obra-1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Obra"
              example:
                id: obra-1
                titulo: La Casa de las Dos Palmas
                genero: Drama
                anio: 1991
                tipo: serie
                ida: IDA-1
                eidr: ""
                imdb: ""
                coautores:
                  - nombre: Ana Escritora
                    ipi: IPI-00000001
                    rol: guionista
                  - nombre: Beto Libretista
                    ipi: IPI-00000002
                    rol: libretista
                estado_declaracion: incompleta
                suma_porcentajes: 0
                version_vigente: null
        "400":
          description: |
            El cuerpo no es JSON, o lo que trae no forma una obra: falta el
            titulo, el genero, el anio, el tipo, o no viene ningun coautor con
            IPI y un rol autoral valido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "obra invalida: falta el genero"
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: Autenticado, pero el rol no basta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado
        "409":
          description: Ya hay una obra con ese identificador.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: ya existe una obra con ese identificador

  /obras/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador de la obra. Opaco e inmutable.
        schema:
          type: string
        example: obra-1

    get:
      tags: [repertorio]
      summary: Leer una obra del catalogo
      description: |
        Devuelve la obra con sus metadatos, sus coautores y el estado de su
        Declaracion de Obra vigente -incluido que no tenga ninguna, que es
        `version_vigente: null`-.
      operationId: obraPorID
      security:
        - bearerAuth: []
      x-required-roles: [administrador]
      responses:
        "200":
          description: La obra.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Obra"
              example:
                id: obra-1
                titulo: La Casa de las Dos Palmas
                genero: Drama
                anio: 1991
                tipo: serie
                ida: IDA-1
                eidr: ""
                imdb: ""
                coautores:
                  - nombre: Ana Escritora
                    ipi: IPI-00000001
                    rol: guionista
                estado_declaracion: completa
                suma_porcentajes: 100
                version_vigente: 3
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: Autenticado, pero el rol no basta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado
        "404":
          description: No hay ninguna obra con ese identificador.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: esa obra no esta en el catalogo

    patch:
      tags: [repertorio]
      summary: Corregir los metadatos de una obra
      description: |
        Reemplaza el bloque de metadatos completo. El identificador NO esta en
        el cuerpo y no se puede cambiar: viaja por la ruta, que es la unica
        forma de garantizar que una correccion no reasigne los autores de una
        obra a otra.

        Es PATCH y no PUT porque lo que se manda no es la obra entera: la
        identidad no viaja. El bloque de metadatos si va completo, asi que no
        hay ambiguedad entre "este campo no vino" y "este campo vino vacio".

        No crea la obra si no existe: responde 404. Un PATCH que inserta
        convierte un identificador mal escrito en una obra fantasma del
        catalogo contra el que resuelve todo el matching.

        Solo se corrigen los metadatos: el estado de la Declaracion de Obra no
        se toca -sus porcentajes no estan en el catalogo (`R-03`)- y viaja en la
        respuesta, como en cualquier lectura de la obra.
      operationId: actualizarMetadatosObra
      security:
        - bearerAuth: []
      x-required-roles: [administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadatosObra"
            example:
              titulo: La Casa de las Dos Palmas
              genero: Drama
              anio: 1991
              tipo: serie
              ida: IDA-1
              eidr: ""
              imdb: ""
              coautores:
                - nombre: Ana Escritora
                  ipi: IPI-00000001
                  rol: guionista
      responses:
        "200":
          description: La obra ya corregida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Obra"
              example:
                id: obra-1
                titulo: La Casa de las Dos Palmas
                genero: Drama
                anio: 1991
                tipo: serie
                ida: IDA-1
                eidr: ""
                imdb: ""
                coautores:
                  - nombre: Ana Escritora
                    ipi: IPI-00000001
                    rol: guionista
                estado_declaracion: completa
                suma_porcentajes: 100
                version_vigente: 3
        "400":
          description: El cuerpo no es JSON, o los metadatos no forman una obra valida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "obra invalida: falta el titulo"
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: Autenticado, pero el rol no basta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado
        "404":
          description: No hay ninguna obra con ese identificador.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: esa obra no esta en el catalogo

  /obras/{id}/declaracion:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador de la obra.
        schema:
          type: string
        example: obra-1

    post:
      tags: [repertorio]
      summary: Declarar la obra
      description: |
        Abre una version nueva de la Declaracion de Obra (`R-03`, `RD 7.3.1`,
        `RD 7.3.4`): el UNICO origen valido de los porcentajes de reparto,
        nunca los reportes de uso ni los contratos de escritura.

        Es la misma operacion que `PUT` en este mismo path -las dos cierran la
        version abierta si la hay y abren una nueva-; la unica diferencia es
        el codigo de exito, no el numero de version que resulta. Si la obra ya
        tenia una declaracion, este `POST` la sustituye igual que lo haria un
        `PUT`: no es exclusivo de "la primera vez", aunque ese sea el uso mas
        comun. Se ofrecen los dos verbos porque distinguir alta de edicion es
        util para quien integra, aunque el nucleo no necesite la distincion.

        Una suma menor a 100 SI se acepta: es el estado `declaracion_incompleta`
        valido de `R-04` (`RD 13.1.3`), y REDES SGC retiene el importe completo
        de la obra hasta que se complete. Una suma mayor a 100 se rechaza.
      operationId: declararObra
      security:
        - bearerAuth: []
      x-required-roles: [administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/Parte"
            example:
              - titular_id: tit-1
                ipi: IPI-00000001
                porcentaje: 60
              - titular_id: tit-2
                ipi: IPI-00000002
                porcentaje: 40
      responses:
        "201":
          description: |
            La version nueva, recien creada. Es version 1 solo si la obra no
            tenia ninguna declaracion previa; si ya tenia una, esta la cierra
            y el numero sigue la secuencia.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionDeclaracion"
              example:
                version: 1
                vigente_desde: "2026-01-15T10:00:00Z"
                vigente_hasta: null
                estado: completa
                partes:
                  - titular_id: tit-1
                    ipi: IPI-00000001
                    porcentaje: 60
                  - titular_id: tit-2
                    ipi: IPI-00000002
                    porcentaje: 40
        "400":
          description: |
            El cuerpo no es JSON, trae una parte sin IPI o con un porcentaje
            que no es positivo o que trae mas de 4 decimales, un titular
            repetido, la suma se pasa de 100, o nombra un titular_id que no
            esta en el padron.

            Y tambien es 400 una parte cuyo titular_id SI este en el padron y
            no sea persona natural: `R-01` (`RD 4.5`) solo admite a un escritor
            persona natural como titular de una Declaracion de Obra, y esa
            regla se comprueba aqui, al guardar, no solo cuando se paga. Ese
            rechazo lleva su propio mensaje, distinto del de un `titular_id`
            inexistente: alli el identificador no resuelve a nadie, y aqui
            resuelve a una productora que existe y no puede figurar como parte.

            Y tambien es 400 una parte cuyo `ipi` no es el que el padron tiene
            para ese `titular_id`: el IPI declarado se concilia con el del padron
            al guardar, porque es el que llega a quien se le paga, y si no
            coincide no se escribe nada (no se abre ninguna version). El mensaje
            es fijo y no repite ninguno de los dos IPI, para que este endpoint no
            sirva para leer el padron. Se comprueba despues de `R-01`: una parte
            que no es persona natural recibe el rechazo de `R-01` y no este.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "declaracion invalida: la suma de porcentajes es 120.0000%, no puede superar 100"
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: Autenticado, pero el rol no basta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado
        "404":
          description: No hay ninguna obra con ese identificador.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: esa obra no esta en el catalogo

    put:
      tags: [repertorio]
      summary: Editar la Declaracion de Obra
      description: |
        Cierra la version vigente y abre una nueva con las partes que llegan.
        La version anterior NO se borra ni se modifica: sigue consultable en
        `GET .../historial`, porque un reparto de un periodo pasado tiene que
        poder reproducirse con el split que estaba vigente ENTONCES.

        Mismas reglas de validacion que el alta: suma > 100 se rechaza, suma
        < 100 se acepta como `declaracion_incompleta`.
      operationId: editarDeclaracion
      security:
        - bearerAuth: []
      x-required-roles: [administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/Parte"
            example:
              - titular_id: tit-1
                ipi: IPI-00000001
                porcentaje: 70
              - titular_id: tit-2
                ipi: IPI-00000002
                porcentaje: 30
      responses:
        "200":
          description: La nueva version, ya vigente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionDeclaracion"
              example:
                version: 2
                vigente_desde: "2026-03-01T09:00:00Z"
                vigente_hasta: null
                estado: completa
                partes:
                  - titular_id: tit-1
                    ipi: IPI-00000001
                    porcentaje: 70
                  - titular_id: tit-2
                    ipi: IPI-00000002
                    porcentaje: 30
        "400":
          description: |
            El cuerpo no es JSON, trae una parte sin IPI o con un porcentaje
            que no es positivo o que trae mas de 4 decimales, un titular
            repetido, la suma se pasa de 100, o nombra un titular_id que no
            esta en el padron.

            Y tambien es 400 una parte cuyo titular_id SI este en el padron y
            no sea persona natural: `R-01` (`RD 4.5`) solo admite a un escritor
            persona natural como titular de una Declaracion de Obra, y esa
            regla se comprueba aqui, al guardar, no solo cuando se paga. Ese
            rechazo lleva su propio mensaje, distinto del de un `titular_id`
            inexistente: alli el identificador no resuelve a nadie, y aqui
            resuelve a una productora que existe y no puede figurar como parte.

            Y tambien es 400 una parte cuyo `ipi` no es el que el padron tiene
            para ese `titular_id`: el IPI declarado se concilia con el del padron
            al guardar, porque es el que llega a quien se le paga, y si no
            coincide no se escribe nada (no se abre ninguna version). El mensaje
            es fijo y no repite ninguno de los dos IPI, para que este endpoint no
            sirva para leer el padron. Se comprueba despues de `R-01`: una parte
            que no es persona natural recibe el rechazo de `R-01` y no este.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "declaracion invalida: al titular \"tit-1\" le falta el IPI"
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: Autenticado, pero el rol no basta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado
        "404":
          description: No hay ninguna obra con ese identificador.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: esa obra no esta en el catalogo

  /obras/{id}/declaracion/historial:
    get:
      tags: [repertorio]
      summary: Ver todas las versiones de la Declaracion de Obra
      description: |
        Devuelve una pagina de versiones, cada una con su ventana de
        vigencia. La pagina se toma desde la version MAS RECIENTE hacia atras
        -la version abierta es la ultima, y es la que quien lee el historial
        necesita aunque la obra tenga mas versiones que el limite-, y dentro de
        la pagina el orden sigue siendo de mas antigua a mas reciente.
        `desplazamiento` cuenta versiones desde la mas reciente: con el se
        alcanzan las anteriores. Es de solo lectura: no hay forma de editar una
        version pasada, unicamente de abrir una nueva -eso es
        `PUT .../declaracion`-.

        Una obra sin ninguna declaracion todavia devuelve una lista vacia, no
        un 404: mismo criterio que `GET /obras`.
      operationId: historialDeclaracion
      security:
        - bearerAuth: []
      x-required-roles: [administrador]
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador de la obra.
          schema:
            type: string
          example: obra-1
        - name: limite
          in: query
          required: false
          description: |
            Cuantas versiones trae la pagina. Si se omite, el servidor aplica
            100. Tiene que ser un entero positivo y no mayor que 500.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
          example: 100
        - name: desplazamiento
          in: query
          required: false
          description: |
            Cuantas versiones saltarse contando desde la mas reciente. Cero o
            ausente es la pagina que incluye la version abierta.
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
      responses:
        "200":
          description: |
            La pagina pedida de versiones, en orden ascendente dentro de ella.
            Lista vacia si la obra no tiene declaracion o si el desplazamiento
            cae mas alla de la primera version.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VersionDeclaracion"
              example:
                - version: 1
                  vigente_desde: "2026-01-15T10:00:00Z"
                  vigente_hasta: "2026-03-01T09:00:00Z"
                  estado: completa
                  partes:
                    - titular_id: tit-1
                      ipi: IPI-00000001
                      porcentaje: 60
                    - titular_id: tit-2
                      ipi: IPI-00000002
                      porcentaje: 40
                - version: 2
                  vigente_desde: "2026-03-01T09:00:00Z"
                  vigente_hasta: null
                  estado: completa
                  partes:
                    - titular_id: tit-1
                      ipi: IPI-00000001
                      porcentaje: 70
                    - titular_id: tit-2
                      ipi: IPI-00000002
                      porcentaje: 30
        "400":
          description: Un parametro de paginacion esta mal formado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: limite tiene que ser un entero positivo
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: Autenticado, pero el rol no basta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado

  /titulares:
    get:
      tags: [padron]
      summary: Buscar en el padron de titulares
      description: |
        Devuelve las entradas del padron. Sin filtros devuelve la primera
        pagina: la paginacion es el tope que evita servir el padron real de
        REDES SGC de un golpe, igual que en el catalogo de obras.

        **Devuelve el padron entero, personas juridicas incluidas.** No es un
        listado de "quien puede cobrar": `R-01` (`RD 4.5`) solo admite orden de
        pago a un escritor persona natural, y esa regla se aplica al armar una
        declaracion, no al leer el padron. Recortar aqui a las personas
        naturales dejaria a quien edita sin poder explicar por que el titular
        del padron que no le ofrecen como parte existe y no se le ofrece.

        Los filtros se combinan con Y. `nombre` es PARCIAL y no distingue
        mayusculas; `ipi` es exacto. `ids` pide esos titulares y ninguno mas: es
        la consulta ACOTADA por identificador.

        `limite` y `desplazamiento` son la misma forma que en `/obras`. Sin
        `limite` el servidor aplica 100; por encima de 500 responde 400.
      operationId: buscarTitulares
      security:
        - bearerAuth: []
      x-required-roles: [administrador]
      parameters:
        - name: nombre
          in: query
          required: false
          description: Trozo del nombre. Coincidencia parcial, sin distinguir mayusculas.
          schema:
            type: string
          example: escritora
        - name: ipi
          in: query
          required: false
          description: IPI exacto del titular. Un trozo de IPI no encuentra nada.
          schema:
            type: string
          example: IPI-00000001
        - name: persona_natural
          in: query
          required: false
          description: |
            Solo `true` o `false`; cualquier otro valor se rechaza con 400 en
            vez de ignorarse. Ignorado, quien pregunta por las personas
            juridicas -que son las que NO pueden recibir reparto- recibiria el
            padron entero y leeria a las personas naturales como si fueran lo
            que pidio.

            Ausente NO filtra: devuelve las dos clases de titular.
          schema:
            type: boolean
          example: false
        - name: ids
          in: query
          required: false
          style: form
          explode: true
          description: |
            Los identificadores del padron que se quieren, y ninguno mas. Es la
            consulta ACOTADA que ya usa en produccion la comprobacion de `R-01`
            (`RD 4.5`) al armar una declaracion: el reparto nombra unos pocos
            titulares, y sin este filtro comprobar la regla obliga a leer el
            padron entero -que no tiene tope- para responder por un punado de
            ids. Es la misma pregunta que `FiltroTitulares.IDs` del puerto.

            Se serializa de la forma estandar -la clave repetida,
            `?ids=tit-ana&ids=tit-luis`-, que es lo que produce un cliente
            generado a partir de este contrato. Una lista separada por comas
            (`?ids=tit-ana,tit-luis`) se acepta tambien, porque es lo que
            escribe una mano y es la misma pregunta. Los elementos vacios que
            deje una coma de mas se ignoran: no son identificadores.

            **Un identificador que no existe NO es un error**, ni del cliente ni
            del servidor: `ids` es un filtro, no una promesa de existencia. La
            respuesta es una lista vacia con 200 y quien pinta decide que hacer
            con el hueco.

            **Un `ids` vacio tampoco filtra**: `?ids=` -o solo comas- es la
            misma pregunta que no mandar el parametro, o sea el padron entero.
          schema:
            type: array
            items:
              type: string
          example: [tit-ana, tit-luis]
        - name: limite
          in: query
          required: false
          description: |
            Tamano de la pagina. Si se omite, el servidor aplica 100. Tiene
            que ser un entero positivo y no mayor que 500.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
          example: 50
        - name: desplazamiento
          in: query
          required: false
          description: |
            Cuantos titulares saltarse desde el inicio del resultado ordenado
            por identificador. Cero o ausente es la primera pagina.
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
      responses:
        "200":
          description: |
            Los titulares que cuadran, ordenados por identificador, recortados
            a la pagina pedida. Sin coincidencias devuelve una lista vacia, no
            un 404.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Titular"
              example:
                - id: tit-ana
                  nombre: Ana Escritora
                  ipi: IPI-00000001
                  persona_natural: true
                  clase: socio
                - id: tit-productora
                  nombre: Productora del Caribe S.A.S.
                  ipi: IPI-00000077
                  persona_natural: false
                  clase: administrado
        "400":
          description: Un filtro o un parametro de paginacion esta mal formado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: persona_natural tiene que ser true o false
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: Autenticado, pero el rol no basta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado

  /recaudo:
    post:
      tags: [recaudo]
      summary: Registrar lo cobrado a un usuario en un periodo
      description: |
        Da de alta una bolsa: el importe que un usuario ya pago en un periodo.

        **No calcula la tarifa.** Intela recibe el importe ya cobrado; el
        `bruto` viene del reporte de recaudo de REDES, no de aplicar la tabla
        del `RT` a una base de calculo.

        El `id` lo trae el cuerpo porque sale de ese mismo reporte y no de
        aqui. Por eso un segundo alta del mismo usuario, periodo y circuito
        responde 409 y no crea una segunda bolsa: duplicarla repartiria dos
        veces el mismo dinero.

        El `usuario_id` tiene que estar dado de alta antes
        (`POST /recaudo/usuarios`). No se crea al vuelo: un identificador mal
        escrito se convertiria en un pagador fantasma al que el reparto
        atribuiria dinero que alguien pago de verdad.

        Deja asiento en la bitacora en la misma transaccion (ADR 0006): una
        bolsa sin asiento es dinero que entro sin que nadie pueda decir de
        donde salio.
      operationId: registrarRecaudo
      security:
        - bearerAuth: []
      x-required-roles: [contabilidad, administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Bolsa"
            example:
              id: bolsa-caracol-2025-01-nacional
              usuario_id: caracol
              periodo: 2025-01
              circuito: nacional
              bruto: "1000000.00"
              convenio: conv-caracol-2025
              tarifa: RT-VI-2026
              factura: FE-1024
      responses:
        "201":
          description: La bolsa quedo registrada.
          headers:
            Location:
              description: Ruta de la bolsa recien creada.
              schema:
                type: string
              example: /bolsas/bolsa-caracol-2025-01-nacional
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bolsa"
              example:
                id: bolsa-caracol-2025-01-nacional
                usuario_id: caracol
                periodo: 2025-01
                circuito: nacional
                bruto: "1000000.00"
                convenio: conv-caracol-2025
                tarifa: RT-VI-2026
                factura: FE-1024
        "400":
          description: |
            Lo que llego no forma una bolsa -falta el usuario, el periodo no es
            `AAAA` ni `AAAA-MM`, el circuito no es uno de los dos, el importe
            es negativo o trae mas de dos decimales-, o el `usuario_id` no esta
            dado de alta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "bolsa invalida: periodo \"2025-13\", se esperaba AAAA o AAAA-MM con un mes entre 01 y 12"
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: Autenticado, pero el rol no basta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado
        "409":
          description: |
            Ya hay una bolsa para ese usuario, periodo y circuito. El circuito
            entra en la clave: el nacional y el internacional del mismo usuario
            y periodo son dos bolsas legitimas (`RD 10.3`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: ya existe una bolsa para ese usuario, periodo y circuito

  /recaudo/usuarios:
    get:
      tags: [recaudo]
      summary: Listar los usuarios que pagan recaudo
      description: |
        Devuelve los pagadores dados de alta, ordenados por identificador. Sin
        ninguno devuelve una lista vacia, no un 404.

        No son las cuentas que inician sesion. El reglamento llama "usuario" a
        quien explota el repertorio y paga por ello (`RT 2`): un canal, una
        sala de cine, un hotel, una plataforma OTT.
      operationId: listarUsuariosRecaudo
      security:
        - bearerAuth: []
      x-required-roles: [contabilidad, administrador]
      responses:
        "200":
          description: Los pagadores, ordenados por identificador.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsuarioRecaudo"
              example:
                - id: caracol
                  nombre: Caracol Television S.A.
                  nit: 860025674-2
                  categoria: tv_abierta
                - id: procinal
                  nombre: Procinal S.A.
                  nit: 800123456-1
                  categoria: cine
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: Autenticado, pero el rol no basta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado
    post:
      tags: [recaudo]
      summary: Dar de alta un usuario que paga recaudo
      description: |
        Registra un pagador. Tiene que existir antes de su primera bolsa.

        La `categoria` no es decorativa y no sirve para tarifar: decide con que
        formula se pondera la bolsa de ese usuario aguas abajo -television por
        puntos (`RD 9.1.1`), cine y teatro proporcional a taquilla (`RD 9.2`,
        `RD 9.3`), OTT por la ecuacion de `RD 9.7`, hoteles por remision a
        `RD 9.5`-.
      operationId: registrarUsuarioRecaudo
      security:
        - bearerAuth: []
      x-required-roles: [contabilidad, administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioRecaudo"
            example:
              id: caracol
              nombre: Caracol Television S.A.
              nit: 860025674-2
              categoria: tv_abierta
      responses:
        "201":
          description: El pagador quedo dado de alta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioRecaudo"
              example:
                id: caracol
                nombre: Caracol Television S.A.
                nit: 860025674-2
                categoria: tv_abierta
        "400":
          description: |
            Falta el identificador o el nombre, o la categoria no es una de las
            del reglamento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "usuario de recaudo invalido: falta el nombre"
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: Autenticado, pero el rol no basta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado
        "409":
          description: Ya hay un pagador con ese identificador.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: ya existe un usuario de recaudo con ese identificador

  /bolsas:
    get:
      tags: [bolsas]
      summary: Listar las bolsas
      description: |
        Devuelve las bolsas, ordenadas por identificador. Sin el parametro
        `periodo` no filtra por periodo (todas las bolsas). Distinto de
        `/obras`, que pagina siempre: aqui el listado sigue sin tope de
        paginacion. Sin coincidencias devuelve una lista vacia, no un 404.
      operationId: listarBolsas
      security:
        - bearerAuth: []
      x-required-roles: [contabilidad, administrador, distribucion, auditor]
      parameters:
        - name: periodo
          in: query
          required: false
          description: |
            Periodo exacto, `AAAA` o `AAAA-MM`, con el mes entre `01` y
            `12`. Un valor mal formado se rechaza con 400 en vez de ignorarse:
            ignorado devolveria todas las bolsas, y un mes imposible como
            `2025-13` devolveria una lista vacia que quien pregunta leeria como
            "ese mes no tuvo recaudo" en vez de "ese mes no existe".
          schema:
            type: string
            pattern: '^[0-9]{4}(-(0[1-9]|1[0-2]))?$'
          example: 2025-01
      responses:
        "200":
          description: Las bolsas que cuadran, ordenadas por identificador.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bolsa"
              example:
                - id: bolsa-caracol-2025-01-nacional
                  usuario_id: caracol
                  periodo: 2025-01
                  circuito: nacional
                  bruto: "1000000.00"
                  convenio: conv-caracol-2025
                  tarifa: RT-VI-2026
                  factura: FE-1024
        "400":
          description: El periodo esta mal formado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "bolsa invalida: periodo \"2025-13\", se esperaba AAAA o AAAA-MM con un mes entre 01 y 12"
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: Autenticado, pero el rol no basta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado

  /bolsas/{id}:
    get:
      tags: [bolsas]
      summary: Leer una bolsa
      description: |
        Devuelve una bolsa por su identificador, con su procedencia -de donde
        salio ese dinero (ADR 0006)-.
      operationId: bolsaPorID
      security:
        - bearerAuth: []
      x-required-roles: [contabilidad, administrador, distribucion, auditor]
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador de la bolsa.
          schema:
            type: string
          example: bolsa-caracol-2025-01-nacional
      responses:
        "200":
          description: La bolsa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bolsa"
              example:
                id: bolsa-caracol-2025-01-nacional
                usuario_id: caracol
                periodo: 2025-01
                circuito: nacional
                bruto: "1000000.00"
                convenio: conv-caracol-2025
                tarifa: RT-VI-2026
                factura: FE-1024
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: Autenticado, pero el rol no basta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado
        "404":
          description: No hay ninguna bolsa con ese identificador.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: esa bolsa no existe

  /alertas:
    get:
      tags: [anomalias]
      summary: Listar las anomalias de un periodo
      description: |
        Devuelve las alertas que cuadran con el filtro, de la mas reciente a
        la mas antigua. Sin coincidencias devuelve una lista vacia, no un 404.

        Los tres filtros son opcionales y ninguno se ignora cuando llega mal:
        un `periodo` mal formado o un `tipo` que no esta en la lista cerrada
        salen con 400. Ignorados devolverian todo -o nada- y quien pregunta lo
        leeria como "ese periodo no tuvo anomalias".

        Esta ruta NO evalua: es una lectura. La pasada de deteccion se dispara
        con `POST /alertas/evaluacion`.
      operationId: listarAlertas
      security:
        - bearerAuth: []
      x-required-roles: [administrador, distribucion, auditor]
      parameters:
        - name: periodo
          in: query
          required: false
          description: |
            Periodo exacto, `AAAA` o `AAAA-MM`, con el mes entre `01` y `12`.
            Un valor mal formado se rechaza con 400 en vez de ignorarse.
          schema:
            type: string
            pattern: '^[0-9]{4}(-(0[1-9]|1[0-2]))?$'
          example: 2025-01
        - name: tipo
          in: query
          required: false
          description: |
            Uno de los seis tipos de anomalia. Una grafia que no este en la
            lista se rechaza con 400: devolver la lista vacia haria pasar un
            `onni` por "no hay ninguna de ese tipo".
          schema:
            $ref: "#/components/schemas/TipoDeAnomalia"
        - name: resueltas
          in: query
          required: false
          description: |
            `false` deja solo las abiertas, `true` solo las cerradas. Sin el
            parametro salen las dos: "no filtrar" y "solo las resueltas" no
            pueden ser el mismo valor, o no habria forma de pedir el historial.
          schema:
            type: boolean
          example: false
        - name: limite
          in: query
          required: false
          description: |
            Cuantas alertas devolver. Igual que en `/obras` y `/titulares`.
            Sin el, el por defecto (100). Tres de los seis detectores emiten
            UNA alerta por fila de uso, asi que una evaluacion real sobre un
            lote de 10.000 registros deja del orden de 10.000 alertas: sin
            recorte, el panel -que sondea cada 15 segundos- se traeria varios
            MB en cada vuelta.
          schema:
            type: integer
            minimum: 1
            maximum: 500
          example: 100
        - name: desplazamiento
          in: query
          required: false
          description: Desde que fila. Cero es el principio.
          schema:
            type: integer
            minimum: 0
          example: 0
      responses:
        "200":
          description: Las alertas que cuadran.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alerta"
              example:
                - id: 3f1d0a4e-0000-4000-8000-000000000001
                  tipo: reserva_declaracion_incompleta
                  detalle: >-
                    la declaracion vigente de la obra "obra-12" suma 60% en 1
                    parte(s) y no llega a 100: se retiene el TOTAL de esa obra,
                    no se reparte la parte declarada (R-04, RD 13.1.3)
                  periodo: 2025-01
                  referencia: obra:obra-12
                  ref_tipo: obra
                  ref_id: obra-12
                  critica: false
                  detectada: "2026-05-02T08:30:00Z"
                  resuelta: false
        "400":
          description: Un filtro llego mal formado o fuera de su lista cerrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "bolsa invalida: periodo \"2025-13\", se esperaba AAAA o AAAA-MM con un mes entre 01 y 12"
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: Autenticado, pero el rol no basta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado
        "503":
          description: Esta instalacion no cableo la deteccion de anomalias.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: la deteccion de anomalias no esta configurada en esta instalacion

  /alertas/evaluacion:
    post:
      tags: [anomalias]
      summary: Evaluar las anomalias de un periodo
      description: |
        Corre los seis detectores sobre el periodo ya armado y escribe las
        alertas que encuentre.

        **Es idempotente.** Se puede correr al cerrar la ingesta, otra vez
        cuando un autor declara, y otra antes de la compuerta: la clave natural
        de la tabla es la identidad del hallazgo (periodo, tipo y registro
        ofensor), asi que la misma anomalia no se escribe dos veces. Por eso la
        respuesta trae `detectadas` y `nuevas` por separado: la segunda pasada
        sigue detectando seis y escribe cero.

        Una alerta que una persona ya cerro **no se reabre** aunque la anomalia
        siga ahi. Limitacion conocida, ver ADR 0020.

        Responde 200 y no 201: la pasada no crea un recurso con URL, crea N
        alertas o ninguna, y lo que devuelve es el recuento.

        Escribe, asi que pide `administrador` o `distribucion`. `auditor` lee
        la bandeja y no la dispara.
      operationId: evaluarAnomalias
      security:
        - bearerAuth: []
      x-required-roles: [administrador, distribucion]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PedidoDeEvaluacion"
            example:
              periodo: 2025-01
      responses:
        "200":
          description: La pasada termino. Recuento de lo que se vio y de lo que se escribio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumenDeEvaluacion"
              example:
                periodo: 2025-01
                detectadas: 6
                nuevas: 6
                por_tipo:
                  oni: 1
                  duplicado_archivo: 1
                  duplicado_registro: 1
                  titular_sin_porcentaje: 1
                  reserva_declaracion_incompleta: 1
                  tipo_obra_sin_mapear: 1
                criticas_abiertas: 3
                usos_sin_cotejar: 0
        "400":
          description: El periodo falta o esta mal formado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "bolsa invalida: periodo \"2025-13\", se esperaba AAAA o AAAA-MM con un mes entre 01 y 12"
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: Autenticado, pero el rol no basta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado
        "503":
          description: Esta instalacion no cableo la deteccion de anomalias.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: la deteccion de anomalias no esta configurada en esta instalacion

  /alertas/{id}/resolver:
    post:
      tags: [anomalias]
      summary: Resolver una alerta
      description: |
        Marca la alerta como atendida a nombre de quien la atiende. Quien firma
        sale de la SESION y no del cuerpo: dejarlo llegar por JSON permitiria
        firmar la decision a nombre de otro, y el asiento del ADR 0006 tiene
        que nombrar a quien la tomo de verdad.

        **No toca el registro ofensor.** Asignar la obra de un ONI o descartar
        una fila es la bandeja de #39, con su propio caso de uso y su propio
        asiento; esto solo deja constancia de que alguien se hizo cargo.

        Resolver dos veces responde 409, no 200: quien pulsa el boton el
        segundo tiene que saber que la firma escrita no es la suya. Dos
        personas mirando el mismo tablero es el caso normal.
      operationId: resolverAlerta
      security:
        - bearerAuth: []
      x-required-roles: [administrador, distribucion]
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador de la alerta (UUID).
          schema:
            type: string
            format: uuid
          example: 3f1d0a4e-0000-4000-8000-000000000001
      requestBody:
        required: false
        description: |
          Opcional. La nota es informacion para quien lea el tablero despues;
          el dato obligatorio -quien resolvio- sale de la sesion.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolucionDeAlerta"
            example:
              nota: hablado con la autora, declara esta semana
      responses:
        "200":
          description: La alerta, ya cerrada y firmada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alerta"
              example:
                id: 3f1d0a4e-0000-4000-8000-000000000001
                tipo: reserva_declaracion_incompleta
                detalle: >-
                  la declaracion vigente de la obra "obra-12" suma 60% en 1
                  parte(s) y no llega a 100
                periodo: 2025-01
                referencia: obra:obra-12
                ref_tipo: obra
                ref_id: obra-12
                critica: false
                detectada: "2026-05-02T08:30:00Z"
                resuelta: true
                resuelta_por: usr-admin
                resuelta_en: "2026-05-03T14:05:00Z"
                nota: hablado con la autora, declara esta semana
        "400":
          description: El cuerpo no es un JSON valido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: el cuerpo tiene que ser un JSON con la nota
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: Autenticado, pero el rol no basta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado
        "404":
          description: No hay ninguna alerta con ese identificador.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: esa alerta no existe
        "409":
          description: La alerta existe y alguien la cerro antes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: esa alerta ya estaba resuelta
        "503":
          description: Esta instalacion no cableo la deteccion de anomalias.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: la deteccion de anomalias no esta configurada en esta instalacion

  /reportes:
    get:
      tags: [ingesta]
      summary: Cargas hechas
      description: |
        El listado de entregas recibidas, de la mas reciente a la mas antigua.
        Es la unica lectura que responde "¿entro completo lo que subi?": el
        recuento de filas aceptadas y rechazadas por entrega solo se ve aqui.

        Cada carga viene atada a su periodo de recaudo y a la evidencia cruda
        de la que salio (`sha256`, `clave_objeto`), que es lo que permite
        volver al archivo EXACTO que pondero una corrida y no "al archivo de
        esa fuente" (ADR 0006).
      operationId: listarCargas
      security:
        - bearerAuth: []
      x-required-roles: [administrador]
      parameters:
        - name: periodo
          in: query
          required: false
          description: |
            Periodo de recaudo, `AAAA` o `AAAA-MM`, con el mes entre `01` y
            `12`. Ausente o vacio no filtra.

            Un periodo mal escrito se rechaza con 400 en vez de ignorarse: no
            casaria con ninguna fila y devolveria una lista vacia
            indistinguible de "ese periodo no tuvo cargas". Un mes que no existe
            -`2026-13`, `2026-00`- se rechaza por lo mismo, con la misma regla
            que aplica el alta de una entrega: es la del dominio
            (`internal/dominio/recaudo`), no una copia por capa.
          schema:
            type: string
            pattern: '^[0-9]{4}(-(0[1-9]|1[0-2]))?$'
          example: 2026-01
      responses:
        "200":
          description: Las cargas. Lista vacia si no hay ninguna, nunca `null`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Carga"
        "400":
          description: El periodo no tiene la forma AAAA o AAAA-MM, o el mes no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: 'reporte invalido: periodo "2026-1", se esperaba AAAA o AAAA-MM con un mes entre 01 y 12'
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: Autenticado, pero el rol no basta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado
        "503":
          description: |
            Esta instalacion no cablea la ingesta. Es el caso de `cmd/lambda`,
            cuyo sistema de ficheros no sirve de boveda inmutable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: la ingesta de reportes no esta configurada en esta instalacion

    post:
      tags: [ingesta]
      summary: Subir un reporte de uso
      description: |
        La subida manual, que el criterio de aceptacion de OE-1 declara
        "fallback permanente": la adquisicion autonoma es otro issue.

        El archivo se PARSEA antes de tocar nada. Un fallo estructural -el
        libro no se abre, falta una columna requerida- responde 400 sin
        persistir NADA, ni siquiera la evidencia cruda: de la boveda no se
        borra (ADR 0006), y escribir el acuse quemaria la huella de ese archivo
        para esa fuente, de modo que la correccion que el cliente mande despues
        chocaria con 409 si resulta ser el mismo archivo.

        Un lote con filas malas NO es un error: es el caso normal. Las buenas
        se persisten y las malas vuelven en `rechazados`, cada una con su
        motivo nombrando el campo y la columna. Ninguna se descarta.

        El formato sale de la extension de `archivo` salvo que se mande
        `formato` explicito. `multipart.FileHeader.Filename` no es de fiar, asi
        que de el sale UNICAMENTE esa decision: la clave del objeto de la
        boveda se deriva de la huella del contenido, no del nombre.
      operationId: subirReporte
      security:
        - bearerAuth: []
      x-required-roles: [administrador]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [fuente, periodo, archivo]
              properties:
                fuente:
                  type: string
                  description: |
                    Quien entrego. Es lo que se estampa en cada fila y lo que
                    indexa la tabla de alias, asi que tiene que ser una de las
                    fuentes con adaptador dado de alta; si no, 400 con la lista
                    de las que hay.
                  example: caracol
                periodo:
                  type: string
                  description: |
                    Periodo de recaudo al que pondera la entrega. `AAAA` o
                    `AAAA-MM` con el mes entre `01` y `12`: un mes que no existe
                    no se admite, y no hay vuelta atras que lo arregle -la
                    unicidad es (sha256, fuente), la huella no incluye el periodo
                    y no hay ruta de borrado-.
                  pattern: '^[0-9]{4}(-(0[1-9]|1[0-2]))?$'
                  example: 2026-01
                formato:
                  type: string
                  description: |
                    Opcional. Si falta, se deduce de la extension de `archivo`.
                  enum: [xlsx, csv, json]
                archivo:
                  type: string
                  format: binary
                  description: |
                    El reporte tal como lo entrego la fuente. Tope de 32 MiB;
                    el streaming de archivos grandes es el issue #46.
      responses:
        "201":
          description: |
            La entrega quedo congelada y sus filas persistidas. `rechazados`
            puede venir con contenido: eso no es un fallo de la peticion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entrega"
        "400":
          description: |
            La entrega no cumple la estructura minima: falta una columna
            requerida, el archivo no se puede abrir, no hay adaptador para ese
            par (fuente, formato), el periodo esta mal escrito o el mes no
            existe, o el archivo no trae ninguna fila. NADA se persistio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: 'reporte invalido: a la entrega de "caracol" le faltan columnas requeridas: Duracion_total. El archivo trae: Canal, Titulo, ID_Ficha'
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: Autenticado, pero el rol no basta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado
        "409":
          description: |
            Esa fuente ya entrego exactamente esos bytes -lo decide el
            UNIQUE (sha256, fuente), no el nombre del archivo-, o la boveda ya
            tiene contenido distinto bajo esa huella.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: esa fuente ya entrego exactamente ese archivo
        "413":
          description: |
            El archivo pasa del tope de 32 MiB. El cuerpo de la peticion se
            corta en el tope mas el margen de la envoltura multipart, asi que
            una subida mayor deja de leerse en cuanto se pasa en vez de
            recibirse entera para rechazarla despues.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: el archivo pasa de 32 MiB
        "503":
          description: Esta instalacion no cablea la ingesta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: la ingesta de reportes no esta configurada en esta instalacion

  /reportes/{id}/rechazos:
    get:
      tags: [ingesta]
      summary: Log de rechazos de una carga
      description: |
        Las filas que no se pudieron normalizar en UNA entrega, cada una con
        su motivo. Existe porque `GET /reportes` solo trae el RECUENTO de
        rechazos por carga, y es lo que despliega una fila de ese listado.

        Sale PAGINADO, con la misma forma que `GET /obras`. Un archivo con la
        cabecera equivocada rechaza todas sus filas, y leer ese log entero -y
        pintarlo entero, un renglon por fila- congela la pestana y puede tumbar
        el proceso de la API.

        La cota NO trunca la cifra: el total de rechazos de la carga sigue
        viajando en `Carga.rechazados` (`GET /reportes`), que es de donde quien
        pinta saca su "N de M". Nadie tiene que adivinar cuantas filas quedaron
        fuera de la pagina, y el log completo sigue siendo alcanzable pagina a
        pagina.

        Las filas salen en el orden en que venian en el archivo, que es el
        orden en que hay que pedirle al cliente lo que falta.

        Una carga que no existe responde 404, y no una lista vacia: "no llego"
        y "llego sin rechazos" son las dos respuestas que esta lectura existe
        para distinguir. Una pagina vacia de una carga que SI existe es 200 con
        la lista vacia, nunca un 404: quedar sin filas mas alla del final no
        significa que la carga no este.
      operationId: listarRechazosDeCarga
      security:
        - bearerAuth: []
      x-required-roles: [administrador]
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador de la carga, el `id` de `Carga` o de `Entrega`.
          schema:
            type: string
          example: rep-9f2c...
        - name: limite
          in: query
          required: false
          description: |
            Cuantos rechazos trae la pagina. Si se omite, el servidor aplica
            100. Tiene que ser un entero positivo y no mayor que 500.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
          example: 100
        - name: desplazamiento
          in: query
          required: false
          description: |
            Cuantos rechazos saltarse desde el inicio del log, que va en orden
            de fila del archivo. Cero o ausente es la primera pagina.
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
      responses:
        "200":
          description: |
            La pagina pedida del log, en orden de fila. Lista vacia si la carga
            no tuvo rechazos o si el desplazamiento cae mas alla del final,
            nunca `null`. El total de la carga no viene aqui: es
            `Carga.rechazados` en `GET /reportes`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rechazo"
        "400":
          description: El identificador de la carga llego en blanco, o el limite
            y el desplazamiento no son enteros validos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: 'reporte invalido: falta el id de la carga'
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: Autenticado, pero el rol no basta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado
        "404":
          description: No hay ninguna carga con ese identificador.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: esa carga no existe
        "503":
          description: Esta instalacion no cablea la ingesta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: la ingesta de reportes no esta configurada en esta instalacion

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Token de sesion. Las sesiones expiran: el token no es una credencial
        permanente.

        La autenticacion no basta: cada grupo de rutas exige un rol del
        reglamento (`x-required-roles` en la operacion). Sin sesion la
        respuesta es 401; con sesion de un rol no permitido, 403. La
        matriz Rol -> capacidad esta en docs/architecture/roles.md.

  schemas:
    Entrega:
      type: object
      description: |
        El acuse de una entrega ingerida entera.

        No hay campo de dinero, y no lo va a haber: un reporte de uso PONDERA
        la bolsa, no la aporta.
      required:
        [id, fuente, periodo, sha256, clave_objeto, nbytes, aceptados, rechazados]
      properties:
        id:
          type: string
          description: |
            Identificador de la entrega. Se deriva del par (fuente, huella), no
            del nombre del archivo.
          example: rep-9f2c...
        fuente:
          type: string
          example: caracol
        periodo:
          type: string
          example: 2026-01
        sha256:
          type: string
          description: |
            Huella de los bytes crudos. Es como se cita una evidencia en toda
            la trazabilidad (ADR 0006).
          pattern: '^[0-9a-f]{64}$'
        clave_objeto:
          type: string
          description: Donde quedaron los bytes en la boveda. Se deriva de la huella.
          example: reportes/9f2c...
        nbytes:
          type: integer
          example: 21032
        aceptados:
          type: integer
          description: Filas que entraron a la forma canonica.
          example: 58
        rechazados:
          type: array
          description: |
            Las filas que no se pudieron normalizar, con su motivo. Lista vacia
            si no hubo ninguna, nunca `null`.
          items:
            $ref: "#/components/schemas/Rechazo"

    Rechazo:
      type: object
      description: |
        Una fila que no se pudo normalizar. Lleva lo identificatorio y el
        motivo, y NINGUNA columna de medida: una fila rechazada no pondera, y
        sin las medidas nadie las puede sumar "solo para ver" (ADR 0016).
      required: [id, titulo, ids_fuente, motivo]
      properties:
        id:
          type: string
          description: |
            Identificador de la fila. Vive en el log de rechazos y no en `usos`:
            un id esta en una de las dos tablas, nunca en las dos.
        titulo:
          type: string
        ids_fuente:
          type: string
          description: El identificador de la fuente, tal como venia.
        motivo:
          type: string
          description: |
            Por que se aparto. Nombra el CAMPO canonico y la COLUMNA del
            archivo, que es lo que permite volver a pedirle al cliente
            exactamente eso.
          example: 'fila 6, duracion_min (columna "Duracion_total"): "cuarenta y cinco" no es un numero'

    Carga:
      type: object
      description: Una entrega en el listado de cargas hechas.
      required:
        [id, fuente, periodo, sha256, clave_objeto, nbytes, recibido, aceptados, rechazados]
      properties:
        id:
          type: string
        fuente:
          type: string
          example: caracol
        periodo:
          type: string
          example: 2026-01
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        clave_objeto:
          type: string
          description: |
            Donde quedaron los bytes en la boveda. Se deriva de la huella, igual
            que en el acuse de POST. Sin ella, tras recargar, el listado no
            permite volver a la evidencia exacta (ADR 0006).
          example: reportes/9f2c...
        nbytes:
          type: integer
        recibido:
          type: string
          format: date-time
          description: |
            Cuando llego. Sale del reloj de la base: es la marca de un hecho de
            almacenamiento, no de negocio. Nada del reparto se calcula con el.
        aceptados:
          type: integer
        rechazados:
          type: integer
          description: |
            Cuantas filas quedaron en el log de rechazos. Junto con `aceptados`
            es lo que responde si la carga entro completa.

    Estado:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          description: Estado del proceso.
          enum: [ok, listo]

    Credenciales:
      type: object
      required: [email, clave]
      properties:
        email:
          type: string
          format: email
          description: Correo con el que el usuario esta dado de alta.
        clave:
          type: string
          format: password
          description: |
            La contrasena en claro. Solo viaja en esta peticion y nunca se
            almacena: lo que se guarda es su hash bcrypt.

    Usuario:
      type: object
      required: [id, email, nombre, rol, titular_id]
      properties:
        id:
          type: string
          description: Identificador interno, opaco y estable.
        email:
          type: string
          format: email
          description: Correo del usuario.
        nombre:
          type: string
          description: Nombre para mostrar.
        rol:
          type: string
          description: |
            Rol del reglamento con el que se decide que puede hacer.
          enum: [administrador, distribucion, contabilidad, auditor, titular]
        titular_id:
          type: string
          description: |
            Titular al que representa, si el rol es `titular`. Cadena vacia en
            los demas roles: un administrador no cobra reparto (`R-01`).

    Sesion:
      type: object
      required: [token, expira, usuario]
      properties:
        token:
          type: string
          description: |
            Token de sesion, opaco. Se manda en `Authorization: Bearer`.

            Es el unico momento en que existe en claro: en la base se guarda
            solo su resumen, asi que no se puede recuperar. Si se pierde, hay
            que iniciar sesion de nuevo.
        expira:
          type: string
          format: date-time
          description: |
            Instante en que el token deja de valer, en RFC 3339. A partir de
            el, cualquier peticion con este token responde 401.
        usuario:
          $ref: "#/components/schemas/Usuario"

    Coautor:
      type: object
      required: [nombre, ipi, rol]
      description: |
        Quien escribio la obra, tal como lo registra el catalogo.

        **No tiene porcentaje, y no es un olvido.** Este campo dice QUIEN
        ESCRIBIO la obra; a quien se le paga y cuanto sale solo de la
        Declaracion de Obra (`R-02`, `R-03`, `RD 7.3.1`). Un porcentaje aqui
        abriria un segundo camino hasta un pago que no firma ninguna
        Declaracion.
      properties:
        nombre:
          type: string
          description: Nombre de la persona, para mostrar.
        ipi:
          type: string
          description: |
            IPI de la persona. Obligatorio: es el identificador de autores de
            la CISAC (`RD 3`) y por donde busca el catalogo. Un coautor sin
            IPI es un nombre suelto que no resuelve a nadie.
        rol:
          type: string
          description: |
            Aporte por el que figura como coautor. El conjunto esta cerrado
            porque `RD 7.3.3` deja fuera por su nombre a productores
            ejecutivos, revisores, ejecutivos de cadena, actores y directores
            de casting: no escriben, no generan derecho de autor, y no pueden
            entrar al catalogo como coautores.
          enum: [guionista, libretista, adaptador, argumentista]

    MetadatosObra:
      type: object
      required: [titulo, genero, anio, tipo, coautores]
      description: Todo lo de una obra menos su identificador.
      properties:
        titulo:
          type: string
          description: Titulo de la obra, tal como se declaro.
        genero:
          type: string
          description: |
            Genero declarado. Texto libre a proposito, y distinto de `tipo`:
            `tipo` es la clasificacion del reglamento que usa la metodologia
            de reparto (`RD 9.1.1`), y `genero` es el de las parrillas
            (Telenovela, Magazine, Noticiero...). El mapeo entre los dos es
            una pregunta abierta con el cliente; cerrar este enum seria
            tomarla de tapadillo.
        anio:
          type: integer
          minimum: 1
          description: Anio de produccion.
        tipo:
          type: string
          description: Clasificacion del reglamento, la que usa el reparto (`RD 9.1.1`).
          enum: [cinematografica, unitario, serie, telenovela, sketches]
        ida:
          type: string
          description: |
            Identificador IDA de la CISAC, si se conoce. Cadena vacia si no.
        eidr:
          type: string
          description: Identificador EIDR de la industria, si se conoce.
        imdb:
          type: string
          description: Identificador IMDB, si se conoce.
        coautores:
          type: array
          minItems: 1
          description: |
            Quienes escribieron la obra. Al menos uno: una obra sin ningun
            coautor con IPI no resuelve a nadie, y contra este catalogo
            resuelve todo el matching.
          items:
            $ref: "#/components/schemas/Coautor"

    IdentidadObra:
      type: object
      required: [id]
      description: El identificador de una obra, y nada mas.
      properties:
        id:
          type: string
          description: |
            Identificador de la obra. Opaco, unico e inmutable. Es el numero de
            obra de REDES-SYS, que se asigna FUERA de este sistema: lo trae
            quien da de alta la obra, y ninguna operacion posterior lo cambia.

    NuevaObra:
      description: |
        El cuerpo de un alta de obra: el identificador y sus metadatos.

        **No es `Obra`, y la diferencia importa.** `Obra` lleva ademas
        `estado_declaracion`, `suma_porcentajes` y `version_vigente`, que el
        servidor calcula a partir de la Declaracion de Obra vigente. Mandarlos
        no cambia nada -el alta no los mira-, asi que un cuerpo que los exigiera
        estaria afirmando una facultad que quien llama no tiene.

        Es allOf y no un objeto plano por la misma razon que `Obra`: los
        metadatos son los mismos en las dos, y duplicarlos aqui seria una
        segunda copia que se desvia.
      allOf:
        - $ref: "#/components/schemas/IdentidadObra"
        - $ref: "#/components/schemas/MetadatosObra"

    Obra:
      type: object
      required: [id, titulo, genero, anio, tipo, coautores, estado_declaracion, suma_porcentajes, version_vigente]
      description: |
        Una entrada del catalogo maestro: su identificador, sus metadatos, y lo
        que el sistema sabe hoy de su Declaracion de Obra.

        El identificador es inmutable. Se asigna al crear la obra -lo trae
        quien la registra, es el numero de obra de REDES-SYS- y ninguna
        operacion lo cambia: es lo que referencian las declaraciones, los
        alias de fuente y los usos.

        Los tres ultimos campos son DERIVADOS y de solo lectura: los calcula el
        servidor a partir de la version vigente de la declaracion. No entran por
        ningun cuerpo -para mandar una obra esta `NuevaObra`, y para corregir
        sus metadatos, `MetadatosObra`-, y por eso no viven en `MetadatosObra`,
        que es lo que un cliente puede enviar. Estan en las cuatro respuestas
        que devuelven una obra porque el catalogo es donde un administrador ve
        que obras se pueden repartir y cuales quedan retenidas.
      allOf:
        - $ref: "#/components/schemas/IdentidadObra"
        - $ref: "#/components/schemas/MetadatosObra"
        - type: object
          required: [estado_declaracion, suma_porcentajes, version_vigente]
          properties:
            estado_declaracion:
              type: string
              enum: [completa, incompleta]
              description: |
                Estado de la Declaracion de Obra vigente. `completa` si las
                partes suman exactamente 100; `incompleta` en cualquier otro
                caso, incluida una obra que no tiene ninguna declaracion.

                **`incompleta` no es un error ni un rechazo.** Es un estado
                valido del negocio: bajo `R-04` (`RD 13.1.3`) no se reparte nada
                de esa obra y se retiene el total en reserva, nunca se reparte a
                medias. Por eso el conjunto tiene DOS valores y no tres: no hay
                ningun estado `invalida` guardado -lo que el sistema rechaza es
                DECLARAR una suma por encima de 100, y eso es un 400 de la
                escritura, no un estado que aparezca en un listado-.
            suma_porcentajes:
              type: number
              format: decimal
              minimum: 0
              maximum: 100
              description: |
                Suma de los porcentajes de las partes de la version vigente.
                Cero si la obra no tiene ninguna declaracion.

                Es lo DECLARADO, no lo repartido. Viaja como numero, sin
                comillas, igual que el `porcentaje` de una parte: un porcentaje
                tiene hasta 4 decimales acotados por `NUMERIC(8,4)` y se muestra
                tal cual -aqui no se redondea nada, los decimales los decide
                quien lo pinta-. El dinero de las bolsas va al reves, como
                cadena, porque una cifra de terceros no puede pasar por un
                `double` (ADR 0005); un porcentaje de reparto no es esa cifra.

                **No se deduce de `estado_declaracion`, ni al reves.** Una parte
                sin IPI deja la declaracion `incompleta` con la suma en 100, asi
                que las dos cosas viajan y las dos se muestran: deducir una de
                la otra mentiria en un sentido o en el otro.
            version_vigente:
              type: integer
              minimum: 1
              nullable: true
              description: |
                Version de la Declaracion de Obra que rige ahora mismo, o `null`
                si la obra no tiene ninguna declaracion.

                **Existe porque `estado_declaracion` no basta para decirlo
                todo.** Una obra que nunca se declaro y una declarada que no
                suma 100 dan el MISMO estado -`incompleta`, y las dos quedan
                retenidas bajo `R-04`-, asi que sin este campo una pantalla
                tendria que pintar "incompleta" sobre obras que nadie declaro,
                que es afirmar una declaracion inexistente. Es el ORIGEN del
                estado, no un tercer estado: `null` es "no hay declaracion", y
                un numero es la version que lo sostiene.

    Parte:
      type: object
      required: [titular_id, ipi, porcentaje]
      description: |
        Lo que un titular declaro sobre una obra. El unico origen valido de un
        porcentaje de reparto es este (`R-03`) -nunca un reporte de uso ni un
        contrato de escritura-.
      properties:
        titular_id:
          type: string
          description: |
            Identificador del titular al que corresponde esta parte. Se ignoran
            los espacios al inicio y al final.
        ipi:
          type: string
          description: |
            IPI del titular. Obligatorio, igual que en un coautor del catalogo,
            y ademas tiene que ser el que el padron tiene para `titular_id`: al
            guardar una declaracion, un IPI que no coincide se rechaza con 400.
            Se ignoran los espacios al inicio y al final.
        porcentaje:
          type: number
          format: decimal
          minimum: 0
          maximum: 100
          # No exclusiveMinimum aqui a proposito: redocly-cli@1 (el que fija
          # CI en contract.yml) lo exige boolean para la regla `struct` de
          # OAS 3.0 pero numerico para el Ajv que usa
          # `no-invalid-media-type-examples` al validar los ejemplos -ninguna
          # de las dos formas satisface a la otra regla, y las dos estan en
          # `error` en redocly.yaml-. La restriccion real -estrictamente
          # positivo- la sigue exigiendo el backend, no el esquema.
          description: |
            Porcentaje declarado por este titular. El esquema solo exige no
            negativo: la regla real -estrictamente positivo, un titular al 0%
            no es titular, hasta 4 decimales- la aplica el backend
            (`ErrDeclaracionInvalida`), que es la fuente autoritativa. Mas de
            4 decimales se rechaza y no se redondea: es la precision que
            `declaraciones.porcentaje` puede guardar sin perderla en
            silencio. La SUMA de todas las partes de una declaracion puede dar
            menos de 100 -es `declaracion_incompleta`, un estado valido de
            `R-04`- pero nunca mas.

    VersionDeclaracion:
      type: object
      required: [version, vigente_desde, vigente_hasta, estado, partes]
      description: |
        Una version de la Declaracion de Obra, con la ventana de tiempo en la
        que rigio. Un reparto de un periodo pasado usa la version vigente
        ENTONCES, no la mas reciente -es lo que hace consultable `.../historial`-.
      properties:
        version:
          type: integer
          minimum: 1
          description: Numero de version, consecutivo por obra empezando en 1.
        vigente_desde:
          type: string
          format: date-time
          description: Instante en que esta version empezo a regir.
        vigente_hasta:
          type: string
          format: date-time
          nullable: true
          description: |
            Instante en que dejo de regir. `null` quiere decir que esta es la
            version vigente ahora mismo.
        estado:
          type: string
          enum: [completa, incompleta]
          description: |
            `completa` si las partes suman exactamente 100; `incompleta` en
            cualquier otro caso -incluida una obra sin ninguna parte-. Nunca
            se reparte una obra `incompleta`: se retiene el total (`R-04`).
        partes:
          type: array
          items:
            $ref: "#/components/schemas/Parte"

    Titular:
      type: object
      required: [id, nombre, ipi, persona_natural, clase]
      description: |
        Una entrada del padron: quien figura ante la sociedad.

        **Estar en el padron no es poder cobrar.** `R-01` (`RD 4.5`) solo
        admite orden de pago a un escritor persona natural, asi que una
        productora aparece aqui y no puede recibir reparto. Por eso
        `persona_natural` viaja en la respuesta -es lo que permite explicar la
        regla- y por eso no se devuelven solo las personas naturales.

        Figurar en el padron NO basta para ser `Parte` de una Declaracion de
        Obra: solo una persona natural puede figurar como `Parte` (`R-01`,
        `RD 4.5`), y nombrar a una que no lo sea se rechaza con 400. Eso NO le
        da derecho a cobrar por si solo: el porcentaje sale de la declaracion
        (`R-02`, `R-03`).

        No lleva `email`, y no es un olvido: el padron se sirve para armar un
        reparto, y la direccion de contacto de cada titular no es dato de
        ninguna regla de reparto. Entra el dia que haya una pantalla que la
        muestre.
      properties:
        id:
          type: string
          description: Identificador del titular en el padron. Opaco y estable.
        nombre:
          type: string
          description: Nombre de la persona o de la empresa, para mostrar.
        ipi:
          type: string
          description: |
            IPI del titular, el identificador de autores de la CISAC (`RD 3`).
            Vacio en una persona juridica que no lo tenga: el padron solo exige
            IPI a las personas naturales.
        persona_natural:
          type: boolean
          description: |
            Si el titular es una persona fisica. `false` es una persona
            juridica, y una persona juridica NO puede recibir reparto
            (`R-01`, `RD 4.5`).
        clase:
          type: string
          enum: [socio, administrado]
          description: |
            Tipo de afiliado, que decide quien vota (capitulo 4 del reglamento
            de socios). No decide quien cobra: un administrado persona natural
            cobra igual que un socio.

    UsuarioRecaudo:
      type: object
      required: [id, nombre, categoria]
      description: |
        Quien explota el repertorio y PAGA por ello: un canal, una sala de cine,
        un hotel, una plataforma OTT, una empresa de transporte (`RT 2`).

        No confundir con `Usuario`, que es la cuenta que inicia sesion en
        Intela. La colision viene del lenguaje del reglamento, que llama
        "usuario" al que usa las obras; son dos entidades distintas y ninguna
        referencia a la otra.
      properties:
        id:
          type: string
          description: |
            Identificador del pagador. Lo asigna quien lo da de alta, no el
            sistema: asi un segundo alta con el mismo identificador se rechaza
            en vez de crear una segunda fila para el mismo canal.
          example: caracol
        nombre:
          type: string
          description: Razon social del pagador. No puede estar en blanco.
          example: Caracol Television S.A.
        nit:
          type: string
          description: |
            NIT del pagador. Opcional: el circuito internacional lo alimentan
            sociedades hermanas, que no tienen NIT colombiano.
          example: 860025674-2
        categoria:
          type: string
          description: |
            Categoria del usuario segun el Reglamento de Tarifas. Son las diez
            de la tabla resumen `RT 4`, que es la operativa -`RT 3` anuncia
            seis tipos y enumera siete; la discrepancia esta en el documento
            fuente-.

            No sirve para tarifar: Intela no factura. Decide con que formula se
            pondera la bolsa de ese usuario aguas abajo.

            `sin_clasificar` es el hueco declarado, no una categoria del
            reglamento: lo llevan los pagadores que ya citaban las bolsas antes
            de que existiera esta tabla, y los del circuito internacional. El
            ADR 0004 pide que el hueco se vea en vez de rellenarlo con una
            categoria comoda.
          enum:
            - tv_abierta
            - tv_cerrada
            - cine
            - transporte_aereo
            - transporte_terrestre
            - transporte_fluvial
            - hotel
            - salud
            - medios_digitales
            - otros_establecimientos
            - sin_clasificar
          example: tv_abierta

    Bolsa:
      type: object
      required: [id, usuario_id, periodo, circuito, bruto]
      description: |
        Lo que un usuario pago en un periodo, y lo unico que el modulo de
        recaudo pasa aguas abajo: el reparto no conoce usuario, convenio ni
        tarifa (ADR 0003).

        El dinero no llega por fila. Ningun reporte de uso trae importes: esta
        bolsa es lo que se cobro, y los reportes solo **ponderan** como se
        reparte entre las obras comunicadas.
      properties:
        id:
          type: string
          description: |
            Identificador de la bolsa. Lo trae quien la registra, porque sale
            del reporte de recaudo de REDES.
          example: bolsa-caracol-2025-01-nacional
        usuario_id:
          type: string
          description: |
            Identificador del pagador. Tiene que estar dado de alta: un
            `usuario_id` que no existe se rechaza con 400, no se crea al vuelo.
          example: caracol
        periodo:
          type: string
          pattern: '^[0-9]{4}(-(0[1-9]|1[0-2]))?$'
          description: |
            Periodo al que corresponde lo cobrado: `AAAA` o `AAAA-MM`, con
            el mes entre `01` y `12`. Es el mismo formato que usan los reportes
            y las corridas de reparto, con el mes acotado: guardar dinero bajo
            `2025-13` produce un periodo que no cuadra con ningun corte del
            reglamento (`R-34`) y que ningun reparto sabe cerrar.
          example: 2025-01
        circuito:
          type: string
          enum: [nacional, internacional]
          description: |
            Circuito del recaudo. No es una etiqueta sobre el mismo dinero:
            `RD 10.3` (`R-35`) los invierte por separado, la reserva del 5%
            aplica solo al nacional (`R-07`) y las fechas de corte no coinciden
            -20 de octubre y 30 de septiembre, `R-34`-.

            Nacional e internacional nunca se mezclan en una bolsa. Del mismo
            usuario y periodo puede haber una de cada uno.
          example: nacional
        bruto:
          description: |
            Importe cobrado en COP, antes de deducciones.

            **La respuesta es siempre una cadena**, y es deliberado: un numero
            JSON es un `double` IEEE-754 en la mayoria de los clientes, y el
            ADR 0005 exige aritmetica decimal exacta sobre dinero de terceros.
            Como cadena, la cifra llega al cliente tal cual se recaudo.

            En la PETICION se aceptan las dos formas -de ahi el `oneOf`-, pero
            **mandar la cadena es lo correcto**: un numero con muchos decimales
            puede perder precision en el cliente antes de salir.

            El maximo es `9999999999999999.99`, que es lo que cabe en la
            columna `NUMERIC(18,2)`, y se admiten hasta dos decimales: un
            tercero se rechaza con 400 en vez de redondearse, porque una cifra
            validada como $100,555 y guardada como $100,56 es medio centavo que
            el reparto distribuye y que nadie recaudo.

            Cero es un valor valido: que un usuario no pagara nada en el
            periodo es un hecho, no un dato que falte.
          oneOf:
            - type: string
              format: decimal
              pattern: '^[0-9]+(\.[0-9]{1,2})?$'
            - type: number
              format: decimal
              minimum: 0
          example: "1000000.00"
        convenio:
          type: string
          description: |
            Convenio que origino el cobro. PROCEDENCIA, no insumo de calculo
            (ADR 0006, pregunta 1: de donde salio este dinero).

            Opcional a proposito: `T-11` dice que la tarifa publicada es el
            valor por defecto CUANDO NO HAY convenio, asi que exigirlo
            afirmaria algo que el reglamento no afirma.
          example: conv-caracol-2025
        tarifa:
          type: string
          description: |
            Version de la tarifa aplicada, como referencia. Intela no la aplica:
            recibe el importe ya cobrado.
          example: RT-VI-2026
        factura:
          type: string
          description: Cuenta de cobro con la que se recaudo este importe.
          example: FE-1024

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: |
            Que fallo, en lenguaje de quien llama. Las respuestas de error van
            con `Content-Type: application/json`, no `text/plain`.

    TipoDeAnomalia:
      type: string
      description: |
        Los seis detectores de OE-5 / #37. Lista cerrada: lo que se guarde con
        otra grafia no lo encuentra ningun filtro, y nada falla de forma
        visible.

        Los cinco primeros son el contrato que el tablero de anomalias ya fijo
        antes de que existiera el backend; el sexto lo anade esta issue.

        - `oni` — la cascada de identificacion corrio y no reconocio la obra
          (ADR 0007). No es un fallo: es una etapa del diseno, y su parte queda
          en reserva hasta que se resuelva o prescriba (`R-19`, `RD 13.8`).
        - `duplicado_archivo` — los mismos bytes en dos entregas. El
          `UNIQUE (sha256, fuente)` de `reportes` solo cierra la repeticion de
          la MISMA fuente; esto caza la que cruza fuentes o periodos.
        - `duplicado_registro` — el mismo registro logico en dos archivos del
          mismo periodo. La repeticion DENTRO de un archivo ya la rechaza el
          adaptador de formato al ingerir.
        - `titular_sin_porcentaje` — un coautor del catalogo sin parte en la
          declaracion vigente, o una parte sin IPI. Nombra a la PERSONA.
        - `reserva_declaracion_incompleta` — `R-04` / `RD 13.1.3`: lo declarado
          no suma 100 y se retiene el TOTAL de esa obra. Nombra la OBRA y el
          dinero. Es un estado valido del modelo, no un error.
        - `tipo_obra_sin_mapear` — la obra no cae en ninguna de las cuatro
          categorias de `RD 9.1.1`, asi que no hay ponderacion que aplicarle.
      enum:
        - oni
        - duplicado_archivo
        - duplicado_registro
        - titular_sin_porcentaje
        - reserva_declaracion_incompleta
        - tipo_obra_sin_mapear

    Alerta:
      type: object
      required:
        [id, tipo, detalle, periodo, referencia, ref_tipo, ref_id, critica, detectada, resuelta]
      description: |
        Una anomalia de un periodo, con el registro exacto que la disparo.

        No hay importes, y por la misma razon que no los tiene un uso: una
        alerta dice que una fila o una obra no esta en condiciones de ponderar,
        nunca cuanto vale.
      properties:
        id:
          type: string
          format: uuid
          description: Identificador de la alerta. Lo genera la base.
        tipo:
          $ref: "#/components/schemas/TipoDeAnomalia"
        detalle:
          type: string
          description: |
            La frase que lee una persona de distribucion, con las cifras
            concretas -que suma da, que otra entrega colisiona, en que fila
            venia el registro repetido-. Quien persigue la alerta tiene que
            poder actuar sin abrir la base.
        periodo:
          type: string
          pattern: '^[0-9]{4}(-(0[1-9]|1[0-2]))?$'
          description: |
            Periodo de la evaluacion que la levanto. Va en la fila y no se
            deduce del registro ofensor: la misma obra puede quedar retenida en
            dos periodos seguidos y cada uno tiene su propia alerta.
          example: 2025-01
        referencia:
          type: string
          description: |
            El registro ofensor en una sola cadena, para pintar:
            `<ref_tipo>:<ref_id>`, y `#<ref_titular>` detras cuando lo hay.
            Es lo que el tablero mete en la celda "Referencia"; para navegar al
            registro usar `ref_tipo` y `ref_id`, que no hay que partir.
          example: obra:obra-12#IPI-00000002
        ref_tipo:
          type: string
          description: |
            A que tabla apunta el registro ofensor. NO es una clave foranea, y
            es deliberado: la referencia apunta a tablas distintas segun el
            detector, y una FK con CASCADE se llevaria la alerta por delante el
            dia que la resolucion de #39 borre el uso ofensor -y con ella el
            rastro de que aquello paso.
          enum: [uso, reporte, obra]
        ref_id:
          type: string
          description: Identificador del registro ofensor dentro de su tabla.
          example: obra-12
        ref_titular:
          type: string
          description: |
            IPI de la persona a la que le falta la parte. Solo lo trae
            `titular_sin_porcentaje`: es la segunda coordenada del registro
            ofensor, porque lo que falta es una fila de `declaraciones` y su
            identidad es (obra, titular). Con la obra sola, dos coautores
            ausentes de la misma obra serian la misma alerta.
          example: IPI-00000002
        critica:
          type: boolean
          description: |
            Si este tipo BLOQUEA la distribucion del periodo. Es DERIVADO del
            tipo, no un dato guardado: persistirlo congelaria la clasificacion
            en el momento de detectar.

            La linea no es "que tan grave suena" sino si dejarlo sin resolver
            hace que las cifras del periodo salgan MAL. Bloquean los dos
            duplicados -una emision contada dos veces infla los puntos de su
            obra y desinfla los de todas las demas del mismo canal, y el valor
            punto de `RD 9.1.1` es un cociente- y `tipo_obra_sin_mapear`. NO
            bloquean `oni` -etapa del diseno- ni las dos de declaracion -estado
            valido del modelo: se retiene esa obra y el periodo sigue-.
        detectada:
          type: string
          format: date-time
          description: |
            Cuando se vio por PRIMERA vez. Una segunda pasada que vuelva a
            detectarla no lo mueve.
        resuelta:
          type: boolean
          description: |
            Si alguien ya se hizo cargo. Una alerta resuelta no se reabre
            aunque la anomalia siga ahi (ADR 0020).
        resuelta_por:
          type: string
          description: Cuenta que la cerro. Sale de la sesion, nunca del cuerpo.
          example: usr-admin
        resuelta_en:
          type: string
          format: date-time
          description: Instante de la resolucion, tomado del reloj del nucleo.
        nota:
          type: string
          description: Lo que quien resolvio quiso dejar escrito. Opcional.

    PedidoDeEvaluacion:
      type: object
      required: [periodo]
      description: |
        El periodo que se va a evaluar. Va en el cuerpo y no en la query porque
        esta operacion ESCRIBE: un POST cuyo unico argumento viaja en la URL se
        copia y se repite desde la barra del navegador con demasiada facilidad.
      properties:
        periodo:
          type: string
          pattern: '^[0-9]{4}(-(0[1-9]|1[0-2]))?$'
          example: 2025-01

    ResolucionDeAlerta:
      type: object
      description: |
        La nota de quien resuelve. Todo lo demas -quien y cuando- lo pone el
        servidor: la firma sale de la sesion y el instante del reloj del
        nucleo.
      properties:
        nota:
          type: string
          example: hablado con la autora, declara esta semana

    ResumenDeEvaluacion:
      type: object
      required: [periodo, detectadas, nuevas, por_tipo, criticas_abiertas, usos_sin_cotejar]
      description: Recuento de una pasada de deteccion.
      properties:
        periodo:
          type: string
          pattern: '^[0-9]{4}(-(0[1-9]|1[0-2]))?$'
          example: 2025-01
        detectadas:
          type: integer
          minimum: 0
          description: |
            Cuantas anomalias tiene el periodo AHORA. No baja porque ya
            estuvieran escritas.
        nuevas:
          type: integer
          minimum: 0
          description: |
            Cuantas de esas no estaban antes de esta pasada. Las dos cifras
            hacen falta: con una sola, correr la evaluacion dos veces daria 0 la
            segunda y se leeria como "el periodo esta limpio".
        por_tipo:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
          description: |
            Lo detectado en esta pasada, por tipo. Trae los SEIS tipos siempre,
            con cero explicito donde no hubo nada: una clave ausente no se
            distingue de un cero al otro lado del JSON, y el tablero pinta una
            tarjeta por tipo.
        criticas_abiertas:
          type: integer
          minimum: 0
          description: |
            Alertas sin resolver del periodo cuyo tipo bloquea la distribucion.
            Es el predicado que consumira la compuerta de #34 -que todavia no
            existe: `/admin/pipeline` es un andamio-. Se expone aqui para que
            la cifra se pueda mirar antes de que esa compuerta la use.
        usos_sin_cotejar:
          type: integer
          minimum: 0
          description: |
            Filas del periodo a las que no se les pudo componer clave de
            registro, asi que el detector de duplicados NO las comparo con
            ninguna otra. No cuenta anomalias: cuenta el tamano del punto
            ciego.
            Viaja porque sin ella "cero duplicados" y "no se miro" se leen
            igual. El caso es real: `Hora` no es obligatoria en el mapa de
            Caracol y a la vez forma parte de su clave de registro.

    ItemRevision:
      type: object
      required: [id, tipo, codigo, motivo, fuente, titulo, reporte_id]
      description: |
        Una fila de la cola de revision. Sirve a la normalizacion (OE-1) y a
        los rechazos del adaptador de formato (#25): `tipo` dice de cual
        detector salio, `codigo` es el motivo tipado (columna propia) y
        `motivo` nombra el campo. No hay importes: una fila en revision no
        pondera.

        `anomalia` sigue en el enum de `tipo` porque la columna
        `usos_rechazados.tipo` lo admite desde la migracion 00010, pero las
        anomalias de OE-5 / #37 **no se sirven por aqui**: van por `/alertas`,
        que si tiene estado de resolucion y roles propios (ADR 0020).
      properties:
        id:
          type: string
          description: Identificador de la fila, el mismo espacio que `usos`.
        tipo:
          type: string
          description: Origen del item.
          enum: [normalizacion, anomalia, adaptador]
        codigo:
          type: string
          description: |
            Motivo tipado (`fecha_inparseable`, `moneda_desconocida`,
            `parametro_ausente`, `rechazo_formato`). Permite filtrar sin
            parsear prosa. Se persiste en columna propia; no se re-deriva
            cortando el texto del motivo.
        motivo:
          type: string
          description: Texto que nombra el campo y explica que falta o esta mal.
        fuente:
          type: string
          description: Fuente del reporte (Caracol, Netflix, ...).
        titulo:
          type: string
          description: Titulo tal como vino. Pista para pedirle al cliente la linea.
        reporte_id:
          type: string
          description: Entrega de la que salio la fila.

security:
  - bearerAuth: []
