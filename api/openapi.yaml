# Contrato HTTP de Intela.
#
# La version anterior cubria 8 de ~18 endpoints, no tenia ni un schema de
# respuesta, y era INVALIDA: /api/asientos/{id}/explicar declaraba {id} en la
# ruta sin declararlo en `parameters`, que el estandar exige.
#
# Este contrato describe lo que el andamiaje expone DE VERDAD: sondas de
# salud. Los endpoints de negocio vuelven con los PRs que los implementan, y
# cada uno trae su schema. Un contrato que promete rutas que devuelven 404 es
# peor que uno corto: se usa para generar clientes.

openapi: 3.0.3

info:
  title: Intela API
  version: "0.1.0"
  description: |
    Reconocimiento de obras y distribucion de ingresos por propiedad
    intelectual para REDES SGC.

    Toda cifra que el sistema produzca debe ser explicable hasta su origen
    (fuente, reporte, regla aplicada). El reglamento lo exige y la auditoria
    lo revisa.
  license:
    name: Propietario
    url: https://redescritores.com

servers:
  - url: http://localhost/api
    description: Desarrollo, detras de nginx
  - url: http://localhost:8080
    description: Desarrollo, API directa

tags:
  - name: salud
    description: Sondas para el orquestador.
  - name: sesion
    description: |
      Autenticacion. La sesion es un token opaco con caducidad, no un JWT: se
      revoca del lado del servidor borrando su fila (ADR 0013).
  - name: afiliacion
    description: |
      Alta de un titular. La solicitud la rellena quien todavia no es afiliado
      y queda pendiente de admision del Consejo Directivo (`RS 5.2`, `RS 5.3`).
      El RUT y la certificacion bancaria son obligatorios (`R-12`). Pertenecer
      a otra SGC del mismo genero sin renuncia expresa bloquea el alta (`R-28`).
  - name: admin
    description: |
      Superficie del pipeline. Solo `administrador` (Consejo Directivo).
      Requiere Bearer y el rol; sin sesion es 401, con otro rol es 403.
  - name: auditoria
    description: |
      Superficie de lectura de la bitacora. `auditor` (Revisor Fiscal) o
      `administrador`. Requiere Bearer y el rol; sin sesion es 401, con
      otro rol es 403.

paths:
  /health:
    get:
      tags: [salud]
      summary: El proceso esta vivo
      description: |
        No consulta la base de datos. Si lo hiciera, una caida de PostgreSQL
        reiniciaria los contenedores en bucle en vez de dejarlos esperando.
      operationId: salud
      security: []
      responses:
        "200":
          description: El proceso responde.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estado"
              example:
                estado: ok

  /ready:
    get:
      tags: [salud]
      summary: El proceso puede atender trafico
      description: Comprueba tambien que las dependencias respondan.
      operationId: listo
      security: []
      responses:
        "200":
          description: Listo para recibir trafico.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estado"
              example:
                estado: listo
        "503":
          description: Alguna dependencia no responde.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: base de datos no disponible

  /auth/session:
    post:
      tags: [sesion]
      summary: Iniciar sesion
      description: |
        Cambia unas credenciales por un token de sesion.

        Es la unica operacion que se llama sin token, de ahi el `security: []`.

        Devuelve el mismo 401 tanto si el correo no esta en el padron como si
        la clave no cuadra, y con el mismo mensaje: distinguirlos convertiria
        el login en una forma de averiguar que correos estan dados de alta.
      operationId: iniciarSesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credenciales"
            example:
              email: ana@redes.co
              clave: la-clave-de-ana
      responses:
        "200":
          description: Sesion abierta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sesion"
              example:
                token: 9qYQ2vJmXk3pR7wLfNbTzA5cHdEgSuVxYnMoPiKjRlQ
                expira: "2026-08-31T00:00:00Z"
                usuario:
                  id: usr-ana
                  email: ana@redes.co
                  nombre: Ana Escritora
                  rol: titular
                  titular_id: tit-ana
        "400":
          description: Falta el correo o la clave, o el cuerpo no es JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: email y clave son obligatorios
        "401":
          description: Credenciales invalidas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: credenciales invalidas

    get:
      tags: [sesion]
      summary: Quien soy
      description: |
        Devuelve el usuario dueno del token presentado.

        Sirve para que un cliente pinte la sesion sin guardar el usuario en el
        navegador, donde no se puede confiar en el.
      operationId: sesionActual
      responses:
        "200":
          description: El usuario de la sesion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
              example:
                id: usr-ana
                email: ana@redes.co
                nombre: Ana Escritora
                rol: titular
                titular_id: tit-ana
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada

    delete:
      tags: [sesion]
      summary: Cerrar sesion
      description: |
        Revoca el token presentado.

        Es idempotente: cerrar una sesion que ya estaba cerrada responde igual.
        Decir "ese token no existia" contaria algo sobre tokens ajenos.
      operationId: cerrarSesion
      responses:
        "204":
          description: Sesion cerrada. Sin cuerpo.
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada

  /afiliaciones:
    post:
      tags: [afiliacion]
      summary: Solicitar afiliacion
      description: |
        Recibe el alta de un titular nuevo y la deja en estado `pendiente`.

        Va sin sesion: quien se da de alta todavia no es afiliado.

        El RUT actualizado y la certificacion bancaria son obligatorios
        (`R-12` / `RD 13.1.6`). El IPI se puede omitir en esta peticion;
        una persona natural no se admite al padron sin el (`RD 3`).

        Si el aspirante declara pertenecer a otra sociedad de gestion
        colectiva del mismo genero y no adjunta la renuncia, responde 409
        con la explicacion de `R-28`.
      operationId: solicitarAfiliacion
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SolicitudAfiliacion"
      responses:
        "201":
          description: Solicitud creada, pendiente de admision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Afiliacion"
              example:
                id: afil-9qYQ2vJmXk3pR7wLfNbTzA5cHdEgSuVxYnMoPiKjRlQ
                nombre: Ana Escritora
                email: ana@redes.co
                documento_identidad: "12345678"
                ipi: IPI-00000001
                subtipo: socio
                estado: pendiente
                elegible_anticipo: false
                tiene_rut: true
                tiene_certificacion_bancaria: true
                tiene_renuncia: false
                titular_id: ""
        "400":
          description: Faltan datos o documentos, o el adjunto no es un PDF o una imagen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "r-12: el rut actualizado y la certificacion bancaria son obligatorios"
        "409":
          description: |
            Conflicto de exclusividad (`R-28`) o ya existe una solicitud
            activa con el mismo correo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "r-28: no se acepta como afiliado a quien pertenezca a otra sociedad de gestion colectiva del mismo genero sin renuncia previa y expresa"

  /afiliaciones/{id}/aprobar:
    post:
      tags: [afiliacion]
      summary: Aprobar afiliacion
      description: |
        Admite una solicitud pendiente y crea la fila del padron.

        Solo el rol `administrador`, que en este andamiaje representa al
        Consejo Directivo (`RS 5.2`). A partir de la admision el subtipo
        gobierna el derecho a pedir anticipo: solo un Socio lo tiene (`R-30`).
      operationId: aprobarAfiliacion
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador de la solicitud, opaco.
          schema:
            type: string
      responses:
        "200":
          description: Solicitud admitida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Afiliacion"
              example:
                id: afil-9qYQ2vJmXk3pR7wLfNbTzA5cHdEgSuVxYnMoPiKjRlQ
                nombre: Ana Escritora
                email: ana@redes.co
                documento_identidad: "12345678"
                ipi: IPI-00000001
                subtipo: socio
                estado: admitido
                elegible_anticipo: true
                tiene_rut: true
                tiene_certificacion_bancaria: true
                tiene_renuncia: false
                titular_id: tit-9qYQ2vJmXk3pR7wLfNbTzA5cHdEgSuVxYnMoPiKjRlQ
        "400":
          description: Falta el IPI para admitir a una persona natural.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: el ipi es obligatorio para admitir a una persona natural
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: El rol de la sesion no es el del Consejo Directivo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado
        "404":
          description: No hay una solicitud con ese identificador.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: solicitud no encontrada
        "409":
          description: La solicitud ya estaba resuelta, o el padron ya tiene esa fila.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: la solicitud no esta pendiente de admision

  /admin/pipeline:
    get:
      tags: [admin]
      summary: Superficie del pipeline
      description: |
        Reserva el prefijo `/admin/*` al rol `administrador` (Consejo
        Directivo). Los casos de uso del pipeline aterrizan en PRs
        posteriores; hoy el grupo existe para que el rol se haga cumplir
        en un solo sitio.

        Sin sesion responde 401 (el middleware de autenticacion). Con
        sesion de otro rol responde 403.
      operationId: adminPipeline
      security:
        - bearerAuth: []
      x-required-roles: [administrador]
      responses:
        "204":
          description: Autorizado. Sin cuerpo; la superficie aun no tiene payload.
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: Autenticado, pero el rol no basta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado

  /auditoria/asientos:
    get:
      tags: [auditoria]
      summary: Superficie de la bitacora
      description: |
        Reserva el prefijo `/auditoria/*` a `auditor` (Revisor Fiscal) o
        `administrador`. Los asientos aterrizan con el PR de bitacora;
        hoy el grupo existe para que el rol se haga cumplir en un solo
        sitio.

        Sin sesion responde 401. Con sesion de otro rol responde 403.
      operationId: auditoriaAsientos
      security:
        - bearerAuth: []
      x-required-roles: [auditor, administrador]
      responses:
        "204":
          description: Autorizado. Sin cuerpo; la superficie aun no tiene payload.
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: Autenticado, pero el rol no basta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Token de sesion. Las sesiones expiran: el token no es una credencial
        permanente.

        La autenticacion no basta: cada grupo de rutas exige un rol del
        reglamento (`x-required-roles` en la operacion). Sin sesion la
        respuesta es 401; con sesion de un rol no permitido, 403. La
        matriz Rol -> capacidad esta en docs/architecture/roles.md.

  schemas:
    Estado:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          description: Estado del proceso.
          enum: [ok, listo]

    Credenciales:
      type: object
      required: [email, clave]
      properties:
        email:
          type: string
          format: email
          description: Correo con el que el usuario esta dado de alta.
        clave:
          type: string
          format: password
          description: |
            La contrasena en claro. Solo viaja en esta peticion y nunca se
            almacena: lo que se guarda es su hash bcrypt.

    Usuario:
      type: object
      required: [id, email, nombre, rol, titular_id]
      properties:
        id:
          type: string
          description: Identificador interno, opaco y estable.
        email:
          type: string
          format: email
          description: Correo del usuario.
        nombre:
          type: string
          description: Nombre para mostrar.
        rol:
          type: string
          description: |
            Rol del reglamento con el que se decide que puede hacer.
          enum: [administrador, distribucion, contabilidad, auditor, titular]
        titular_id:
          type: string
          description: |
            Titular al que representa, si el rol es `titular`. Cadena vacia en
            los demas roles: un administrador no cobra reparto (`R-01`).

    Sesion:
      type: object
      required: [token, expira, usuario]
      properties:
        token:
          type: string
          description: |
            Token de sesion, opaco. Se manda en `Authorization: Bearer`.

            Es el unico momento en que existe en claro: en la base se guarda
            solo su resumen, asi que no se puede recuperar. Si se pierde, hay
            que iniciar sesion de nuevo.
        expira:
          type: string
          format: date-time
          description: |
            Instante en que el token deja de valer, en RFC 3339. A partir de
            el, cualquier peticion con este token responde 401.
        usuario:
          $ref: "#/components/schemas/Usuario"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: |
            Que fallo, en lenguaje de quien llama. Las respuestas de error van
            con `Content-Type: application/json`, no `text/plain`.

    SolicitudAfiliacion:
      type: object
      required:
        - nombre
        - email
        - documento_identidad
        - subtipo
        - rut
        - certificacion_bancaria
      properties:
        nombre:
          type: string
          description: Nombre del aspirante.
        email:
          type: string
          format: email
          description: Correo al que se comunica la decision del Consejo.
        documento_identidad:
          type: string
          description: Cedula o pasaporte (`RS 5.2` / `RS 5.3`).
        ipi:
          type: string
          description: |
            Identificador IPI de la persona. Opcional en el alta; obligatorio
            para admitir a una persona natural.
        subtipo:
          type: string
          enum: [socio, administrado]
          description: |
            `socio` es vinculo societario (`RS 4.1`). `administrado` es
            vinculo contractual (`RS 4.2`). Solo el socio admitido puede
            pedir anticipo (`R-30`).
        pertenece_otra_sgc:
          type: string
          description: |
            `true` si el aspirante pertenece a otra SGC del mismo genero.
            En ese caso `renuncia` es obligatorio (`R-28`).
        rut:
          type: string
          format: binary
          description: RUT actualizado (`R-12`). PDF o imagen.
        certificacion_bancaria:
          type: string
          format: binary
          description: Certificacion bancaria (`R-12`). PDF o imagen.
        renuncia:
          type: string
          format: binary
          description: |
            Documento de renuncia a la otra SGC. Obligatorio si
            `pertenece_otra_sgc` es verdadero.

    Afiliacion:
      type: object
      required:
        - id
        - nombre
        - email
        - documento_identidad
        - ipi
        - subtipo
        - estado
        - elegible_anticipo
        - tiene_rut
        - tiene_certificacion_bancaria
        - tiene_renuncia
        - titular_id
      properties:
        id:
          type: string
          description: Identificador de la solicitud, opaco.
        nombre:
          type: string
        email:
          type: string
          format: email
        documento_identidad:
          type: string
        ipi:
          type: string
          description: Vacio si se omitio en el alta.
        subtipo:
          type: string
          enum: [socio, administrado]
        estado:
          type: string
          enum: [pendiente, admitido, rechazado]
          description: Maquina de admision. El alta deja `pendiente`.
        elegible_anticipo:
          type: boolean
          description: |
            `true` solo si el subtipo es socio y el estado es admitido
            (`R-30`).
        tiene_rut:
          type: boolean
        tiene_certificacion_bancaria:
          type: boolean
        tiene_renuncia:
          type: boolean
        titular_id:
          type: string
          description: |
            Fila del padron, rellenada al admitir. Cadena vacia mientras
            la solicitud esta pendiente.

security:
  - bearerAuth: []
