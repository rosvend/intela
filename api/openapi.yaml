                id: bolsa-caracol-2025-01-nacional
                usuario_id: caracol
                periodo: 2025-01
                circuito: nacional
                bruto: "1000000.00"
                convenio: conv-caracol-2025
                tarifa: RT-VI-2026
                factura: FE-1024
        "401":
