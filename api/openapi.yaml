# Contrato HTTP de Intela.
#
# La version anterior cubria 8 de ~18 endpoints, no tenia ni un schema de
# respuesta, y era INVALIDA: /api/asientos/{id}/explicar declaraba {id} en la
# ruta sin declararlo en `parameters`, que el estandar exige.
#
# Este contrato describe lo que el andamiaje expone DE VERDAD: sondas de
# salud. Los endpoints de negocio vuelven con los PRs que los implementan, y
# cada uno trae su schema. Un contrato que promete rutas que devuelven 404 es
# peor que uno corto: se usa para generar clientes.

openapi: 3.0.3

info:
  title: Intela API
  version: "0.1.0"
  description: |
    Reconocimiento de obras y distribucion de ingresos por propiedad
    intelectual para REDES SGC.

    Toda cifra que el sistema produzca debe ser explicable hasta su origen
    (fuente, reporte, regla aplicada). El reglamento lo exige y la auditoria
    lo revisa.
  license:
    name: Propietario
    url: https://redescritores.com

servers:
  - url: http://localhost/api
    description: Desarrollo, detras de nginx
  - url: http://localhost:8080
    description: Desarrollo, API directa

tags:
  - name: salud
    description: Sondas para el orquestador.
  - name: sesion
    description: |
      Autenticacion. La sesion es un token opaco con caducidad, no un JWT: se
      revoca del lado del servidor borrando su fila (ADR 0013).
  - name: admin
    description: |
      Superficie del pipeline. Solo `administrador` (Consejo Directivo).
      Requiere Bearer y el rol; sin sesion es 401, con otro rol es 403.
  - name: auditoria
    description: |
      Superficie de lectura de la bitacora. `auditor` (Revisor Fiscal) o
      `administrador`. Requiere Bearer y el rol; sin sesion es 401, con
      otro rol es 403.
  - name: liquidaciones
    description: |
      Liquidacion del titular autenticado: panel y export PDF/Excel (OE-6).
      Solo `titular`. El identificador sale de la sesion, no de la URL.

paths:
  /health:
    get:
      tags: [salud]
      summary: El proceso esta vivo
      description: |
        No consulta la base de datos. Si lo hiciera, una caida de PostgreSQL
        reiniciaria los contenedores en bucle en vez de dejarlos esperando.
      operationId: salud
      security: []
      responses:
        "200":
          description: El proceso responde.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estado"
              example:
                estado: ok

  /ready:
    get:
      tags: [salud]
      summary: El proceso puede atender trafico
      description: Comprueba tambien que las dependencias respondan.
      operationId: listo
      security: []
      responses:
        "200":
          description: Listo para recibir trafico.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estado"
              example:
                estado: listo
        "503":
          description: Alguna dependencia no responde.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: base de datos no disponible

  /auth/session:
    post:
      tags: [sesion]
      summary: Iniciar sesion
      description: |
        Cambia unas credenciales por un token de sesion.

        Es la unica operacion que se llama sin token, de ahi el `security: []`.

        Devuelve el mismo 401 tanto si el correo no esta en el padron como si
        la clave no cuadra, y con el mismo mensaje: distinguirlos convertiria
        el login en una forma de averiguar que correos estan dados de alta.
      operationId: iniciarSesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credenciales"
            example:
              email: ana@redes.co
              clave: la-clave-de-ana
      responses:
        "200":
          description: Sesion abierta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sesion"
              example:
                token: 9qYQ2vJmXk3pR7wLfNbTzA5cHdEgSuVxYnMoPiKjRlQ
                expira: "2026-08-31T00:00:00Z"
                usuario:
                  id: usr-ana
                  email: ana@redes.co
                  nombre: Ana Escritora
                  rol: titular
                  titular_id: tit-ana
        "400":
          description: Falta el correo o la clave, o el cuerpo no es JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: email y clave son obligatorios
        "401":
          description: Credenciales invalidas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: credenciales invalidas

    get:
      tags: [sesion]
      summary: Quien soy
      description: |
        Devuelve el usuario dueno del token presentado.

        Sirve para que un cliente pinte la sesion sin guardar el usuario en el
        navegador, donde no se puede confiar en el.
      operationId: sesionActual
      responses:
        "200":
          description: El usuario de la sesion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
              example:
                id: usr-ana
                email: ana@redes.co
                nombre: Ana Escritora
                rol: titular
                titular_id: tit-ana
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada

    delete:
      tags: [sesion]
      summary: Cerrar sesion
      description: |
        Revoca el token presentado.

        Es idempotente: cerrar una sesion que ya estaba cerrada responde igual.
        Decir "ese token no existia" contaria algo sobre tokens ajenos.
      operationId: cerrarSesion
      responses:
        "204":
          description: Sesion cerrada. Sin cuerpo.
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada

  /admin/pipeline:
    get:
      tags: [admin]
      summary: Superficie del pipeline
      description: |
        Reserva el prefijo `/admin/*` al rol `administrador` (Consejo
        Directivo). Los casos de uso del pipeline aterrizan en PRs
        posteriores; hoy el grupo existe para que el rol se haga cumplir
        en un solo sitio.

        Sin sesion responde 401 (el middleware de autenticacion). Con
        sesion de otro rol responde 403.
      operationId: adminPipeline
      security:
        - bearerAuth: []
      x-required-roles: [administrador]
      responses:
        "204":
          description: Autorizado. Sin cuerpo; la superficie aun no tiene payload.
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: Autenticado, pero el rol no basta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado

  /auditoria/asientos:
    get:
      tags: [auditoria]
      summary: Superficie de la bitacora
      description: |
        Reserva el prefijo `/auditoria/*` a `auditor` (Revisor Fiscal) o
        `administrador`. Los asientos aterrizan con el PR de bitacora;
        hoy el grupo existe para que el rol se haga cumplir en un solo
        sitio.

        Sin sesion responde 401. Con sesion de otro rol responde 403.
      operationId: auditoriaAsientos
      security:
        - bearerAuth: []
      x-required-roles: [auditor, administrador]
      responses:
        "204":
          description: Autorizado. Sin cuerpo; la superficie aun no tiene payload.
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: Autenticado, pero el rol no basta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado

  /mis-liquidaciones:
    get:
      tags: [liquidaciones]
      summary: Panel de liquidacion del titular
      description: |
        Devuelve bruto, cada deduccion (admin, bienestar social, reserva) y
        neto por obra del titular autenticado. El filtro `periodo` es el
        mismo que usa el export: panel y archivo no pueden divergir.

        El titular sale de la sesion, no de un parametro. Sin sesion es 401.
        Con otro rol es 403.
      operationId: consultarLiquidaciones
      security:
        - bearerAuth: []
      x-required-roles: [titular]
      parameters:
        - $ref: "#/components/parameters/Periodo"
      responses:
        "200":
          description: Liquidacion del titular.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liquidacion"
              example:
                titular_id: tit-ana
                periodo: "2026-01"
                lineas:
                  - periodo: "2026-01"
                    obra_id: obra-completa
                    titulo: La Casa de las Dos Palmas
                    bruto: "6000.00"
                    admin: "1200.00"
                    social: "600.00"
                    reserva: "300.00"
                    neto: "3900.00"
                totales:
                  bruto: "6000.00"
                  admin: "1200.00"
                  social: "600.00"
                  reserva: "300.00"
                  neto: "3900.00"
        "400":
          description: El periodo no es YYYY ni YYYY-MM.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: periodo tiene que ser YYYY o YYYY-MM
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: Autenticado, pero el rol no es titular.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado

  /mis-liquidaciones/export:
    get:
      tags: [liquidaciones]
      summary: Exportar la liquidacion a PDF o Excel
      description: |
        Renderiza la misma liquidacion que `GET /mis-liquidaciones` como
        archivo. Las cifras van embebidas: el fichero se puede abrir sin
        conexion al panel (OE-6).

        `formato=pdf` usa maroto; `formato=xlsx` usa excelize. Cualquier
        otro valor es 400. El filtro `periodo` es el mismo del panel.
      operationId: exportarLiquidaciones
      security:
        - bearerAuth: []
      x-required-roles: [titular]
      parameters:
        - $ref: "#/components/parameters/Periodo"
        - name: formato
          in: query
          required: true
          description: pdf o xlsx.
          schema:
            type: string
            enum: [pdf, xlsx]
          example: pdf
      responses:
        "200":
          description: Archivo con la liquidacion embebida.
          headers:
            Content-Disposition:
              description: Nombre del fichero, p. ej. liquidacion-2026-01.pdf
              schema:
                type: string
                example: attachment; filename="liquidacion-2026-01.pdf"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          description: Formato o periodo invalidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: formato tiene que ser pdf o xlsx
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: Autenticado, pero el rol no es titular.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Token de sesion. Las sesiones expiran: el token no es una credencial
        permanente.

        La autenticacion no basta: cada grupo de rutas exige un rol del
        reglamento (`x-required-roles` en la operacion). Sin sesion la
        respuesta es 401; con sesion de un rol no permitido, 403. La
        matriz Rol -> capacidad esta en docs/architecture/roles.md.

  parameters:
    Periodo:
      name: periodo
      in: query
      required: false
      description: |
        Periodo de recaudo, `YYYY` o `YYYY-MM`. Vacio significa todos.
      schema:
        type: string
        pattern: '^[0-9]{4}(-[0-9]{2})?$'
      example: "2026-01"

  schemas:
    Estado:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          description: Estado del proceso.
          enum: [ok, listo]

    Credenciales:
      type: object
      required: [email, clave]
      properties:
        email:
          type: string
          format: email
          description: Correo con el que el usuario esta dado de alta.
        clave:
          type: string
          format: password
          description: |
            La contrasena en claro. Solo viaja en esta peticion y nunca se
            almacena: lo que se guarda es su hash bcrypt.

    Usuario:
      type: object
      required: [id, email, nombre, rol, titular_id]
      properties:
        id:
          type: string
          description: Identificador interno, opaco y estable.
        email:
          type: string
          format: email
          description: Correo del usuario.
        nombre:
          type: string
          description: Nombre para mostrar.
        rol:
          type: string
          description: |
            Rol del reglamento con el que se decide que puede hacer.
          enum: [administrador, distribucion, contabilidad, auditor, titular]
        titular_id:
          type: string
          description: |
            Titular al que representa, si el rol es `titular`. Cadena vacia en
            los demas roles: un administrador no cobra reparto (`R-01`).

    Sesion:
      type: object
      required: [token, expira, usuario]
      properties:
        token:
          type: string
          description: |
            Token de sesion, opaco. Se manda en `Authorization: Bearer`.

            Es el unico momento en que existe en claro: en la base se guarda
            solo su resumen, asi que no se puede recuperar. Si se pierde, hay
            que iniciar sesion de nuevo.
        expira:
          type: string
          format: date-time
          description: |
            Instante en que el token deja de valer, en RFC 3339. A partir de
            el, cualquier peticion con este token responde 401.
        usuario:
          $ref: "#/components/schemas/Usuario"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: |
            Que fallo, en lenguaje de quien llama. Las respuestas de error van
            con `Content-Type: application/json`, no `text/plain`.

    Monto:
      type: string
      description: |
        Importe en COP con dos decimales, sin separador de miles. Es una
        cadena para no perder centavos en JSON number.
      pattern: '^-?[0-9]+\.[0-9]{2}$'
      example: "3900.00"

    TotalesLiquidacion:
      type: object
      required: [bruto, admin, social, reserva, neto]
      properties:
        bruto:
          $ref: "#/components/schemas/Monto"
        admin:
          $ref: "#/components/schemas/Monto"
        social:
          $ref: "#/components/schemas/Monto"
        reserva:
          $ref: "#/components/schemas/Monto"
        neto:
          $ref: "#/components/schemas/Monto"

    LineaLiquidacion:
      type: object
      required: [periodo, obra_id, titulo, bruto, admin, social, reserva, neto]
      properties:
        periodo:
          type: string
          example: "2026-01"
        obra_id:
          type: string
          example: obra-completa
        titulo:
          type: string
          example: La Casa de las Dos Palmas
        bruto:
          $ref: "#/components/schemas/Monto"
        admin:
          $ref: "#/components/schemas/Monto"
        social:
          $ref: "#/components/schemas/Monto"
        reserva:
          $ref: "#/components/schemas/Monto"
        neto:
          $ref: "#/components/schemas/Monto"

    Liquidacion:
      type: object
      required: [titular_id, periodo, lineas, totales]
      properties:
        titular_id:
          type: string
          description: Titular de la sesion, no un parametro de la URL.
          example: tit-ana
        periodo:
          type: string
          description: Filtro aplicado. Cadena vacia si no se filtro.
          example: "2026-01"
        lineas:
          type: array
          items:
            $ref: "#/components/schemas/LineaLiquidacion"
        totales:
          $ref: "#/components/schemas/TotalesLiquidacion"

security:
  - bearerAuth: []
