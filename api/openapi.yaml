# Contrato HTTP de Intela.
#
# La version anterior cubria 8 de ~18 endpoints, no tenia ni un schema de
# respuesta, y era INVALIDA: /api/asientos/{id}/explicar declaraba {id} en la
# ruta sin declararlo en `parameters`, que el estandar exige.
#
# Este contrato describe lo que el andamiaje expone DE VERDAD: sondas de
# salud, sesion, y el listado publico de ONI (R-18). Los demas endpoints de
# negocio vuelven con los PRs que los implementan, y cada uno trae su schema.

openapi: 3.0.3

info:
  title: Intela API
  version: "0.1.0"
  description: |
    Reconocimiento de obras y distribucion de ingresos por propiedad
    intelectual para REDES SGC.

    Toda cifra que el sistema produzca debe ser explicable hasta su origen
    (fuente, reporte, regla aplicada). El reglamento lo exige y la auditoria
    lo revisa.
  license:
    name: Propietario
    url: https://redescritores.com

servers:
  - url: http://localhost/api
    description: Desarrollo, detras de nginx
  - url: http://localhost:8080
    description: Desarrollo, API directa

tags:
  - name: salud
    description: Sondas para el orquestador.
  - name: sesion
    description: |
      Autenticacion. La sesion es un token opaco con caducidad, no un JWT: se
      revoca del lado del servidor borrando su fila (ADR 0013).
  - name: publico
    description: |
      Rutas sin autenticacion. El listado ONI se publica en la web (R-18,
      RD 13.8.1): titulos e informacion identificatoria, nunca montos.
  - name: oni
    description: |
      Publicacion del listado ONI. La lectura es publica (`/publico/oni`);
      congelar un periodo exige sesion de administrador o distribucion.
  - name: admin
    description: |
      Superficie del pipeline. Solo `administrador` (Consejo Directivo).
      Requiere Bearer y el rol; sin sesion es 401, con otro rol es 403.
  - name: auditoria
    description: |
      Superficie de lectura de la bitacora. `auditor` (Revisor Fiscal) o
      `administrador`. Requiere Bearer y el rol; sin sesion es 401, con
      otro rol es 403.

paths:
  /health:
    get:
      tags: [salud]
      summary: El proceso esta vivo
      description: |
        No consulta la base de datos. Si lo hiciera, una caida de PostgreSQL
        reiniciaria los contenedores en bucle en vez de dejarlos esperando.
      operationId: salud
      security: []
      responses:
        "200":
          description: El proceso responde.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estado"
              example:
                estado: ok

  /ready:
    get:
      tags: [salud]
      summary: El proceso puede atender trafico
      description: Comprueba tambien que las dependencias respondan.
      operationId: listo
      security: []
      responses:
        "200":
          description: Listo para recibir trafico.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estado"
              example:
                estado: listo
        "503":
          description: Alguna dependencia no responde.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: base de datos no disponible

  /auth/session:
    post:
      tags: [sesion]
      summary: Iniciar sesion
      description: |
        Cambia unas credenciales por un token de sesion.

        Es la unica operacion que se llama sin token, de ahi el `security: []`.

        Devuelve el mismo 401 tanto si el correo no esta en el padron como si
        la clave no cuadra, y con el mismo mensaje: distinguirlos convertiria
        el login en una forma de averiguar que correos estan dados de alta.
      operationId: iniciarSesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credenciales"
            example:
              email: ana@redes.co
              clave: la-clave-de-ana
      responses:
        "200":
          description: Sesion abierta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sesion"
              example:
                token: 9qYQ2vJmXk3pR7wLfNbTzA5cHdEgSuVxYnMoPiKjRlQ
                expira: "2026-08-31T00:00:00Z"
                usuario:
                  id: usr-ana
                  email: ana@redes.co
                  nombre: Ana Escritora
                  rol: titular
                  titular_id: tit-ana
        "400":
          description: Falta el correo o la clave, o el cuerpo no es JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: email y clave son obligatorios
        "401":
          description: Credenciales invalidas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: credenciales invalidas

    get:
      tags: [sesion]
      summary: Quien soy
      description: |
        Devuelve el usuario dueno del token presentado.

        Sirve para que un cliente pinte la sesion sin guardar el usuario en el
        navegador, donde no se puede confiar en el.
      operationId: sesionActual
      responses:
        "200":
          description: El usuario de la sesion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
              example:
                id: usr-ana
                email: ana@redes.co
                nombre: Ana Escritora
                rol: titular
                titular_id: tit-ana
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada

    delete:
      tags: [sesion]
      summary: Cerrar sesion
      description: |
        Revoca el token presentado.

        Es idempotente: cerrar una sesion que ya estaba cerrada responde igual.
        Decir "ese token no existia" contaria algo sobre tokens ajenos.
      operationId: cerrarSesion
      responses:
        "204":
          description: Sesion cerrada. Sin cuerpo.
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada

  /publico/oni:
    get:
      tags: [publico]
      summary: Listado publico de ONI
      description: |
        Publica el listado de obras no identificadas (R-18, RD 13.8.1 a
        13.8.4): titulos e informacion identificatoria, **sin montos**, con
        la fecha del proceso, el periodo y las direcciones fisica y
        electronica a las que se allega documentacion.

        Esta publicacion arranca el reloj de prescripcion de tres anos
        (R-19, RD 13.8.7). Por eso la ruta no pide autenticacion: `security: []`.

        Sin `periodo` devuelve la publicacion mas reciente. Con `periodo`
        (YYYY o YYYY-MM) filtra a esa instantanea.
      operationId: listadoONIPublico
      security: []
      parameters:
        - name: periodo
          in: query
          required: false
          schema:
            type: string
            pattern: '^[0-9]{4}(-[0-9]{2})?$'
          description: Periodo de la publicacion. Vacio = la mas reciente.
          example: "2026-01"
      responses:
        "200":
          description: Listado publicado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListadoONI"
              example:
                periodo: "2026-01"
                fecha_proceso: "2026-08-31T12:00:00Z"
                direccion_fisica: "Calle 74 #7-35, Bogota D.C."
                direccion_electronica: oni@redescritores.com
                explicacion: >
                  REDES SGC publica este listado de obras no identificadas
                  (ONI) para que los titulares documenten su autoria.
                obras:
                  - id: uso-1
                    titulo: Serie Desconocida
                    fuente: caracol
                    ids_fuente: ID-99
                    modalidad: tv
        "400":
          description: El periodo no tiene la forma YYYY o YYYY-MM.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: periodo invalido
        "404":
          description: No hay listado publicado (o no hay uno de ese periodo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no hay listado ONI publicado

  /oni/publicaciones:
    post:
      tags: [oni]
      summary: Publicar el listado ONI de un periodo
      description: |
        Congela la cola viva de ONI del periodo como listado publico, registra
        la fecha del proceso (ancla de R-19), las dos direcciones, y deja un
        asiento en la bitacora.

        Solo `administrador` y `distribucion`. Republicar el mismo periodo
        responde 409: reescribir la fecha resetearia el reloj de prescripcion.
      operationId: publicarListadoONI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicarONI"
            example:
              periodo: "2026-01"
      responses:
        "201":
          description: Listado publicado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListadoONI"
        "400":
          description: Falta el periodo o no tiene la forma YYYY o YYYY-MM.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: periodo invalido
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: El rol no basta para publicar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado
        "409":
          description: Ese periodo ya tiene listado publicado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: el listado ONI de ese periodo ya fue publicado

  /admin/pipeline:
    get:
      tags: [admin]
      summary: Superficie del pipeline
      description: |
        Reserva el prefijo `/admin/*` al rol `administrador` (Consejo
        Directivo). Los casos de uso del pipeline aterrizan en PRs
        posteriores; hoy el grupo existe para que el rol se haga cumplir
        en un solo sitio.

        Sin sesion responde 401 (el middleware de autenticacion). Con
        sesion de otro rol responde 403.
      operationId: adminPipeline
      security:
        - bearerAuth: []
      x-required-roles: [administrador]
      responses:
        "204":
          description: Autorizado. Sin cuerpo; la superficie aun no tiene payload.
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: Autenticado, pero el rol no basta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado

  /auditoria/asientos:
    get:
      tags: [auditoria]
      summary: Superficie de la bitacora
      description: |
        Reserva el prefijo `/auditoria/*` a `auditor` (Revisor Fiscal) o
        `administrador`. Los asientos aterrizan con el PR de bitacora;
        hoy el grupo existe para que el rol se haga cumplir en un solo
        sitio.

        Sin sesion responde 401. Con sesion de otro rol responde 403.
      operationId: auditoriaAsientos
      security:
        - bearerAuth: []
      x-required-roles: [auditor, administrador]
      responses:
        "204":
          description: Autorizado. Sin cuerpo; la superficie aun no tiene payload.
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: Autenticado, pero el rol no basta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Token de sesion. Las sesiones expiran: el token no es una credencial
        permanente.

        La autenticacion no basta: cada grupo de rutas exige un rol del
        reglamento (`x-required-roles` en la operacion). Sin sesion la
        respuesta es 401; con sesion de un rol no permitido, 403. La
        matriz Rol -> capacidad esta en docs/architecture/roles.md.

  schemas:
    Estado:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          description: Estado del proceso.
          enum: [ok, listo]

    Credenciales:
      type: object
      required: [email, clave]
      properties:
        email:
          type: string
          format: email
          description: Correo con el que el usuario esta dado de alta.
        clave:
          type: string
          format: password
          description: |
            La contrasena en claro. Solo viaja en esta peticion y nunca se
            almacena: lo que se guarda es su hash bcrypt.

    Usuario:
      type: object
      required: [id, email, nombre, rol, titular_id]
      properties:
        id:
          type: string
          description: Identificador interno, opaco y estable.
        email:
          type: string
          format: email
          description: Correo del usuario.
        nombre:
          type: string
          description: Nombre para mostrar.
        rol:
          type: string
          description: |
            Rol del reglamento con el que se decide que puede hacer.
          enum: [administrador, distribucion, contabilidad, auditor, titular]
        titular_id:
          type: string
          description: |
            Titular al que representa, si el rol es `titular`. Cadena vacia en
            los demas roles: un administrador no cobra reparto (`R-01`).

    Sesion:
      type: object
      required: [token, expira, usuario]
      properties:
        token:
          type: string
          description: |
            Token de sesion, opaco. Se manda en `Authorization: Bearer`.

            Es el unico momento en que existe en claro: en la base se guarda
            solo su resumen, asi que no se puede recuperar. Si se pierde, hay
            que iniciar sesion de nuevo.
        expira:
          type: string
          format: date-time
          description: |
            Instante en que el token deja de valer, en RFC 3339. A partir de
            el, cualquier peticion con este token responde 401.
        usuario:
          $ref: "#/components/schemas/Usuario"

    PublicarONI:
      type: object
      required: [periodo]
      properties:
        periodo:
          type: string
          pattern: '^[0-9]{4}(-[0-9]{2})?$'
          description: Periodo que se publica, YYYY o YYYY-MM.

    ObraONIPublica:
      type: object
      additionalProperties: false
      required: [id, titulo, fuente, ids_fuente, modalidad]
      description: |
        Proyeccion publica de un uso en ONI. Titulo e informacion
        identificatoria. No hay, y no va a haber, campo de dinero (R-18,
        RD 13.8.2).
      properties:
        id:
          type: string
          description: Identificador del uso, opaco.
        titulo:
          type: string
          description: Titulo tal como vino en el reporte.
        fuente:
          type: string
          description: Fuente del reporte (canal, OTT, exhibidor).
        ids_fuente:
          type: string
          description: Identificadores que trajo la fuente, si los hay.
        modalidad:
          type: string
          enum: [tv, cine, ott, hotel]
          description: Modalidad de comunicacion publica (RD 8).

    ListadoONI:
      type: object
      additionalProperties: false
      required:
        - periodo
        - fecha_proceso
        - direccion_fisica
        - direccion_electronica
        - explicacion
        - obras
      description: |
        Instantanea publicada del listado ONI. La fecha_proceso es el ancla
        de los tres anos de R-19.
      properties:
        periodo:
          type: string
          pattern: '^[0-9]{4}(-[0-9]{2})?$'
        fecha_proceso:
          type: string
          format: date-time
          description: Fecha de la publicacion, RFC 3339. No se reescribe.
        direccion_fisica:
          type: string
          description: Direccion fisica a la que se allega documentacion (RD 13.8.4.3).
        direccion_electronica:
          type: string
          description: Direccion electronica a la que se allega documentacion (RD 13.8.4.3).
        explicacion:
          type: string
          description: |
            Explicacion del proceso de Distribucion en el que se incluyen
            los derechos de las ONI (RD 13.8.4.4).
        obras:
          type: array
          items:
            $ref: "#/components/schemas/ObraONIPublica"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: |
            Que fallo, en lenguaje de quien llama. Las respuestas de error van
            con `Content-Type: application/json`, no `text/plain`.

security:
  - bearerAuth: []
