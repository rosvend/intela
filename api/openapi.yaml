# Contrato HTTP de Intela.
#
# La version anterior cubria 8 de ~18 endpoints, no tenia ni un schema de
# respuesta, y era INVALIDA: /api/asientos/{id}/explicar declaraba {id} en la
# ruta sin declararlo en `parameters`, que el estandar exige.
#
# Este contrato describe lo que el andamiaje expone DE VERDAD: sondas de
# salud. Los endpoints de negocio vuelven con los PRs que los implementan, y
# cada uno trae su schema. Un contrato que promete rutas que devuelven 404 es
# peor que uno corto: se usa para generar clientes.

openapi: 3.0.3

info:
  title: Intela API
  version: "0.1.0"
  description: |
    Reconocimiento de obras y distribucion de ingresos por propiedad
    intelectual para REDES SGC.

    Toda cifra que el sistema produzca debe ser explicable hasta su origen
    (fuente, reporte, regla aplicada). El reglamento lo exige y la auditoria
    lo revisa.
  license:
    name: Propietario
    url: https://redescritores.com

servers:
  - url: http://localhost/api
    description: Desarrollo, detras de nginx
  - url: http://localhost:8080
    description: Desarrollo, API directa

tags:
  - name: salud
    description: Sondas para el orquestador.
  - name: sesion
    description: |
      Autenticacion. La sesion es un token opaco con caducidad, no un JWT: se
      revoca del lado del servidor borrando su fila (ADR 0013).
  - name: admin
    description: |
      Superficie del pipeline. Solo `administrador` (Consejo Directivo).
      Requiere Bearer y el rol; sin sesion es 401, con otro rol es 403.
  - name: auditoria
    description: |
      Superficie de lectura de la bitacora. `auditor` (Revisor Fiscal) o
      `administrador`. Requiere Bearer y el rol; sin sesion es 401, con
      otro rol es 403.
  - name: titular
    description: |
      Panel de consulta del titular (OE-6). Solo `titular`. El recorte es
      el `titular_id` de la sesion: no hay parametro para pedir los de
      otro. Cada monto es neto; el bruto vive en `/explicar/{ref}`.

paths:
  /health:
    get:
      tags: [salud]
      summary: El proceso esta vivo
      description: |
        No consulta la base de datos. Si lo hiciera, una caida de PostgreSQL
        reiniciaria los contenedores en bucle en vez de dejarlos esperando.
      operationId: salud
      security: []
      responses:
        "200":
          description: El proceso responde.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estado"
              example:
                estado: ok

  /ready:
    get:
      tags: [salud]
      summary: El proceso puede atender trafico
      description: Comprueba tambien que las dependencias respondan.
      operationId: listo
      security: []
      responses:
        "200":
          description: Listo para recibir trafico.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estado"
              example:
                estado: listo
        "503":
          description: Alguna dependencia no responde.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: base de datos no disponible

  /auth/session:
    post:
      tags: [sesion]
      summary: Iniciar sesion
      description: |
        Cambia unas credenciales por un token de sesion.

        Es la unica operacion que se llama sin token, de ahi el `security: []`.

        Devuelve el mismo 401 tanto si el correo no esta en el padron como si
        la clave no cuadra, y con el mismo mensaje: distinguirlos convertiria
        el login en una forma de averiguar que correos estan dados de alta.
      operationId: iniciarSesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credenciales"
            example:
              email: ana@redes.co
              clave: la-clave-de-ana
      responses:
        "200":
          description: Sesion abierta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sesion"
              example:
                token: 9qYQ2vJmXk3pR7wLfNbTzA5cHdEgSuVxYnMoPiKjRlQ
                expira: "2026-08-31T00:00:00Z"
                usuario:
                  id: usr-ana
                  email: ana@redes.co
                  nombre: Ana Escritora
                  rol: titular
                  titular_id: tit-ana
        "400":
          description: Falta el correo o la clave, o el cuerpo no es JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: email y clave son obligatorios
        "401":
          description: Credenciales invalidas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: credenciales invalidas

    get:
      tags: [sesion]
      summary: Quien soy
      description: |
        Devuelve el usuario dueno del token presentado.

        Sirve para que un cliente pinte la sesion sin guardar el usuario en el
        navegador, donde no se puede confiar en el.
      operationId: sesionActual
      responses:
        "200":
          description: El usuario de la sesion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
              example:
                id: usr-ana
                email: ana@redes.co
                nombre: Ana Escritora
                rol: titular
                titular_id: tit-ana
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada

    delete:
      tags: [sesion]
      summary: Cerrar sesion
      description: |
        Revoca el token presentado.

        Es idempotente: cerrar una sesion que ya estaba cerrada responde igual.
        Decir "ese token no existia" contaria algo sobre tokens ajenos.
      operationId: cerrarSesion
      responses:
        "204":
          description: Sesion cerrada. Sin cuerpo.
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada

  /admin/pipeline:
    get:
      tags: [admin]
      summary: Superficie del pipeline
      description: |
        Reserva el prefijo `/admin/*` al rol `administrador` (Consejo
        Directivo). Los casos de uso del pipeline aterrizan en PRs
        posteriores; hoy el grupo existe para que el rol se haga cumplir
        en un solo sitio.

        Sin sesion responde 401 (el middleware de autenticacion). Con
        sesion de otro rol responde 403.
      operationId: adminPipeline
      security:
        - bearerAuth: []
      x-required-roles: [administrador]
      responses:
        "204":
          description: Autorizado. Sin cuerpo; la superficie aun no tiene payload.
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: Autenticado, pero el rol no basta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado

  /auditoria/asientos:
    get:
      tags: [auditoria]
      summary: Superficie de la bitacora
      description: |
        Reserva el prefijo `/auditoria/*` a `auditor` (Revisor Fiscal) o
        `administrador`. Los asientos aterrizan con el PR de bitacora;
        hoy el grupo existe para que el rol se haga cumplir en un solo
        sitio.

        Sin sesion responde 401. Con sesion de otro rol responde 403.
      operationId: auditoriaAsientos
      security:
        - bearerAuth: []
      x-required-roles: [auditor, administrador]
      responses:
        "204":
          description: Autorizado. Sin cuerpo; la superficie aun no tiene payload.
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: Autenticado, pero el rol no basta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado

  /mis-ingresos:
    get:
      tags: [titular]
      summary: Ingresos netos del titular de la sesion
      description: |
        Lista las cifras netas del titular autenticado, recortadas a las
        obras donde tiene participacion registrada (OE-6).

        El titular se toma de la sesion. Un `titular_id` en la query no
        cambia a quien se consulta.

        El unico monto de cada fila es `neto`. El bruto, las deducciones
        y el linaje (fuente, reporte, regla, split) estan en
        `/explicar/{ref}`.
      operationId: misIngresos
      security:
        - bearerAuth: []
      x-required-roles: [titular]
      parameters:
        - name: obra
          in: query
          required: false
          description: Identificador de obra. Vacio, todas las del titular.
          schema:
            type: string
          example: obra-completa
        - name: fuente
          in: query
          required: false
          description: Fuente del reporte que pondero la bolsa (caracol, netflix, ...).
          schema:
            type: string
          example: caracol
        - name: periodo
          in: query
          required: false
          description: Periodo de la corrida, `YYYY` o `YYYY-MM`.
          schema:
            type: string
            pattern: '^[0-9]{4}(-[0-9]{2})?$'
          example: "2026-01"
      responses:
        "200":
          description: Lista de ingresos netos. Vacia si no hay cifras con esos filtros.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaIngresos"
              example:
                ingresos:
                  - ref: proc-2026-01:obra-completa:tit-ana
                    obra_id: obra-completa
                    obra: La Casa de las Dos Palmas
                    fuente: caracol
                    periodo: "2026-01"
                    neto: "3600.00"
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: Autenticado, pero el rol no es titular.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado

  /explicar/{ref}:
    get:
      tags: [titular]
      summary: Linaje de una cifra
      description: |
        Devuelve el linaje que produce `ExplicarCifra` (ADR 0006): corrida,
        reporte de origen, obra con escalon y puntaje del match, snapshot
        normativo, split de la declaracion, y el paso de bruto a neto con
        cada deduccion.

        Es la unica fuente de la explicacion. El frontend no recomputa el
        linaje a partir de datos crudos.

        Un titular solo ve cifras suyas: la de otro titular responde 403,
        no 404. `auditor` y `administrador` ven cualquiera.
      operationId: explicarCifra
      security:
        - bearerAuth: []
      x-required-roles: [titular, auditor, administrador]
      parameters:
        - name: ref
          in: path
          required: true
          description: |
            Identificador de la linea: `proceso_id:obra_id:titular_id`.
            Tres segmentos separados por `:` porque la ruta toma `{ref}`
            como un solo tramo.
          schema:
            type: string
          example: proc-2026-01:obra-completa:tit-ana
      responses:
        "200":
          description: Linaje completo de la cifra.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Explicacion"
              example:
                ref: proc-2026-01:obra-completa:tit-ana
                neto: "3600.00"
                bruto: "4800.00"
                corrida:
                  proceso_id: proc-2026-01
                  periodo: "2026-01"
                  circuito: nacional
                reporte:
                  id: rpt-caracol-2026-01
                  fuente: caracol
                  sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                obra:
                  id: obra-completa
                  titulo: La Casa de las Dos Palmas
                  escalon: alias
                  puntaje: "1.00000"
                regla:
                  snapshot_id: snap-2026-01
                  reglamento: RD-IX
                split:
                  titular_id: tit-ana
                  ipi: IPI-00000001
                  porcentaje: "60.0000"
                  version: 1
                deducciones:
                  - concepto: gastos administrativos
                    porcentaje: "10.00"
                    monto: "480.00"
                  - concepto: bienestar social
                    porcentaje: "5.00"
                    monto: "240.00"
                  - concepto: reserva
                    porcentaje: "10.00"
                    monto: "480.00"
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: |
            Autenticado, pero el rol no basta, o el titular pide una cifra
            que no es suya.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado
        "404":
          description: No hay una linea con esa ref.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no encontrado

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Token de sesion. Las sesiones expiran: el token no es una credencial
        permanente.

        La autenticacion no basta: cada grupo de rutas exige un rol del
        reglamento (`x-required-roles` en la operacion). Sin sesion la
        respuesta es 401; con sesion de un rol no permitido, 403. La
        matriz Rol -> capacidad esta en docs/architecture/roles.md.

  schemas:
    Estado:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          description: Estado del proceso.
          enum: [ok, listo]

    Credenciales:
      type: object
      required: [email, clave]
      properties:
        email:
          type: string
          format: email
          description: Correo con el que el usuario esta dado de alta.
        clave:
          type: string
          format: password
          description: |
            La contrasena en claro. Solo viaja en esta peticion y nunca se
            almacena: lo que se guarda es su hash bcrypt.

    Usuario:
      type: object
      required: [id, email, nombre, rol, titular_id]
      properties:
        id:
          type: string
          description: Identificador interno, opaco y estable.
        email:
          type: string
          format: email
          description: Correo del usuario.
        nombre:
          type: string
          description: Nombre para mostrar.
        rol:
          type: string
          description: |
            Rol del reglamento con el que se decide que puede hacer.
          enum: [administrador, distribucion, contabilidad, auditor, titular]
        titular_id:
          type: string
          description: |
            Titular al que representa, si el rol es `titular`. Cadena vacia en
            los demas roles: un administrador no cobra reparto (`R-01`).

    Sesion:
      type: object
      required: [token, expira, usuario]
      properties:
        token:
          type: string
          description: |
            Token de sesion, opaco. Se manda en `Authorization: Bearer`.

            Es el unico momento en que existe en claro: en la base se guarda
            solo su resumen, asi que no se puede recuperar. Si se pierde, hay
            que iniciar sesion de nuevo.
        expira:
          type: string
          format: date-time
          description: |
            Instante en que el token deja de valer, en RFC 3339. A partir de
            el, cualquier peticion con este token responde 401.
        usuario:
          $ref: "#/components/schemas/Usuario"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: |
            Que fallo, en lenguaje de quien llama. Las respuestas de error van
            con `Content-Type: application/json`, no `text/plain`.

    ListaIngresos:
      type: object
      required: [ingresos]
      properties:
        ingresos:
          type: array
          description: |
            Cifras netas del titular de la sesion. El bruto no forma parte
            de este objeto (OE-6).
          items:
            $ref: "#/components/schemas/Ingreso"

    Ingreso:
      type: object
      required: [ref, obra_id, obra, fuente, periodo, neto]
      properties:
        ref:
          type: string
          description: |
            Identificador de la linea, para `GET /explicar/{ref}`.
          example: proc-2026-01:obra-completa:tit-ana
        obra_id:
          type: string
          description: Identificador interno de la obra.
        obra:
          type: string
          description: Titulo para mostrar.
        fuente:
          type: string
          description: |
            Fuentes de los reportes que ponderaron esta cifra en el periodo,
            separadas por coma si hay mas de una. El detalle del archivo
            crudo esta en la explicacion.
        periodo:
          type: string
          description: Periodo de la corrida.
          example: "2026-01"
        neto:
          type: string
          description: Monto neto despues de deducciones. Nunca el bruto.
          example: "3600.00"

    Explicacion:
      type: object
      required: [ref, neto, bruto, corrida, reporte, obra, regla, split, deducciones]
      properties:
        ref:
          type: string
          description: La misma ref que se pidio.
        neto:
          type: string
          description: Monto neto de la linea. Coincide con el del panel.
          example: "3600.00"
        bruto:
          type: string
          description: |
            Bruto proporcional del titular. Solo aparece aqui, nunca como
            cifra de cabecera del panel (OE-6).
          example: "4800.00"
        corrida:
          $ref: "#/components/schemas/CorridaLinaje"
        reporte:
          $ref: "#/components/schemas/ReporteLinaje"
        obra:
          $ref: "#/components/schemas/ObraLinaje"
        regla:
          $ref: "#/components/schemas/ReglaLinaje"
        split:
          $ref: "#/components/schemas/SplitLinaje"
        deducciones:
          type: array
          description: Recortes legales del bruto al neto, en orden.
          items:
            $ref: "#/components/schemas/Deduccion"

    CorridaLinaje:
      type: object
      required: [proceso_id, periodo, circuito]
      properties:
        proceso_id:
          type: string
        periodo:
          type: string
        circuito:
          type: string
          enum: [nacional, internacional]

    ReporteLinaje:
      type: object
      required: [id, fuente, sha256]
      properties:
        id:
          type: string
        fuente:
          type: string
        sha256:
          type: string
          description: Huella del archivo crudo en el almacen de objetos.

    ObraLinaje:
      type: object
      required: [id, titulo, escalon, puntaje]
      properties:
        id:
          type: string
        titulo:
          type: string
        escalon:
          type: string
          description: Escalon de la cascada de identificacion.
          enum: [pendiente, alias, id_global, difuso, manual, oni, ""]
        puntaje:
          type: string
          description: Puntaje del match, de 0 a 1. Cero si no hubo match difuso.

    ReglaLinaje:
      type: object
      required: [snapshot_id, reglamento]
      properties:
        snapshot_id:
          type: string
          description: Snapshot normativo congelado al abrir el proceso.
        reglamento:
          type: string
          description: Version del reglamento de esa corrida.

    SplitLinaje:
      type: object
      required: [titular_id, ipi, porcentaje, version]
      properties:
        titular_id:
          type: string
        ipi:
          type: string
        porcentaje:
          type: string
          description: Porcentaje de la declaracion de obra, cuatro decimales.
        version:
          type: integer
          minimum: 1
          description: Version de la declaracion usada en la corrida.

    Deduccion:
      type: object
      required: [concepto, porcentaje, monto]
      properties:
        concepto:
          type: string
        porcentaje:
          type: string
          description: Porcentaje sobre el bruto de la bolsa.
        monto:
          type: string
          description: Importe proporcional descontado al titular.
          example: "480.00"

security:
  - bearerAuth: []
