# Contrato HTTP de Intela.
#
# La version anterior cubria 8 de ~18 endpoints, no tenia ni un schema de
# respuesta, y era INVALIDA: /api/asientos/{id}/explicar declaraba {id} en la
# ruta sin declararlo en `parameters`, que el estandar exige.
#
# Este contrato describe lo que el andamiaje expone DE VERDAD: sondas de
# salud. Los endpoints de negocio vuelven con los PRs que los implementan, y
# cada uno trae su schema. Un contrato que promete rutas que devuelven 404 es
# peor que uno corto: se usa para generar clientes.

openapi: 3.0.3

info:
  title: Intela API
  version: "0.1.0"
  description: |
    Reconocimiento de obras y distribucion de ingresos por propiedad
    intelectual para REDES SGC.

    Toda cifra que el sistema produzca debe ser explicable hasta su origen
    (fuente, reporte, regla aplicada). El reglamento lo exige y la auditoria
    lo revisa.
  license:
    name: Propietario
    url: https://redescritores.com

servers:
  - url: http://localhost/api
    description: Desarrollo, detras de nginx
  - url: http://localhost:8080
    description: Desarrollo, API directa

tags:
  - name: salud
    description: Sondas para el orquestador.
  - name: sesion
    description: |
      Autenticacion. La sesion es un token opaco con caducidad, no un JWT: se
      revoca del lado del servidor borrando su fila (ADR 0013).
  - name: liquidaciones
    description: |
      Ordenes de pago. Bruto, cada deduccion y neto viajan por separado
      (RD 13.2). El admin ve todas; el titular, solo las suyas.
  - name: admin
    description: |
      Superficie del pipeline. Solo `administrador` (Consejo Directivo).
      Requiere Bearer y el rol; sin sesion es 401, con otro rol es 403.
  - name: auditoria
    description: |
      Superficie de lectura de la bitacora. `auditor` (Revisor Fiscal) o
      `administrador`. Requiere Bearer y el rol; sin sesion es 401, con
      otro rol es 403.

paths:
  /health:
    get:
      tags: [salud]
      summary: El proceso esta vivo
      description: |
        No consulta la base de datos. Si lo hiciera, una caida de PostgreSQL
        reiniciaria los contenedores en bucle en vez de dejarlos esperando.
      operationId: salud
      security: []
      responses:
        "200":
          description: El proceso responde.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estado"
              example:
                estado: ok

  /ready:
    get:
      tags: [salud]
      summary: El proceso puede atender trafico
      description: Comprueba tambien que las dependencias respondan.
      operationId: listo
      security: []
      responses:
        "200":
          description: Listo para recibir trafico.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estado"
              example:
                estado: listo
        "503":
          description: Alguna dependencia no responde.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: base de datos no disponible

  /auth/session:
    post:
      tags: [sesion]
      summary: Iniciar sesion
      description: |
        Cambia unas credenciales por un token de sesion.

        Es la unica operacion que se llama sin token, de ahi el `security: []`.

        Devuelve el mismo 401 tanto si el correo no esta en el padron como si
        la clave no cuadra, y con el mismo mensaje: distinguirlos convertiria
        el login en una forma de averiguar que correos estan dados de alta.
      operationId: iniciarSesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credenciales"
            example:
              email: ana@redes.co
              clave: la-clave-de-ana
      responses:
        "200":
          description: Sesion abierta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sesion"
              example:
                token: 9qYQ2vJmXk3pR7wLfNbTzA5cHdEgSuVxYnMoPiKjRlQ
                expira: "2026-08-31T00:00:00Z"
                usuario:
                  id: usr-ana
                  email: ana@redes.co
                  nombre: Ana Escritora
                  rol: titular
                  titular_id: tit-ana
        "400":
          description: Falta el correo o la clave, o el cuerpo no es JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: email y clave son obligatorios
        "401":
          description: Credenciales invalidas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: credenciales invalidas

    get:
      tags: [sesion]
      summary: Quien soy
      description: |
        Devuelve el usuario dueno del token presentado.

        Sirve para que un cliente pinte la sesion sin guardar el usuario en el
        navegador, donde no se puede confiar en el.
      operationId: sesionActual
      responses:
        "200":
          description: El usuario de la sesion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
              example:
                id: usr-ana
                email: ana@redes.co
                nombre: Ana Escritora
                rol: titular
                titular_id: tit-ana
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada

    delete:
      tags: [sesion]
      summary: Cerrar sesion
      description: |
        Revoca el token presentado.

        Es idempotente: cerrar una sesion que ya estaba cerrada responde igual.
        Decir "ese token no existia" contaria algo sobre tokens ajenos.
      operationId: cerrarSesion
      responses:
        "204":
          description: Sesion cerrada. Sin cuerpo.
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada

  /liquidaciones:
    get:
      tags: [liquidaciones]
      summary: Listar liquidaciones (admin)
      description: |
        Devuelve las ordenes de pago de todos los titulares.

        Cada orden muestra bruto, cada deduccion y neto por separado
        (`RD 13.2`). `pagable` es falso si faltan RUT o certificacion
        bancaria (`R-12`), aunque la liquidacion ya se haya aceptado por
        silencio (`R-10`).

        Reservada a administrador, distribucion, contabilidad y auditor.
        Un titular usa `/mis-liquidaciones`.
      operationId: listarLiquidaciones
      responses:
        "200":
          description: Listado de ordenes de pago.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListadoLiquidaciones"
              example:
                liquidaciones:
                  - id: liq-prc-nac-2026-tit-ana
                    proceso_id: prc-nac-2026
                    titular_id: tit-ana
                    periodo: "2026"
                    bruto: "1000.00"
                    deducciones:
                      - concepto: gastos_administrativos
                        monto: "200.00"
                      - concepto: bienestar_social
                        monto: "100.00"
                      - concepto: reserva_errores_tecnicos
                        monto: "50.00"
                    neto: "650.00"
                    estado: aceptada_por_silencio
                    pagable: true
                    enviada: "2026-01-01"
  /admin/pipeline:
    get:
      tags: [admin]
      summary: Superficie del pipeline
      description: |
        Reserva el prefijo `/admin/*` al rol `administrador` (Consejo
        Directivo). Los casos de uso del pipeline aterrizan en PRs
        posteriores; hoy el grupo existe para que el rol se haga cumplir
        en un solo sitio.

        Sin sesion responde 401 (el middleware de autenticacion). Con
        sesion de otro rol responde 403.
      operationId: adminPipeline
      security:
        - bearerAuth: []
      x-required-roles: [administrador]
      responses:
        "204":
          description: Autorizado. Sin cuerpo; la superficie aun no tiene payload.
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: El rol de la sesion no alcanza para ver el listado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado

  /mis-liquidaciones:
    get:
      tags: [liquidaciones]
      summary: Liquidaciones del titular autenticado
      description: |
        Devuelve las ordenes de pago del titular de la sesion.

        El identificador no viaja en la URL: sale del token, para que un
        titular no consulte las de otro. Mismo desglose bruto / deducciones
        / neto que el listado de administracion (`RD 13.2`).
      operationId: misLiquidaciones
      responses:
        "200":
          description: Las ordenes del titular.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListadoLiquidaciones"
              example:
                liquidaciones:
                  - id: liq-prc-nac-2026-tit-ana
                    proceso_id: prc-nac-2026
                    titular_id: tit-ana
                    periodo: "2026"
                    bruto: "1000.00"
                    deducciones:
                      - concepto: gastos_administrativos
                        monto: "200.00"
                    neto: "800.00"
                    estado: enviada
                    pagable: false
                    enviada: "2026-01-01"
  /auditoria/asientos:
    get:
      tags: [auditoria]
      summary: Superficie de la bitacora
      description: |
        Reserva el prefijo `/auditoria/*` a `auditor` (Revisor Fiscal) o
        `administrador`. Los asientos aterrizan con el PR de bitacora;
        hoy el grupo existe para que el rol se haga cumplir en un solo
        sitio.

        Sin sesion responde 401. Con sesion de otro rol responde 403.
      operationId: auditoriaAsientos
      security:
        - bearerAuth: []
      x-required-roles: [auditor, administrador]
      responses:
        "204":
          description: Autorizado. Sin cuerpo; la superficie aun no tiene payload.
        "401":
          description: Falta el token, o esta caducado o revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: sesion invalida o expirada
        "403":
          description: La sesion no es de un titular.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no autorizado

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Token de sesion. Las sesiones expiran: el token no es una credencial
        permanente.

        La autenticacion no basta: cada grupo de rutas exige un rol del
        reglamento (`x-required-roles` en la operacion). Sin sesion la
        respuesta es 401; con sesion de un rol no permitido, 403. La
        matriz Rol -> capacidad esta en docs/architecture/roles.md.

  schemas:
    Estado:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          description: Estado del proceso.
          enum: [ok, listo]

    Credenciales:
      type: object
      required: [email, clave]
      properties:
        email:
          type: string
          format: email
          description: Correo con el que el usuario esta dado de alta.
        clave:
          type: string
          format: password
          description: |
            La contrasena en claro. Solo viaja en esta peticion y nunca se
            almacena: lo que se guarda es su hash bcrypt.

    Usuario:
      type: object
      required: [id, email, nombre, rol, titular_id]
      properties:
        id:
          type: string
          description: Identificador interno, opaco y estable.
        email:
          type: string
          format: email
          description: Correo del usuario.
        nombre:
          type: string
          description: Nombre para mostrar.
        rol:
          type: string
          description: |
            Rol del reglamento con el que se decide que puede hacer.
          enum: [administrador, distribucion, contabilidad, auditor, titular]
        titular_id:
          type: string
          description: |
            Titular al que representa, si el rol es `titular`. Cadena vacia en
            los demas roles: un administrador no cobra reparto (`R-01`).

    Sesion:
      type: object
      required: [token, expira, usuario]
      properties:
        token:
          type: string
          description: |
            Token de sesion, opaco. Se manda en `Authorization: Bearer`.

            Es el unico momento en que existe en claro: en la base se guarda
            solo su resumen, asi que no se puede recuperar. Si se pierde, hay
            que iniciar sesion de nuevo.
        expira:
          type: string
          format: date-time
          description: |
            Instante en que el token deja de valer, en RFC 3339. A partir de
            el, cualquier peticion con este token responde 401.
        usuario:
          $ref: "#/components/schemas/Usuario"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: |
            Que fallo, en lenguaje de quien llama. Las respuestas de error van
            con `Content-Type: application/json`, no `text/plain`.

    Deduccion:
      type: object
      required: [concepto, monto]
      properties:
        concepto:
          type: string
          description: |
            Que se desconto. Los de la corrida son `gastos_administrativos`,
            `bienestar_social` y `reserva_errores_tecnicos`. Un anticipo
            entra con su propio concepto.
        monto:
          type: string
          description: |
            Importe descontado, decimal exacto con dos decimales. String y
            no number: un JSON number es IEEE-754 y no puede representar
            dinero.

    OrdenDePago:
      type: object
      required:
        - id
        - proceso_id
        - titular_id
        - periodo
        - bruto
        - deducciones
        - neto
        - estado
        - pagable
        - enviada
      properties:
        id:
          type: string
          description: Identificador opaco de la orden.
        proceso_id:
          type: string
          description: Proceso de reparto del que salio la orden.
        titular_id:
          type: string
          description: Titular que cobra.
        periodo:
          type: string
          description: Periodo de la corrida, `YYYY` o `YYYY-MM`.
        bruto:
          type: string
          description: Monto bruto, decimal exacto con dos decimales.
        deducciones:
          type: array
          description: |
            Desglose. No se colapsa en el neto: `RD 13.2` exige ver cada
            renglon.
          items:
            $ref: "#/components/schemas/Deduccion"
        neto:
          type: string
          description: Bruto menos la suma de las deducciones.
        estado:
          type: string
          description: |
            Maquina de R-10 y R-11. `enviada` espera respuesta;
            `aceptada_por_silencio` a los 15 dias calendario si el neto
            supera el 2% SMMLV; `diferida` si no lo supera.
          enum:
            - enviada
            - aceptada
            - aceptada_por_silencio
            - diferida
            - acumulada
            - objetada
        pagable:
          type: boolean
          description: |
            Aceptada (por respuesta o por silencio) y con RUT mas
            certificacion bancaria en expediente (`R-12`). Falso no es
            un error: se liquido, todavia no se puede girar.
        enviada:
          type: string
          format: date
          description: Dia civil del envio, sobre el que corre el plazo de 15 dias.

    ListadoLiquidaciones:
      type: object
      required: [liquidaciones]
      properties:
        liquidaciones:
          type: array
          items:
            $ref: "#/components/schemas/OrdenDePago"

security:
  - bearerAuth: []
