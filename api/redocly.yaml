# Configuracion de redocly lint.
#
# Las reglas que se apagan van con su motivo. Una regla apagada sin explicar
# es una regla que alguien volvera a encender sin saber por que estaba apagada.

extends:
  - recommended

rules:
  # Se queda apagada, y ya no por falta de entorno publicado: desde el ADR 0014
  # el contrato declara el de produccion. Es que la regla marca TAMBIEN los
  # servidores `localhost`, y esos son legitimos y permanentes aqui: levantar el
  # sistema entero con `docker compose` es un entregable del proyecto
  # (`docs/context.md`), asi que el contrato tiene que seguir describiendolo.
  no-server-example.com: off

  # /health y /ready no reciben entrada, no llevan autenticacion y no tienen
  # parametros: no hay 4XX que documentar. El unico fallo posible de /ready es
  # 503, que si esta declarado.
  operation-4xx-response: off

  # Lo que si se exige, y con severidad de error:
  operation-operationId: error
  operation-summary: error
  operation-description: error
  no-invalid-media-type-examples: error
  # Una respuesta sin schema no sirve para generar un cliente, que es el
  # proposito del contrato segun el ADR 0010.
  operation-4xx-problem-details-rfc7807: off
  no-unresolved-refs: error
