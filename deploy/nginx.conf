# Proxy de entrada. Reparte entre el tablero (estatico) y la API.

upstream api    { server api:8080; }
upstream tablero { server web:80; }

server {
  listen 80;
  server_name _;

  # Las parrillas reales son ficheros de decenas de MB. El valor por defecto
  # de nginx es 1 MB, asi que una carga real se rechazaba con 413 antes de
  # llegar a la API.
  client_max_body_size 64m;
  client_body_timeout  120s;

  # La API es quien escribe la bitacora, y el ADR 0006 pide poder responder
  # quien hizo que. Sin estas cuatro cabeceras la API ve TODAS las peticiones
  # como si vinieran del contenedor de nginx: la IP de cliente no se puede
  # auditar porque nunca llega.
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  proxy_http_version 1.1;
  proxy_connect_timeout 5s;
  proxy_send_timeout    120s;
  proxy_read_timeout    120s;

  # No anunciar la version de nginx.
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml;
  gzip_min_length 1024;

  location /api/ {
    proxy_pass http://api;
  }

  # Sondas del orquestador. Fuera de /api/ para que no dependan del prefijo.
  location = /health { proxy_pass http://api/health; access_log off; }
  location = /ready  { proxy_pass http://api/ready;  access_log off; }

  location / {
    proxy_pass http://tablero;
  }
}
