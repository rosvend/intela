# Reusable stage: the Go test suite.
#
# Inert until `go.mod` exists, like every other Go stage. Kept separate from
# `lint-go.yml` on purpose: when the check goes red, its name has to say whether
# behavior broke or style did.
#
# Two flags that are not decoration here:
#
#   -race    the scheduler and the worker (ADR 0003) are concurrent. A data race
#            in a money path does not crash, it produces a different number.
#   -count=1 disables the test result cache, so a green run means the tests
#            actually executed against this commit.
#
# ADR 0005 demands a reparto run be reproducible bit for bit years later. Unit
# tests are the floor, not the ceiling: the engine also needs golden-file cases
# built from the worked examples in the regulations themselves.

name: Test Go

on:
  workflow_call:
    inputs:
      coverage-artifact:
        description: Upload the coverage profile as a build artifact.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      # `go test ./...` exits 0 when a module contains no test files at all, so
      # the first Go commit would otherwise report a green TEST stage having
      # executed nothing. The stage still passes - refusing to merge code for
      # not yet having tests is how a test stage gets deleted - but it says so
      # out loud, in the check annotation and in the summary.
      - name: Check a suite exists
        id: suite
        run: |
          set -euo pipefail
          if find . -path ./.git -prune -o -name '*_test.go' -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Go tests::the module has no *_test.go files. TODO: ADR 0005 requires a reparto run to be reproducible bit for bit, which needs golden-file cases built from the worked examples in the regulations. See docs/ci.md."
          fi

      - name: go test
        run: |
          set -euo pipefail
          go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      # Total coverage goes into the job summary rather than a required
      # threshold: a percentage gate rewards tests written to move the number.
      - name: Coverage summary
        if: always() && hashFiles('coverage.out') != ''
        env:
          SUITE: ${{ steps.suite.outputs.present }}
        run: |
          set -euo pipefail
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          {
            echo "### Test coverage"
            echo
            echo "Total: **${total}**"
            if [ "$SUITE" != "true" ]; then
              echo
              echo "> **No test suites yet.** The stage ran and passed against zero"
              echo "> tests. TODO: golden-file cases from the worked examples in the"
              echo "> regulations (ADR 0005)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage profile
        if: inputs.coverage-artifact && hashFiles('coverage.out') != ''
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
