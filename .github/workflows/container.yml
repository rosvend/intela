# Reusable stage: build a container image, and optionally publish it.
#
# Inert until a `Dockerfile` exists: ci.yml invokes it only when `detect` finds
# one. The commit that brings the Dockerfile activates it by itself.
#
# Parameterised so ci.yml can call it once per image: the Go backend at
# `./Dockerfile` (distroless static, ADR 0010) and the React frontend at
# `web/Dockerfile` (nginx). Separate calls rather than a matrix so each image
# reports its own check name - when one goes red, you know which.
#
# ONE stage covers verification and publication, because they must build the
# image the same way:
#
#   push: false   on pull requests. Verifies the image builds, publishes
#                 nothing, needs no credentials. `load: true` leaves the image
#                 in the local daemon so a boot smoke test can be chained here
#                 later.
#   push: true    on merges to main. The same build, published.
#
# A separate "publish" workflow would let the two drift apart, and would build
# every image twice on main. The first you would hear of the drift is an image
# that passed CI and fails to build in the release path.
#
# TAGS are computed here rather than by docker/metadata-action, so that the
# reference this workflow returns as an output is exactly the reference it
# pushed - no second guess at another action's naming scheme:
#
#   :sha-<full sha>   immutable. This is what `deploy.yml` rolls out.
#   :<branch>         moving convenience pointer.

name: Container

on:
  workflow_call:
    inputs:
      image-name:
        description: Image name, without registry or owner.
        type: string
        default: "intela"
      context:
        description: Build context.
        type: string
        default: "."
      dockerfile:
        description: Path to the Dockerfile.
        type: string
        default: "Dockerfile"
      target:
        description: Target stage of the multi-stage build. Empty = last stage.
        type: string
        default: ""
      push:
        description: Publish the image. False verifies the build and discards it.
        type: boolean
        default: false
      registry:
        description: Registry to publish to. GHCR needs no secret of its own.
        type: string
        default: "ghcr.io"
    outputs:
      image:
        description: Immutable reference to the published image. Empty when push was false.
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read

jobs:
  build:
    name: docker build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Consumed only when `push` is true. GHCR authenticates with the job's own
      # GITHUB_TOKEN, so publishing needs no long-lived registry secret.
      packages: write
    outputs:
      image: ${{ steps.tags.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Registries reject uppercase path segments and a GitHub owner may contain
      # capitals, so the owner is lowercased rather than trusted.
      - name: Compute tags
        id: tags
        env:
          REGISTRY: ${{ inputs.registry }}
          NAME: ${{ inputs.image-name }}
          PUSH: ${{ inputs.push }}
        run: |
          set -euo pipefail
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')

          if [ "$PUSH" = "true" ]; then
            repo="${REGISTRY}/${owner}/${NAME}"
            immutable="${repo}:sha-${GITHUB_SHA}"
            branch=$(printf '%s' "${GITHUB_REF_NAME}" | tr '/' '-')
            {
              echo "image=${immutable}"
              echo "tags<<TAGS_EOF"
              echo "${immutable}"
              echo "${repo}:${branch}"
              echo "TAGS_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            # Never published, so the name only has to be readable in the log.
            {
              echo "image="
              echo "tags=${NAME}:ci-${GITHUB_SHA}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to ${{ inputs.registry }}
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # `push` and `load` are mutually exclusive: buildx cannot hand the image
      # to the local daemon and to a registry in the same call.
      - uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report
        env:
          PUSHED: ${{ inputs.push }}
          TAGS: ${{ steps.tags.outputs.tags }}
          NAME: ${{ inputs.image-name }}
        run: |
          set -euo pipefail
          {
            echo "### Image \`${NAME}\`"
            echo
            if [ "$PUSHED" = "true" ]; then
              echo "Published:"
              echo
              printf '%s\n' "$TAGS" | awk 'NF { printf "- `%s`\n", $0 }'
            else
              echo "Built and discarded - pull requests never publish."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
