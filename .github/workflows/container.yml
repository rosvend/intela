# Reusable stage: verify the image builds. Publishes nothing.
#
# Inert until a `Dockerfile` exists: ci.yml invokes it only when `detect` finds
# one. The commit that brings the Dockerfile activates it by itself.
#
# Parameterised so ci.yml can call it once per image: the Go backend at
# `./Dockerfile` (distroless static, ADR 0010) and the React frontend at
# `web/Dockerfile` (nginx). Separate calls rather than a matrix so each image
# reports its own check name - when one goes red, you know which.

name: Container

on:
  workflow_call:
    inputs:
      image-name:
        description: Name used to tag the built image, for readable logs.
        type: string
        default: "intela"
      context:
        description: Build context.
        type: string
        default: "."
      dockerfile:
        description: Path to the Dockerfile.
        type: string
        default: "Dockerfile"
      target:
        description: Target stage of the multi-stage build. Empty = last stage.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # `push: false` is the whole point of this stage: it verifies the image
      # builds, it does not publish. `load: true` leaves the image in the local
      # daemon, which is what will let a boot smoke test be chained here later.
      # The GitHub Actions cache avoids rebuilding layers between runs.
      - uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          push: false
          load: true
          tags: ${{ inputs.image-name }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
