# Reusable stage: deployment.
#
# This was a scaffold until ADR 0014 chose a provider. The four TODO(provider)
# injection points it documented are now filled in, and the structure they were
# embedded in -- ordering, the environment gate, the concurrency policy -- is
# unchanged, because that structure was the decision.
#
# WHAT IT DEPLOYS
#
#   API        A Go binary on AWS Lambda (cmd/lambda), behind a Function URL.
#   Dashboard  web/dist on Amplify Hosting, which also reverse-proxies /api/*
#              to that Function URL so the two share an origin.
#   Schema     goose, from a Lambda inside the VPC (cmd/lambda-migrate).
#
# The GHCR images that container.yml publishes are NOT what ships here. They
# stay because docs/context.md requires `docker compose up` to keep working as a
# project deliverable, and because they are how the images get verified. The
# serverless rollout packages the same source as a zip instead.
#
# ORDER, AND WHY MIGRATIONS ARE NOT THEIR OWN STEP
#
# docs/cd.md requires: authenticate, migrate, roll out, verify. Migration and
# API rollout are both inside `terraform apply`, and the order between them is
# enforced by the dependency graph -- envs/nheo/main.tf gives module.api a
# depends_on module.migrations. Splitting them into two shell steps would make
# the ordering a property of this file, which nobody reads during an incident,
# instead of a property of the graph, which fails loudly.
#
# If goose fails, the apply fails and the API keeps the OLD CODE. ADR 0008 is
# why that matters: a reparto run in flight must never meet a schema its code
# does not know.
#
# Be precise about the schema, though, because the reassuring version is wrong:
# `goose up` wraps EACH migration in its own transaction, not the batch. A
# failure partway down the list leaves the ones before it committed. So the
# actual state after a failed deploy is "partially new schema, old code", not
# "old schema, old code".
#
# That is still the safe direction -- old code against a schema that only grew
# is exactly the backward-compatibility ADR 0008 already demands of every
# migration -- but it is the reason that demand is not optional. A migration
# that renames or drops breaks the running version the moment it commits, and
# no rollback of this pipeline puts it back.
#
# AUTHENTICATION
#
# OIDC, so there is no stored credential. The caller grants `id-token: write`
# and passes AWS_DEPLOY_ROLE_ARN, whose trust policy admits only
# `repo:<owner>/<repo>:ref:refs/heads/main` -- a pull request carries a
# different subject and cannot assume it, whatever a workflow file in that pull
# request claims.
#
# THE APPROVAL GATE
#
# `environment: production` still does the work. Adding required reviewers to
# that environment in repository settings turns this into a manual approval
# without touching this file.

name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment. Drives the approval gate and secret scope.
        type: string
        default: "production"
      backend-image:
        description: Backend image published by container.yml. Recorded, not deployed.
        type: string
        default: ""
      frontend-image:
        description: Frontend image published by container.yml. Recorded, not deployed.
        type: string
        default: ""
      terraform-environment:
        description: Directory under infra/envs to apply.
        type: string
        default: "nheo"
      confirm_destroy:
        description: Set to "yes" to allow an apply that destroys resources.
        type: string
        default: ""
    # NOT `required: true`, and the reason is subtle enough to be worth writing
    # down, because getting it wrong took `main` red.
    #
    # This secret does NOT actually arrive from the caller. It is a secret of
    # the `production` environment, and `on.workflow_call` has no `environment`
    # keyword -- a caller job cannot declare one, so it can never read it to
    # pass it on. What resolves it is the job below, which DOES declare
    # `environment:`: a reusable workflow uses its own environment's secret in
    # preference to anything the caller hands over.
    #
    # `required: true` then means "the caller must pass a secret the caller
    # cannot see". GitHub validates that contract when the workflow is CALLED,
    # before a single job starts, so a missing value fails with
    #
    #   Secret AWS_DEPLOY_ROLE_ARN is required, but not provided while calling.
    #
    # and the "Is AWS wired up yet" step below -- written precisely to explain
    # this situation in words a human can act on -- never runs. Optional here
    # lets the job start and fail where the diagnosis lives.
    secrets:
      AWS_DEPLOY_ROLE_ARN:
        description: >-
          Role assumed through OIDC, scoped to pushes on the deploy branch.
          Normally read from the `production` environment by the job itself;
          declared here only so a caller MAY override it.
        required: false
      BUDGET_NOTIFICATION_EMAILS:
        description: >-
          Comma-separated addresses for the cost alarm. A repository secret,
          reaching this workflow through the caller's `secrets: inherit`.
          Declared here because a reusable workflow must declare every secret
          it names -- actionlint fails the build otherwise, which is how this
          was caught.
        required: false

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.16.1"
  AWS_REGION: "us-east-1"

jobs:
  deploy:
    name: Release to ${{ inputs.environment }}
    runs-on: ubuntu-latest

    # The gate. Required reviewers configured here become a manual approval.
    environment: ${{ inputs.environment }}

    permissions:
      contents: read
      id-token: write

    # A deployment is never cancelled by the one behind it. This is the opposite
    # of the CI policy on purpose: cancelling a build wastes a runner,
    # cancelling a rollout leaves the environment half-migrated.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - name: Release plan
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          BACKEND: ${{ inputs.backend-image }}
          FRONTEND: ${{ inputs.frontend-image }}
        run: |
          set -euo pipefail
          {
            echo "### Release plan"
            echo
            echo "| What | Value |"
            echo "| ---- | ----- |"
            echo "| Environment | \`${ENVIRONMENT}\` |"
            echo "| Terraform | \`infra/envs/${{ inputs.terraform-environment }}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Backend image | \`${BACKEND:-not built}\` (published, not deployed) |"
            echo "| Frontend image | \`${FRONTEND:-not built}\` (published, not deployed) |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Checked before authenticating, because configure-aws-credentials fails
      # with an OIDC error that says nothing about the actual cause.
      #
      # This FAILS rather than standing down, unlike the plan stage. A plan that
      # cannot run is an inconvenience; a deploy that quietly does nothing and
      # reports green is the thing docs/ci.md warns about -- a check that is
      # read as proof.
      - name: Is AWS wired up yet
        env:
          ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          BUCKET: ${{ vars.TF_STATE_BUCKET }}
          EMAILS: ${{ secrets.BUDGET_NOTIFICATION_EMAILS }}
        run: |
          set -euo pipefail
          falta=""
          [ -n "${ROLE}" ]   || falta="${falta} AWS_DEPLOY_ROLE_ARN(secret)"
          [ -n "${BUCKET}" ] || falta="${falta} TF_STATE_BUCKET(variable)"
          [ -n "${EMAILS}" ] || falta="${falta} BUDGET_NOTIFICATION_EMAILS(secret)"
          if [ -n "${falta}" ]; then
            echo "::error::cannot deploy, missing:${falta}. Run infra/bootstrap once and load what it prints. See infra/README.md."
            exit 1
          fi
          echo "AWS is wired up."

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "22.22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # BOTH BUILDS RUN BEFORE AUTHENTICATING, and that ordering is the point.
      #
      # `npm ci` executes install scripts from the entire dependency tree. Run
      # after the OIDC step, a compromised `postinstall` anywhere in that tree
      # finds deploy credentials already exported in the environment, and this
      # role can write to the account. Built first, the blast radius is the
      # artifact -- bad, but recoverable, and not the AWS account.
      #
      # Neither build needs AWS, so the order costs nothing. Keep it.
      - name: Build the Lambda artifacts
        run: make lambda

      - name: Build the dashboard
        working-directory: web
        run: |
          npm ci
          npm run build

      # 1. AUTHENTICATE
      - name: Authenticate against AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: intela-deploy-${{ github.run_id }}

      - name: Terraform init
        working-directory: infra/envs/${{ inputs.terraform-environment }}
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${STATE_BUCKET}" ]; then
            echo "::error::repository variable TF_STATE_BUCKET is not set. infra/bootstrap prints it."
            exit 1
          fi
          terraform init -input=false -no-color \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=envs/${{ inputs.terraform-environment }}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"

      # budget_notification_emails has no default and `*.tfvars` is gitignored,
      # so without this the plan dies on "No value for required variable"
      # before it reaches AWS. It arrives as a SECRET rather than a `vars.`
      # entry because this repository is public and the plan is echoed into a
      # pull request comment: a repository variable would publish the address.
      #
      # The secret is comma-separated, which is what a human types; Terraform
      # wants a list, which is what jq makes. Empty yields [] and trips the
      # module's own validation with a message that says so.
      - name: Terraform plan
        working-directory: infra/envs/${{ inputs.terraform-environment }}
        env:
          EMAILS: ${{ secrets.BUDGET_NOTIFICATION_EMAILS }}
        run: |
          set -euo pipefail
          TF_VAR_budget_notification_emails="$(jq -cR \
            'split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length>0))' <<<"$EMAILS")"
          export TF_VAR_budget_notification_emails

          terraform plan -input=false -no-color -lock-timeout=5m \
            -var "app_version=${GITHUB_SHA}" \
            -out=tfplan

      # The same guard the pull request had, applied again here. A plan is only
      # a promise; this is the last point before it is kept.
      #
      # Same aws_lambda_invocation exemption, and for the same reason: its
      # `triggers` carry the commit SHA and are ForceNew, so it is replaced on
      # every deploy on purpose. Without the exemption the second push to `main`
      # would be refused by the guard protecting it. terraform.yml carries the
      # long version of this note.
      - name: Destroy guard
        working-directory: infra/envs/${{ inputs.terraform-environment }}
        env:
          CONFIRMED: ${{ inputs.confirm_destroy }}
        run: |
          set -euo pipefail

          destruye=$(terraform show -json tfplan \
            | jq -r '.resource_changes[]?
                     | select(.type != "aws_lambda_invocation")
                     | select(.change.actions | index("delete"))
                     | .address')

          if [ -z "${destruye}" ]; then
            echo "No resource is destroyed by this plan."
            exit 0
          fi

          echo "::warning::this plan destroys or replaces resources:"
          echo "${destruye}"

          if [ "${CONFIRMED}" = "yes" ]; then
            echo "::notice::allowed: the run was started by hand with confirm_destroy=yes."
            exit 0
          fi

          echo "::error::refusing to apply a plan that destroys resources. If this is intended, re-run CI manually with confirm_destroy: yes."
          exit 1

      # 2 and 3. MIGRATE, THEN ROLL OUT THE API.
      # Both live in this apply, in that order, enforced by the graph.
      - name: Apply migrations and roll out the API
        id: apply
        working-directory: infra/envs/${{ inputs.terraform-environment }}
        run: |
          set -euo pipefail
          terraform apply -input=false -no-color -lock-timeout=5m tfplan
          {
            echo "url=$(terraform output -raw url)"
            echo "amplify_app_id=$(terraform output -raw amplify_app_id)"
            echo "amplify_branch=$(terraform output -raw amplify_branch)"
          } >> "$GITHUB_OUTPUT"

      # 3b. ROLL OUT THE DASHBOARD.
      # A manual Amplify deployment: no repository is connected, so the artifact
      # this pipeline already built and verified is the one that ships.
      - name: Roll out the dashboard
        env:
          APP_ID: ${{ steps.apply.outputs.amplify_app_id }}
          BRANCH: ${{ steps.apply.outputs.amplify_branch }}
        run: |
          set -euo pipefail

          (cd web/dist && zip -qr "${RUNNER_TEMP}/dashboard.zip" .)

          despliegue=$(aws amplify create-deployment \
            --app-id "${APP_ID}" --branch-name "${BRANCH}" --output json)

          job=$(echo "${despliegue}" | jq -r '.jobId')
          destino=$(echo "${despliegue}" | jq -r '.zipUploadUrl')

          curl --fail-with-body --silent --show-error \
            -X PUT --upload-file "${RUNNER_TEMP}/dashboard.zip" "${destino}"

          aws amplify start-deployment \
            --app-id "${APP_ID}" --branch-name "${BRANCH}" --job-id "${job}" >/dev/null

          echo "Amplify job ${job} started"

          # Poll, and fail the job if Amplify fails. Without this the step is
          # green as soon as the upload succeeds, which says nothing.
          for _ in $(seq 1 60); do
            estado=$(aws amplify get-job \
              --app-id "${APP_ID}" --branch-name "${BRANCH}" --job-id "${job}" \
              --query 'job.summary.status' --output text)
            echo "  ${estado}"
            case "${estado}" in
              SUCCEED) exit 0 ;;
              FAILED|CANCELLED) echo "::error::Amplify job ${job} finished as ${estado}"; exit 1 ;;
            esac
            sleep 5
          done

          echo "::error::Amplify job ${job} did not finish within five minutes"
          exit 1

      # 4. VERIFY.
      - name: Verify the release is healthy
        env:
          URL: ${{ steps.apply.outputs.url }}
        run: |
          set -euo pipefail

          sondear() {
            ruta="$1"
            for intento in $(seq 1 30); do
              codigo=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                --max-time 20 "${URL}${ruta}" || echo "000")
              if [ "${codigo}" = "200" ]; then
                echo "  ${ruta} -> 200 (attempt ${intento})"
                return 0
              fi
              echo "  ${ruta} -> ${codigo}, retrying"
              sleep 5
            done
            echo "::error::${ruta} never returned 200. The release is NOT healthy; roll back by re-running an earlier commit."
            return 1
          }

          # /health answers without touching the database: it separates "the
          # Lambda is alive" from "the Lambda can reach PostgreSQL".
          sondear /api/health
          # /ready opens a connection, so this is what proves the VPC wiring,
          # the security groups and the DSN are all correct.
          sondear /api/ready

          echo "::notice::${URL} is healthy"
          {
            echo
            echo "Deployed and healthy: ${URL}"
          } >> "$GITHUB_STEP_SUMMARY"
