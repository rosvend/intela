# Etapa reutilizable: el pipeline tambien es codigo, y tambien se linta.
#
# Vivia dentro de `quality-python.yml` por comodidad -las dos eran "calidad"-
# pero se disparan por cosas distintas: esta sigue a `.github/`, aquella sigue
# a los ficheros Python. Juntas, filtrar por ruta apagaba actionlint justo
# cuando se editan los workflows, que es cuando hace falta.

name: Calidad workflows

on:
  workflow_call:
    inputs:
      actionlint-version:
        description: Tag de la imagen oficial de actionlint.
        type: string
        default: "1.7.12"

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Valida sintaxis, expresiones `${{ }}`, `needs` inexistentes y, con
      # shellcheck integrado, los bloques `run`. Imagen oficial fijada por tag:
      # sin `curl | bash`.
      - name: Validar .github/workflows
        env:
          VERSION: ${{ inputs.actionlint-version }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo" \
            -w /repo \
            "rhysd/actionlint:${VERSION}" \
            -color
