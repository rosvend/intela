# Reusable stage: the frontend test suite.
#
# Split from lint and from build for the same reason those two are split: the
# check name has to say whether behaviour broke, style broke, or the thing
# simply does not compile.
#
# `web/` is live and its `test` script runs vitest. The fallback below is
# defense-in-depth, kept from when the stage was written against a directory
# that did not exist: if the `test` script ever disappears, the stage emits a
# notice and passes rather than failing red. The notice lands in the job
# summary every run, so a regression is loud instead of silent.
#
# NO WATCH MODE. GitHub Actions sets CI=true, which is what makes vitest and
# jest run once and exit instead of waiting for file changes. If the runner
# chosen for `web/` does not honour CI, its `test` script has to pass the
# equivalent flag itself - a hanging job is a 6-hour timeout, not a failure.

name: Test frontend

on:
  workflow_call:
    inputs:
      node-version:
        description: Node version. Matches web/Dockerfile.
        type: string
        default: "22.22"
      working-directory:
        description: Directory holding package.json.
        type: string
        default: "web"

permissions:
  contents: read

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm init` writes a default `test` script that exits 1 with
      # "no test specified". Treated as absent on purpose: it is a placeholder,
      # not a suite, and letting it fail the stage teaches people to delete the
      # stage.
      - name: npm test
        run: |
          set -euo pipefail
          script=$(node -e 'process.stdout.write(((require("./package.json").scripts||{}).test)||"")')

          case "$script" in
            "")
              echo "::notice title=Frontend tests::web/package.json defines no 'test' script - regression: vitest was wired and the script must not disappear. Skipping."
              ;;
            *"no test specified"*)
              echo "::notice title=Frontend tests::the 'test' script is still the npm placeholder. TODO: replace it with a real runner. Skipping."
              ;;
            *)
              npm test
              ;;
          esac

      # Visual tests (#224): what jsdom cannot see because it does no layout -
      # where a line breaks, how wide a column ends up - is measured in a real
      # Chromium against the Vite dev server, with the API mocked per test.
      # Only the headless shell: the tests never open a window.
      # The browser is cached per Playwright version (the one the lockfile
      # pins); on a hit only the apt packages are installed, which the cache
      # cannot hold.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell

      - name: Install Chromium for Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: npm run test:visual
        run: npm run test:visual

      # A layout test that fails with no trace cannot be diagnosed: CI runs on
      # Ubuntu, contributors on other systems. `trace: retain-on-failure` in
      # playwright.config.ts writes them here.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-test-results
          path: ${{ inputs.working-directory }}/test-results/
          retention-days: 7
