# Orquestador de CI. Es el unico workflow con disparadores: las etapas viven en
# workflows reutilizables (`workflow_call`) y se invocan desde aqui.
#
# El diseno resuelve tres problemas:
#
#   1. Hoy no existe codigo Go ni Dockerfile. Si sus checks se declararan
#      obligatorios, GitHub los dejaria en "Expected - waiting for status to be
#      reported" y ningun PR podria mergearse nunca.
#
#   2. Un PR que solo toca Go no tiene por que lintar Python, ni al reves.
#
#   3. El unico check obligatorio en la proteccion de `main` es el job `ci` del
#      final, que agrega el resultado de todos los demas. Anadir una etapa es
#      anadir un job y meterlo en su `needs`: la proteccion de rama no se toca.
#
# Los tres los resuelve `detect` + la compuerta `ci`.
#
# IMPORTANTE: el filtrado por ruta va a nivel de JOB (`if:`), nunca a nivel de
# disparador (`on.pull_request.paths`). Un workflow saltado por un filtro de
# disparador no reporta NINGUN estado, asi que el check obligatorio `ci` se
# quedaria esperando para siempre y `main` quedaria bloqueada. Aqui el workflow
# siempre corre y siempre reporta; lo que se salta son los jobs de dentro.

name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detectar que aplica
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # para listar los ficheros del PR
    outputs:
      python: ${{ steps.capas.outputs.python }}
      workflows: ${{ steps.capas.outputs.workflows }}
      go: ${{ steps.capas.outputs.go }}
      web: ${{ steps.capas.outputs.web }}
      docker: ${{ steps.capas.outputs.docker }}
      docker_web: ${{ steps.capas.outputs.docker_web }}
    steps:
      - uses: actions/checkout@v7

      # Una etapa aplica si se cumplen DOS cosas:
      #
      #   existe   la capa esta en el repo            (¿hay go.mod? ¿hay Dockerfile?)
      #   toca     el PR modifica algo que la afecta  (solo en pull_request)
      #
      # En `push` a main y en `workflow_dispatch` no se filtra por ruta: corre
      # todo lo que exista. Son eventos raros -merges y relanzamientos manuales-
      # y ahi interesa la red completa, no el ahorro.
      - name: Decidir que etapas aplican
        id: capas
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          existe() { [ -e "$1" ]; }

          # Los ficheros del PR salen de la API, no de un `git diff`: no depende
          # de la profundidad del clon ni de que la base este fetcheada.
          FILTRAR=false
          CAMBIOS=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            FILTRAR=true
            CAMBIOS=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" \
                        --paginate --jq '.[].filename')
            echo "Ficheros modificados en el PR:"
            printf '%s\n' "$CAMBIOS" | sed 's/^/  /'
          else
            echo "Evento '$GITHUB_EVENT_NAME': sin filtro por ruta, corre todo lo que exista."
          fi

          toca() {
            [ "$FILTRAR" = "true" ] || return 0
            printf '%s\n' "$CAMBIOS" | grep -Eq "$1"
          }

          # Cada patron incluye la configuracion de su propia etapa y el
          # orquestador: aflojar una regla en ruff.toml o tocar ci.yml tiene que
          # volver a disparar la etapa que gobierna, no colarse sin verificar.
          P_PYTHON='(\.py$|^ruff\.toml$|^\.github/workflows/(ci|quality-python)\.yml$)'
          P_WORKFLOWS='^\.github/'
          P_GO='(\.go$|^go\.(mod|sum)$|^\.golangci\.yml$|^\.github/workflows/(ci|quality-go|arquitectura)\.yml$)'
          P_WEB='(^web/|^\.github/workflows/(ci|quality-web)\.yml$)'

          # Ojo con el anclaje. `^Dockerfile` NO casa `web/Dockerfile`, asi que
          # la imagen del tablero no se construia nunca: entraba en el repo sin
          # que nadie comprobara que compila. Van separados porque son dos
          # contextos de build distintos.
          P_DOCKER='(^Dockerfile$|^\.dockerignore$|\.go$|^go\.(mod|sum)$|^\.github/workflows/(ci|container)\.yml$)'
          P_DOCKER_WEB='(^web/|^\.github/workflows/(ci|container)\.yml$)'

          python=false
          if find . -path ./.git -prune -o -name '*.py' -print -quit | grep -q . && toca "$P_PYTHON"; then
            python=true
          fi

          workflows=false
          if toca "$P_WORKFLOWS"; then workflows=true; fi

          go=false
          if existe go.mod && toca "$P_GO"; then go=true; fi

          web=false
          if existe web/package.json && toca "$P_WEB"; then web=true; fi

          docker=false
          if existe Dockerfile && toca "$P_DOCKER"; then docker=true; fi

          docker_web=false
          if existe web/Dockerfile && toca "$P_DOCKER_WEB"; then docker_web=true; fi

          {
            echo "python=$python"
            echo "workflows=$workflows"
            echo "go=$go"
            echo "web=$web"
            echo "docker=$docker"
            echo "docker_web=$docker_web"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Etapas que aplican"
            echo
            echo "| Etapa | Aplica | Por que |"
            echo "| ----- | ------ | ------- |"
            echo "| quality-python | \`$python\` | hay \`*.py\` y el PR toca Python o \`ruff.toml\` |"
            echo "| quality-workflows | \`$workflows\` | el PR toca \`.github/\` |"
            echo "| quality-go | \`$go\` | hay \`go.mod\` y el PR toca Go |"
            echo "| quality-web | \`$web\` | hay \`web/package.json\` y el PR toca el tablero |"
            echo "| container | \`$docker\` | hay \`Dockerfile\` y el PR toca el contenedor |"
            echo "| container-web | \`$docker_web\` | hay \`web/Dockerfile\` y el PR toca el tablero |"
            echo "| arquitectura | \`true\` | **siempre**. El diagrama avisa sin bloquear (ADR 0011); depguard si bloquea |"
          } >> "$GITHUB_STEP_SUMMARY"

  nombre-de-rama:
    name: Convencion de nombre de rama
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # `github.head_ref` lo controla quien abre el PR, asi que entra por `env`
      # y nunca interpolado dentro del script.
      - name: Validar el prefijo
        env:
          RAMA: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          PATRON='^(feature|fix|hotfix|docs|chore|refactor)/[a-z0-9._/-]+$'

          if printf '%s' "$RAMA" | grep -Eq "$PATRON"; then
            echo "OK: '$RAMA' cumple la convencion."
            exit 0
          fi

          cat >&2 <<EOF
          La rama '$RAMA' no cumple la convencion de nombres.

          Patron esperado:  $PATRON

            feature/<descripcion-o-issue>   trabajo nuevo
            fix/<descripcion>               correccion
            hotfix/<descripcion>            correccion urgente sobre main
            docs/<descripcion>              documentacion, ADR, reglamentos
            chore/<descripcion>             tooling, CI, dependencias
            refactor/<descripcion>          cambio interno sin cambio de comportamiento

          Solo minusculas, digitos, punto, guion, guion bajo y barra.

          Para renombrar sin perder el PR:

            git branch -m feature/mi-cambio
            git push origin -u feature/mi-cambio
            git push origin --delete "$RAMA"

          y vuelve a abrir el PR desde la rama renombrada.
          EOF
          exit 1

  quality-python:
    name: Calidad y formato (Python)
    needs: detect
    if: needs.detect.outputs.python == 'true'
    uses: ./.github/workflows/quality-python.yml

  quality-workflows:
    name: Calidad (workflows)
    needs: detect
    if: needs.detect.outputs.workflows == 'true'
    uses: ./.github/workflows/quality-workflows.yml

  quality-go:
    name: Calidad y formato (Go)
    needs: detect
    if: needs.detect.outputs.go == 'true'
    uses: ./.github/workflows/quality-go.yml

  quality-web:
    name: Calidad (tablero React)
    needs: detect
    if: needs.detect.outputs.web == 'true'
    uses: ./.github/workflows/quality-web.yml

  # Sin `if`: corre SIEMPRE, tambien en un PR de solo documentacion.
  #
  # Es la unica etapa que no se filtra, y es deliberado. Los ADR 0002 y 0003
  # declaran esta comprobacion como su mitigacion, y 0003 dice que pasa si no
  # existe: "esta decision se degrada sola a monolito sin modulos". Un filtro
  # mal escrito la apagaria en silencio -seguiria saliendo verde sin comprobar
  # nada- que es exactamente el modo de fallo contra el que se puso. Cuesta 9
  # segundos; el ahorro no compensa el riesgo.
  #
  # Ojo con lo que esta etapa garantiza hoy: por el ADR 0011 la capa del
  # diagrama AVISA pero no bloquea, asi que un `arquitectura` en verde no
  # significa que el diagrama cumpla. Hay que leer el aviso. Lo que si bloquea
  # es la capa de codigo (depguard), y esa sigue a los cambios de Go: solo
  # tiene sentido cuando hay Go que mirar.
  arquitectura:
    name: Frontera Clean Architecture
    needs: detect
    uses: ./.github/workflows/arquitectura.yml
    with:
      verificar-codigo: ${{ needs.detect.outputs.go == 'true' }}

  container:
    name: Contenedor (backend)
    needs: detect
    if: needs.detect.outputs.docker == 'true'
    uses: ./.github/workflows/container.yml

  container-web:
    name: Contenedor (tablero)
    needs: detect
    if: needs.detect.outputs.docker_web == 'true'
    uses: ./.github/workflows/container.yml
    with:
      contexto: web
      dockerfile: web/Dockerfile

  # Compuerta. Este es el UNICO check obligatorio en la proteccion de `main`.
  # `if: always()` para que corra aunque una etapa falle o quede en `skipped`.
  # Ojo: `skipped` NO bloquea; solo `failure` y `cancelled`.
  ci:
    name: ci
    needs:
      - detect
      - nombre-de-rama
      - quality-python
      - quality-workflows
      - quality-go
      - quality-web
      - arquitectura
      - container
      - container-web
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Resumen de etapas
        env:
          RESULTADOS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          {
            echo "### Resultado por etapa"
            echo
            echo "| Etapa | Resultado |"
            echo "| ----- | --------- |"
            printf '%s' "$RESULTADOS" \
              | jq -r 'to_entries[] | "| `\(.key)` | \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verificar que ninguna etapa fallo
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::Al menos una etapa de CI fallo o fue cancelada. Ver el resumen." >&2
          exit 1
