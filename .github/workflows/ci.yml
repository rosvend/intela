# CI/CD orchestrator. The only workflow with triggers: every stage lives in a
# reusable workflow (`workflow_call`) and is invoked from here.
#
# The design solves three problems:
#
#   1. Not every layer exists in every branch, and layers arrive over time. If a
#      stage's check were declared required directly, GitHub would park it on
#      "Expected - waiting for status to be reported" whenever it is skipped,
#      and no PR could ever merge.
#
#   2. A PR that only touches Go has no reason to lint Python, or the reverse.
#
#   3. The only required check in `main`'s branch protection is the `ci` job at
#      the bottom, which aggregates every other result. Adding a stage means
#      adding a job and listing it under `needs`: branch protection is never
#      touched.
#
# `detect` plus the `ci` gate solve all three.
#
# DEPLOYMENT LIVES HERE TOO, at the bottom, gated on `needs: [ci]` and on the
# event being a push to `main`. It is in this file rather than a workflow of its
# own so that the release path cannot start before the gate is green. The
# alternative, `workflow_run`, resolves against the DEFAULT BRANCH's copy of the
# workflow and never appears on the pull request - you would be reviewing a
# release path that is not the one that runs.
#
# IMPORTANT: path filtering happens at the JOB level (`if:`), never at the
# trigger level (`on.pull_request.paths`). A workflow skipped by a trigger
# filter reports NO status at all, so the required `ci` check would wait
# forever and `main` would be blocked. Here the workflow always runs and always
# reports; what gets skipped are the jobs inside it.

name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only pull requests are cancellable. Once a push to `main` reaches the deploy
# job, cancelling it would abort a rollout midway; a superseded PR build only
# costs a runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: Detect applicable stages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # to list the files in the PR
    outputs:
      python: ${{ steps.layers.outputs.python }}
      workflows: ${{ steps.layers.outputs.workflows }}
      go: ${{ steps.layers.outputs.go }}
      frontend: ${{ steps.layers.outputs.frontend }}
      contract: ${{ steps.layers.outputs.contract }}
      docker-backend: ${{ steps.layers.outputs.docker_backend }}
      docker-frontend: ${{ steps.layers.outputs.docker_frontend }}
    steps:
      - uses: actions/checkout@v7

      # A stage applies only when BOTH conditions hold:
      #
      #   exists    the layer is in the repo         (is there a go.mod? a Dockerfile?)
      #   touched   the PR changes something it owns (pull_request only)
      #
      # On `push` to main and on `workflow_dispatch` there is no path filter:
      # everything that exists runs. Those are rare events - merges and manual
      # reruns - and there the full net matters more than the savings.
      - name: Decide which stages apply
        id: layers
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          exists() { [ -e "$1" ]; }

          # The PR file list comes from the API, not from `git diff`: it does not
          # depend on clone depth or on the base ref having been fetched.
          FILTER=false
          CHANGES=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            FILTER=true
            CHANGES=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" \
                        --paginate --jq '.[].filename')
            echo "Files changed in this PR:"
            printf '%s\n' "$CHANGES" | sed 's/^/  /'
          else
            echo "Event '$GITHUB_EVENT_NAME': no path filter, everything that exists runs."
          fi

          touched() {
            [ "$FILTER" = "true" ] || return 0
            printf '%s\n' "$CHANGES" | grep -Eq "$1"
          }

          # Every pattern includes its own stage config and the orchestrator:
          # loosening a rule in ruff.toml or editing ci.yml must re-trigger the
          # stage that rule governs instead of slipping through unverified.
          P_PYTHON='(\.py$|^ruff\.toml$|^\.github/workflows/(ci|lint-python)\.yml$)'
          P_WORKFLOWS='^\.github/'
          P_GO='(\.go$|^go\.(mod|sum)$|^\.golangci\.yml$|^\.github/workflows/(ci|lint-go|test-go|architecture)\.yml$)'
          P_FRONTEND='(^web/|^\.github/workflows/(ci|build-frontend|lint-frontend|test-frontend|container|deploy)\.yml$)'
          P_CONTRACT='(^api/|^\.github/workflows/(ci|contract)\.yml$)'
          # The Go sources are in here on purpose: the backend image is built
          # FROM them, so a change to `internal/` that breaks the build has to
          # re-run this stage, not wait for the merge to main to find out.
          P_DOCKER='(^Dockerfile|^\.dockerignore$|\.go$|^go\.(mod|sum)$|^\.github/workflows/(ci|container|deploy)\.yml$)'

          python=false
          if find . -path ./.git -prune -o -name '*.py' -print -quit | grep -q . && touched "$P_PYTHON"; then
            python=true
          fi

          workflows=false
          if touched "$P_WORKFLOWS"; then workflows=true; fi

          go=false
          if exists go.mod && touched "$P_GO"; then go=true; fi

          frontend=false
          if exists web/package.json && touched "$P_FRONTEND"; then frontend=true; fi

          contract=false
          if exists api/openapi.yaml && touched "$P_CONTRACT"; then contract=true; fi

          docker_backend=false
          if exists Dockerfile && touched "$P_DOCKER"; then docker_backend=true; fi

          docker_frontend=false
          if exists web/Dockerfile && touched "$P_FRONTEND"; then docker_frontend=true; fi

          {
            echo "python=$python"
            echo "workflows=$workflows"
            echo "go=$go"
            echo "frontend=$frontend"
            echo "contract=$contract"
            echo "docker_backend=$docker_backend"
            echo "docker_frontend=$docker_frontend"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Applicable stages"
            echo
            echo "| Stage | Applies | Why |"
            echo "| ----- | ------- | --- |"
            echo "| lint-python | \`$python\` | there are \`*.py\` files and the PR touches Python or \`ruff.toml\` |"
            echo "| lint-workflows | \`$workflows\` | the PR touches \`.github/\` |"
            echo "| lint-go | \`$go\` | \`go.mod\` exists and the PR touches Go |"
            echo "| test-go | \`$go\` | \`go.mod\` exists and the PR touches Go |"
            echo "| architecture | \`$go\` | depguard needs Go code to inspect |"
            echo "| lint-frontend | \`$frontend\` | \`web/package.json\` exists and the PR touches \`web/\` |"
            echo "| test-frontend | \`$frontend\` | \`web/package.json\` exists and the PR touches \`web/\` |"
            echo "| build-frontend | \`$frontend\` | \`web/package.json\` exists and the PR touches \`web/\` |"
            echo "| contract | \`$contract\` | \`api/openapi.yaml\` exists and the PR touches the contract |"
            echo "| container-backend | \`$docker_backend\` | \`Dockerfile\` exists and the PR touches the container |"
            echo "| container-frontend | \`$docker_frontend\` | \`web/Dockerfile\` exists and the PR touches \`web/\` |"
            echo "| deploy | \`false\` on a PR | only on a push to \`main\`, after the \`ci\` gate |"
          } >> "$GITHUB_STEP_SUMMARY"

  branch-name:
    name: Branch naming convention
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # `github.head_ref` is controlled by whoever opens the PR, so it arrives
      # through `env` and is never interpolated inside the script body.
      - name: Validate the prefix
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          PATTERN='^(feature|fix|hotfix|docs|chore|refactor)/[a-z0-9._/-]+$'

          if printf '%s' "$BRANCH" | grep -Eq "$PATTERN"; then
            echo "OK: '$BRANCH' follows the convention."
            exit 0
          fi

          cat >&2 <<EOF
          Branch '$BRANCH' does not follow the naming convention.

          Expected pattern:  $PATTERN

            feature/<description-or-issue>  new work
            fix/<description>               bug fix
            hotfix/<description>            urgent fix on top of main
            docs/<description>              documentation, ADRs, regulations
            chore/<description>             tooling, CI, dependencies
            refactor/<description>          internal change, no behavior change

          Lowercase letters, digits, dot, dash, underscore and slash only.

          To rename without losing the PR:

            git branch -m feature/my-change
            git push origin -u feature/my-change
            git push origin --delete "$BRANCH"

          then reopen the PR from the renamed branch.
          EOF
          exit 1

  lint-python:
    name: Lint (Python)
    needs: detect
    if: needs.detect.outputs.python == 'true'
    uses: ./.github/workflows/lint-python.yml

  lint-workflows:
    name: Lint (workflows)
    needs: detect
    if: needs.detect.outputs.workflows == 'true'
    uses: ./.github/workflows/lint-workflows.yml

  lint-go:
    name: Lint (Go)
    needs: detect
    if: needs.detect.outputs.go == 'true'
    uses: ./.github/workflows/lint-go.yml

  test-go:
    name: Test (Go)
    needs: detect
    if: needs.detect.outputs.go == 'true'
    uses: ./.github/workflows/test-go.yml

  # The Clean Architecture boundary, enforced by depguard over real imports.
  # Gated on Go existing because there is nothing to inspect otherwise.
  architecture:
    name: Architecture boundary
    needs: detect
    if: needs.detect.outputs.go == 'true'
    uses: ./.github/workflows/architecture.yml

  lint-frontend:
    name: Lint (frontend)
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    uses: ./.github/workflows/lint-frontend.yml

  test-frontend:
    name: Test (frontend)
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    uses: ./.github/workflows/test-frontend.yml

  build-frontend:
    name: Frontend build
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    uses: ./.github/workflows/build-frontend.yml

  # The API contract is validated even though nothing generates from it yet.
  # ADR 0010 priced type generation from OpenAPI as part of the stack change; this
  # is the half that can exist before there are endpoints to generate. A spec that
  # is merely broken does not announce itself - it announces itself later, to
  # whoever first tries to generate a client from it.
  contract:
    name: OpenAPI contract
    needs: detect
    if: needs.detect.outputs.contract == 'true'
    uses: ./.github/workflows/contract.yml

  # `push` is the only difference between verifying and releasing an image, so
  # both go through the same stage. A pull request builds and discards; a merge
  # to `main` publishes the very same build to GHCR.
  container-backend:
    name: Docker build (backend)
    needs: detect
    if: needs.detect.outputs.docker-backend == 'true'
    uses: ./.github/workflows/container.yml
    permissions:
      contents: read
      packages: write
    with:
      image-name: intela-api
      context: .
      dockerfile: Dockerfile
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  container-frontend:
    name: Docker build (frontend)
    needs: detect
    if: needs.detect.outputs.docker-frontend == 'true'
    uses: ./.github/workflows/container.yml
    permissions:
      contents: read
      packages: write
    with:
      image-name: intela-web
      context: web
      dockerfile: web/Dockerfile
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  # The gate. This is the ONLY required check in `main`'s branch protection,
  # so its name must stay `ci` - renaming it locks the branch.
  # `if: always()` so it runs even when a stage fails or is skipped.
  # Note: `skipped` does NOT block; only `failure` and `cancelled` do.
  ci:
    name: ci
    needs:
      - detect
      - branch-name
      - lint-python
      - lint-workflows
      - lint-go
      - test-go
      - architecture
      - lint-frontend
      - test-frontend
      - build-frontend
      - contract
      - container-backend
      - container-frontend
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Stage summary
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          {
            echo "### Result by stage"
            echo
            echo "| Stage | Result |"
            echo "| ----- | ------ |"
            printf '%s' "$RESULTS" \
              | jq -r 'to_entries[] | "| `\(.key)` | \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify no stage failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::At least one CI stage failed or was cancelled. See the summary." >&2
          exit 1

  # --------------------------------------------------------------------------
  # Continuous delivery. Everything below runs ONLY on a push to `main`, and
  # only once the `ci` gate above is green.
  # --------------------------------------------------------------------------

  # The release itself. `container-*` has already published the images by this
  # point - publishing is a `push: true` on the same stage that verified them,
  # not a separate build.
  #
  # `always()` is what lets this run while the container stages are still
  # skipped: there is no Dockerfile in the repository yet, and a job whose
  # `needs` were skipped is itself skipped unless it says otherwise. Today the
  # deploy scaffold therefore runs on every merge with empty image inputs and
  # reports that there was nothing to roll out - which is the honest answer, and
  # keeps the release path exercised instead of theoretical.
  #
  # The gate stays authoritative: `needs.ci.result == 'success'` means no stage
  # failed, and the container stages are checked separately because a FAILED
  # image build must stop the release even though a SKIPPED one must not.
  deploy:
    name: Deploy (production)
    needs:
      - ci
      - container-backend
      - container-frontend
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.ci.result == 'success'
      && needs.container-backend.result != 'failure'
      && needs.container-frontend.result != 'failure'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
    with:
      environment: production
      backend-image: ${{ needs.container-backend.outputs.image }}
      frontend-image: ${{ needs.container-frontend.outputs.image }}
