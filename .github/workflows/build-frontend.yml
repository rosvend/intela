# Reusable stage: the React frontend builds and typechecks.
#
# `npm run build` is `tsc -b && vite build` (web/package.json), so this stage is
# both the build and the typecheck - Vite alone would transpile TypeScript
# without ever checking it.
#
# `web/` is live: ci.yml invokes this stage when `detect` finds the layer and
# the PR touches it.
#
# There is no lint job and no test job here: lint and tests are stages of their
# own (`lint-frontend.yml`, `test-frontend.yml`), so a failing check says
# whether behaviour broke, style broke, or the thing does not compile.
#
# REQUIRES `web/package-lock.json`. `npm ci` fails without it, on purpose:
# `npm install` re-resolves the dependency tree on every run, so two builds of
# the same commit can ship different code. ADR 0005 asks for reproducibility in
# the reparto engine; the same argument applies to what gets served next to it.
# Whoever changes web/ has to keep the lockfile committed with it.

name: Build frontend

on:
  workflow_call:
    inputs:
      node-version:
        description: Node version. Matches web/Dockerfile.
        type: string
        default: "22.22"
      working-directory:
        description: Directory holding package.json.
        type: string
        default: "web"

permissions:
  contents: read

jobs:
  build:
    name: tsc + vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      # `npm ci` installs exactly the lockfile, never rewrites it, and fails
      # loudly when package.json and the lock have drifted apart.
      - name: Install dependencies
        run: npm ci

      - name: Build (tsc -b && vite build)
        run: npm run build
