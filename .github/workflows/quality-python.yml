# Etapa reutilizable: calidad y formato del codigo Python.
#
# Solo corre cuando el PR toca `*.py` o `ruff.toml` (ver `detect` en ci.yml).
# El lint de los propios workflows vive en `quality-workflows.yml`, porque se
# dispara por otra cosa.
#
# Los scripts de `src/scripts/` declaran sus dependencias en linea (PEP 723) y
# se ejecutan con `uv`, segun CLAUDE.md. Aqui no se instala nada del proyecto:
# `ruff` es una herramienta, no una dependencia, y corre via `uvx`.
#
# ADR 0010 mantiene estos scripts en Python de forma permanente, aunque el
# backend sea Go. Y uno de ellos, `check_arquitectura.py`, ES la comprobacion
# de frontera que exigen los ADR 0002 y 0003: si se rompe en silencio, la
# compuerta sigue en verde sin comprobar nada.

name: Calidad Python

on:
  workflow_call:
    inputs:
      ruff-version:
        description: Version fijada de ruff, para que CI sea reproducible.
        type: string
        default: "0.16.4"

permissions:
  contents: read

jobs:
  ruff:
    name: ruff (lint + formato)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv se fija a semver completo a proposito: a partir de v8 astral-sh
      # dejo de publicar el tag flotante de major, asi que `@v10` no resuelve.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: quality-python

      - name: ruff check
        env:
          RUFF: ${{ inputs.ruff-version }}
        run: uvx "ruff@${RUFF}" check --output-format=github src/

      # `format --check` no escribe: falla y lista los ficheros a reformatear.
      - name: ruff format --check
        env:
          RUFF: ${{ inputs.ruff-version }}
        run: uvx "ruff@${RUFF}" format --check --diff src/
