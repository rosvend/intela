# Etapa reutilizable: calidad y formato del codigo Python y del propio pipeline.
#
# Los scripts de `src/scripts/` declaran sus dependencias en linea (PEP 723) y
# se ejecutan con `uv`, segun CLAUDE.md. Aqui no se instala nada del proyecto:
# `ruff` es una herramienta, no una dependencia, y corre via `uvx`.
#
# Solo se invoca desde `ci.yml`. Para probarla suelta: `gh workflow run` no
# aplica a un workflow_call; usar `workflow_dispatch` en el orquestador.

name: Calidad Python

on:
  workflow_call:
    inputs:
      ruff-version:
        description: Version fijada de ruff, para que CI sea reproducible.
        type: string
        default: "0.16.4"
      actionlint-version:
        description: Tag de la imagen oficial de actionlint.
        type: string
        default: "1.7.12"

permissions:
  contents: read

jobs:
  ruff:
    name: ruff (lint + formato)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `enable-cache` cachea ~/.cache/uv, que incluye las herramientas de `uvx`:
      # a partir de la segunda corrida ruff no se vuelve a descargar.
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-suffix: quality-python

      - name: ruff check
        env:
          RUFF: ${{ inputs.ruff-version }}
        run: uvx "ruff@${RUFF}" check --output-format=github src/

      # `format --check` no escribe: falla y lista los ficheros a reformatear.
      - name: ruff format --check
        env:
          RUFF: ${{ inputs.ruff-version }}
        run: uvx "ruff@${RUFF}" format --check --diff src/

  actionlint:
    name: actionlint (workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # El pipeline tambien es codigo. actionlint valida sintaxis, expresiones,
      # `needs` inexistentes y, con shellcheck integrado, los bloques `run`.
      # Imagen oficial fijada por tag: sin `curl | bash`.
      - name: Validar .github/workflows
        env:
          VERSION: ${{ inputs.actionlint-version }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo" \
            -w /repo \
            "rhysd/actionlint:${VERSION}" \
            -color
