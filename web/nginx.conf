# Configuracion del contenedor que sirve la SPA.
#
# try_files es lo que hace que /procesos/abc no de 404. Sin el, nginx busca un
# fichero con ese nombre, no lo encuentra, y devuelve 404: cualquier
# navegacion que no sea la raiz rompe, y tambien cualquier recarga de pagina.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Los assets con hash en el nombre son inmutables: se pueden cachear para
  # siempre. index.html NO, o el navegador seguiria pidiendo la version vieja
  # de los assets tras un despliegue.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
